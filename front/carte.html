    <style>
        .marker-cluster-small       { background-color: rgba(100, 175, 75, 0.5); }
        .marker-cluster-small div   { background-color: rgba(50, 135, 70, 0.75); color: #fff; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #eef4ec;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── NAV ── */
        nav {
            width: 100%;
            background: #1e6e3e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            position: sticky;
            top: 0;
            z-index: 2000;
            flex-shrink: 0;
        }
        .nav-logo { font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; font-style: italic; text-decoration: none; }
        .nav-logo span { color: #a8e6bf; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-profil { color: rgba(255,255,255,0.85); font-size: 1.3rem; text-decoration: none; line-height: 1; transition: color 0.15s; }
    .nav-profil:hover { color: #fff; }
        .burger { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 4px; }
        .burger span { display: block; width: 26px; height: 3px; background: #fff; border-radius: 2px; transition: all 0.3s ease; }
        .burger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .burger.open span:nth-child(2) { opacity: 0; }
        .burger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        /* ── DRAWER ── */
        .drawer { position: fixed; top: 0; right: -320px; width: 280px; max-width: 85vw; height: 100vh; background: #fff; z-index: 3000; transition: right 0.32s cubic-bezier(.4,0,.2,1); box-shadow: -4px 0 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; }
        .drawer.open { right: 0; }
        .drawer-header { background: #1e6e3e; padding: 20px 20px 18px; display: flex; align-items: center; justify-content: space-between; }
        .drawer-logo { font-size: 1.2rem; font-weight: 900; color: #fff; letter-spacing: 2px; font-style: italic; }
        .drawer-logo span { color: #a8e6bf; }
        .drawer-close { background: none; border: none; cursor: pointer; color: #fff; font-size: 1.6rem; line-height: 1; padding: 2px 6px; }
        .drawer-menu { list-style: none; padding: 8px 0; flex: 1; overflow-y: auto; }
        .drawer-menu li a { display: flex; align-items: center; gap: 14px; padding: 15px 24px; font-size: 1rem; font-weight: 700; color: #1a3a25; text-decoration: none; transition: background 0.15s; border-left: 3px solid transparent; }
        .drawer-menu li a:hover, .drawer-menu li a.active { background: #eef4ec; border-left-color: #1e6e3e; color: #1e6e3e; }
        .menu-icon { font-size: 1.2rem; width: 24px; text-align: center; }
        .drawer-divider { height: 1px; background: #e5ede8; margin: 4px 24px; }
        .drawer-footer { padding: 16px 24px; border-top: 1px solid #e5ede8; }
        .drawer-footer a { display: flex; align-items: center; gap: 14px; font-size: 0.95rem; font-weight: 600; color: #1e6e3e; text-decoration: none; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 2500; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .overlay.open { opacity: 1; pointer-events: all; }

        /* ── MAP AREA ── */
        .map-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #map {
            flex: 1;
            width: 100%;
            height: calc(100vh - 52px); /* full height minus nav */
            z-index: 100;
        }

        /* ── INFO PANEL (popup sur clic marqueur) ── */
        .info_compost {
            position: absolute;
            top: 10px;
            left: 40%;
            transform: translateX(-50%);
            z-index: 1000;
            background: #1e6e3e;
            color: #fff;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 20px;
            width: auto;
            max-width: 55%;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* ── TABLEAU (fiche compost) ── */
        .tabl {
            position: absolute;
            z-index: 1000;
            background: #fff;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 24px rgba(30,110,62,0.2);
            bottom: 0; left: 0; right: 0; width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            padding-bottom: 12px;
        }
        .tabl-handle {
            width: 36px; height: 4px; background: #d0e8d8;
            border-radius: 2px; margin: 10px auto 4px;
        }
        .tabl-header {
            display: flex; gap: 8px; align-items: center;
            padding: 8px 16px 0; flex-wrap: wrap;
        }
        .badge-type {
            background: #1e6e3e; color: #fff;
            font-size: 0.75rem; font-weight: 800;
            padding: 4px 12px; border-radius: 20px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .badge-acces {
            background: #eef4ec; color: #2c6e49;
            font-size: 0.75rem; font-weight: 700;
            padding: 4px 10px; border-radius: 20px;
            border: 1px solid #c8dfc8;
        }
        .tabl-adresse {
            font-size: 0.75rem; color: #7aaa8a;
            padding: 5px 16px 0; font-style: italic;
        }
        .tabl-rules {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 8px; padding: 10px 16px 0;
        }
        .rules-title {
            font-size: 0.7rem; font-weight: 800; margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .rules-title.ok { color: #1e6e3e; }
        .rules-title.nok { color: #c0392b; }
        .rules-list { display: flex; flex-wrap: wrap; gap: 4px; }
        .chip {
            font-size: 0.65rem; font-weight: 700;
            padding: 2px 8px; border-radius: 12px;
        }
        .chip-ok  { background: #e8f5e9; color: #2d6a4f; border: 1px solid #b7dfc4; }
        .chip-nok { background: #fdecea; color: #c0392b; border: 1px solid #f5bdb9; }
        .no-data  { font-size: 0.72rem; color: #bbb; font-style: italic; }
        .tabl-info {
            padding: 10px 16px 0;
            display: flex; flex-direction: column; gap: 5px;
        }
        .info-row { display: flex; align-items: flex-start; gap: 8px; }
        .info-icon { font-size: 0.85rem; flex-shrink: 0; margin-top: 1px; }
        .info-val  { font-size: 0.8rem; color: #1a3a25; font-weight: 600; flex: 1; }
        .tabl-trajet {
            display: flex; gap: 6px; align-items: center;
            padding: 10px 16px 0; flex-wrap: wrap;
        }
        .btn-trajet {
            background: #eef4ec; color: #1e6e3e;
            border: 1.5px solid #c8dfc8; border-radius: 20px;
            padding: 6px 12px; font-size: 0.76rem; font-weight: 700;
            cursor: pointer; transition: background 0.15s;
        }
        .btn-trajet:hover { background: #d4edda; }
        .tabl-actions {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px 0; gap: 8px;
        }
        .tabl-actions button, .tabl-actions input[type=submit] {
            border-radius: 20px; padding: 8px 18px;
            font-size: 0.82rem; font-weight: 700; cursor: pointer; border: none;
        }
        .btn-modifier, .tabl-actions button:not(.btn-supprimer), .tabl-actions input[type=submit] {
            background: #1e6e3e; color: #fff;
        }
        .btn-supprimer {
            background: #fff; color: #c0392b;
            border: 1.5px solid #c0392b !important;
        }
        .tabl select { border: 1px solid #c8dfc8; border-radius: 6px; padding: 3px 6px; color: #1a3a25; font-size: 0.82rem; }
        .tabl a { color: #1e6e3e; font-weight: 600; font-size: 0.8rem; }

        /* ── FORMULAIRE MODIFICATION ── */
        .edit-select {
            display: block; width: 100%;
            background: #eef4ec; color: #1a3a25;
            border: 1.5px solid #c8dfc8; border-radius: 8px;
            padding: 5px 8px; font-size: 0.82rem; font-weight: 600;
            cursor: pointer; outline: none;
        }
        .edit-check {
            display: flex; align-items: center; gap: 7px;
            padding: 3px 0; font-size: 0.78rem; color: #1a3a25;
            cursor: pointer; width: 100%; line-height: 1.4;
        }
        .edit-check input[type=checkbox] {
            accent-color: #1e6e3e; width: 15px; height: 15px;
            flex-shrink: 0; cursor: pointer;
        }

        /* ── BOUTON RAJOUTER ── */
        .rajouter {
            position: absolute;
            bottom: 58px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: #fff;
            border: 2px solid #1e6e3e;
            border-radius: 12px;
            padding: 8px 16px;
            width: calc(100% - 40px);
            max-width: 400px;
            text-align: center;
            font-size: 0.9rem;
        }

        /* ── BOUTON TROUVER ── */
        .trouver {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            white-space: nowrap;
        }
        .trouver button, .rajouter button, #valid_rajout {
            background: #1e6e3e;
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .trouver button:hover, .rajouter button:hover, #valid_rajout:hover { opacity: 0.85; }

        /* ── COMPTEUR ── */
        #nb_compost {
            text-align: center;
            font-size: 0.82rem;
            color: #2c6e49;
            font-weight: 600;
            padding: 6px 16px;
            background: #eef4ec;
            flex-shrink: 0;
        }

        /* Boutons modifier / trajet */
        .tabl button, .tabl input[type=submit] {
            background: #1e6e3e;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.82rem;
            cursor: pointer;
            margin: 4px 2px;
        }
        .tabl select { border: 1px solid #c8dfc8; border-radius: 6px; padding: 3px 6px; color: #1a3a25; }
        .tabl a { color: #1e6e3e; font-weight: 600; }

        /* ── DESKTOP ── */
        @media (min-width: 700px) {
            #map { height: calc(100vh - 52px); }

            .tabl {
                bottom: auto; top: 70px; right: 16px; left: auto;
                width: 290px; border-radius: 16px;
                max-height: calc(100vh - 120px);
                box-shadow: 0 4px 20px rgba(30,110,62,0.18);
            }
            .tabl-handle { display: none; }

            .info_compost {
                top: 10px;
                bottom: auto;
                left: 50%;
                transform: translateX(-50%);
                width: auto;
                max-width: 40%;
                text-align: center;
            }

            .rajouter {
                bottom: 58px;
                top: auto;
                left: 50%;
                transform: translateX(-50%);
                width: auto;
                max-width: 400px;
            }

            .trouver {
                bottom: 12px;
                left: 50%;
                transform: translateX(-50%);
            }
        }

        html.dark .edit-check { color: #e8f5ee !important; }
        html.dark .edit-select { background: #1e2d22 !important; color: #e8f5ee !important; border-color: #3a5c42 !important; }
    </style>
</head>

    <div id="nb_compost"></div>

    <script>
        // ── BURGER ──
        const burger = document.getElementById('burgerBtn');
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('overlay');
        const closeBtn = document.getElementById('closeBtn');
        function openMenu() { drawer.classList.add('open'); overlay.classList.add('open'); burger.classList.add('open'); document.body.style.overflow = 'hidden'; }
        function closeMenu() { drawer.classList.remove('open'); overlay.classList.remove('open'); burger.classList.remove('open'); document.body.style.overflow = ''; }
        burger.addEventListener('click', openMenu);
        closeBtn.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);

        // ── MAP ──
        var map = L.map('map').setView([46.785016, 7.670405], 6);
        var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });
        osmLayer.addTo(map);

        var fsControl = L.control.fullscreen();
        map.addControl(fsControl);
        L.control.scale({metric: true, imperial: false}).addTo(map);
        map.on('click', onMapClick);
        map.on('movestart', function() {
            var r = document.getElementById('rajouter_compost');
            if (r) { r.style.visibility = 'hidden'; r.innerHTML = ''; }
            if (currentMarker_click !== null) { map.removeLayer(currentMarker_click); currentMarker_click = null; }
        });

        let current_compost_id = null;
        let current_lat = null;
        let current_lon = null;
        const markerMap = new Map();
        let composteursLayer = null;
        let conteneursLayer = null;

        nb_compost.textContent = "Recherche des compost en France...";

        fetch("/api/carte/sites.php", {
            method: "POST",
            body: new URLSearchParams({france: "france"})
        })
        .then((response) => response.text())
        .then((data) => {
            try {
                let donnees = JSON.parse(data);
                if (Array.isArray(donnees)) {
                    let i = 0;
                    composteursLayer = L.markerClusterGroup({ maxClusterRadius: 50 });
                    conteneursLayer = L.markerClusterGroup({ maxClusterRadius: 50 });
                    donnees.forEach((compost) => {
                        let compost_id = compost.id;
                        let lon = compost.lon;
                        let lat = compost.lat;
                        let type = compost.type;
                        if (type === "Conteneur") {
                            var grayIcon = L.icon({ iconUrl: '/assets/img/marker-bleu.png', iconSize: [20, 38], iconAnchor: [10, 38], popupAnchor: [0, -38] });
                            marker = L.marker([lat, lon], {icon: grayIcon});
                            marker.options.id = i;
                            conteneursLayer.addLayer(marker);
                        } else {
                            var greenIcon = L.icon({ iconUrl: '/assets/img/icon_vert.png', iconSize: [25, 38], iconAnchor: [19, 38], popupAnchor: [0, -38] });
                            marker = L.marker([lat, lon], {icon: greenIcon});
                            marker.options.id = i;
                            composteursLayer.addLayer(marker);
                        }
                        markerMap.set(compost_id, marker);
                        i += 1;
                        L.DomEvent.on(marker, 'click', function () { info_compost(compost_id, lat, lon) });
                    });
                    composteursLayer.addTo(map);
                    conteneursLayer.addTo(map);
                    var overlays = { "Conteneur": conteneursLayer, "Composteurs": composteursLayer };
                    L.control.layers({}, overlays, {collapsed: false}).addTo(map);
                    nb_compost.textContent = i + " bacs à biodéchets et composts trouvés en France";
                }
            } catch(e) { console.error("Erreur JSON:", e); }
        });

        let modifierCompostHandler = null;
        const trajetHandlers = new Map();

        function info_compost(compost_id, lat, lon) {
            document.getElementById("supprimer_compost").style.visibility = "visible";
            document.getElementById("rajouter_compost").style.visibility = "hidden";
            document.getElementById("formulaire_changer").style.visibility = "visible";
            if (currentMarker_click !== null) { map.removeLayer(currentMarker_click); }
            current_compost_id = compost_id; current_lat = lat; current_lon = lon;
            document.getElementById("boutton").innerHTML = '<button type="button" id="modifier_compost" class="btn-modifier">✏️ Modifier</button>';
            document.getElementById("tableau").style.display = "block";
            document.getElementById("adresse").textContent = '📍 Chargement...';
            fetch('https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lon + '&format=json&accept-language=fr')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var a = data.address || {};
                var rue = a.road || a.pedestrian || a.path || a.cycleway || '';
                var ville = a.city || a.town || a.village || a.municipality || '';
                var cp = a.postcode || '';
                var txt = [rue, cp + ' ' + ville].filter(function(s){ return s.trim(); }).join(', ');
                document.getElementById("adresse").textContent = txt ? '📍 ' + txt : '';
            })
            .catch(function() { document.getElementById("adresse").textContent = ''; });
            let trajet = document.getElementsByClassName("trajet");
            Array.from(trajet).forEach((element => {
                if (trajetHandlers.has(element.id)) { element.removeEventListener("click", trajetHandlers.get(element.id)); trajetHandlers.delete(element.id); }
                const newHandler = function () { calcul_trajet(element.id, lat, lon) };
                element.addEventListener("click", newHandler);
                trajetHandlers.set(element.id, newHandler);
            }));
            let Autor = document.getElementById("Autor");
            let Inter = document.getElementById("Inter");
            fetch("/api/carte/sites.php", { method: "POST", body: new URLSearchParams({autorinter: compost_id}) })
            .then((response) => response.text())
            .then((data) => {
                try {
                    let donnees = JSON.parse(data);
                    if (Array.isArray(donnees)) {
                        let Acces = document.getElementById("acces");
                        let Type = document.getElementById("type");
                        let Gestion = document.getElementById("gestion");
                        let Info_gestion = document.getElementById("infos_gestion");
                        let Waze = document.getElementById("waze");
                        let type = donnees[0]["donnees"]["type"];
                        let acces = donnees[0]["donnees"]["acces"];
                        let gestion = donnees[0]["donnees"]["gestion"] || "Pas de données";
                        let info_gestion = donnees[0]["donnees"]["info_gestion"] || "Pas de données";
                        Waze.innerHTML = "<a href='https://www.waze.com/ul?ll=" + lat + "%2C" + lon + "&navigate=yes&zoom=17' target='_blank' rel='noopener' style='display:inline-flex;align-items:center;gap:4px;background:#1e6e3e;color:#fff;text-decoration:none;border-radius:8px;padding:5px 10px;font-size:0.82rem;font-weight:700;'>🗺 Waze</a>";
                        Type.innerHTML = type;
                        Acces.innerHTML = acces;
                        Gestion.innerHTML = gestion;
                        // Render contact as clickable link if URL or phone
                        let ig_html = info_gestion;
                        if (info_gestion && info_gestion !== "Pas de données") {
                            if (/https?:\/\//.test(info_gestion)) {
                                ig_html = info_gestion.replace(/(https?:\/\/[^\s]+)/g, function(url) {
                                    try {
                                        const display = new URL(url).hostname.replace(/^www\./, '');
                                        return '<a href="' + url + '" target="_blank" rel="noopener">🔗 ' + display + '</a>';
                                    } catch(e) { return url; }
                                });
                            } else if (/^[\d\s\+\.\-\(\)]{7,}$/.test(info_gestion.trim())) {
                                ig_html = '<a href="tel:' + info_gestion.replace(/\s/g,'') + '">📞 ' + info_gestion + '</a>';
                            }
                        }
                        Info_gestion.innerHTML = ig_html;
                        let donnees_autor = donnees[0]["autor"];
                        const donnees_inter = donnees[0]["inter"];
                        Autor.innerHTML = donnees_autor && donnees_autor.length
                            ? donnees_autor.map(function(a){ return '<span class="chip chip-ok">' + a + '</span>'; }).join('')
                            : '<span class="no-data">Pas de données</span>';
                        Inter.innerHTML = donnees_inter && donnees_inter.length
                            ? donnees_inter.map(function(i){ return '<span class="chip chip-nok">' + i + '</span>'; }).join('')
                            : '<span class="no-data">Pas de données</span>';
                        let modif_compost = document.getElementById("modifier_compost");
                        if (modifierCompostHandler) { modif_compost.removeEventListener("click", modifierCompostHandler); }
                        modifierCompostHandler = function () { modifier_compost(compost_id, Autor, Inter, acces, Acces, type, Type, donnees_autor, donnees_inter) };
                        modif_compost.addEventListener("click", modifierCompostHandler);
                    }
                } catch(e) { console.error("Erreur JSON:", e); }
            });
        }

        var nouv = 0;
        const form = document.getElementById('formulaire_changer');
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const compost_id = current_compost_id; const lat = current_lat; const lon = current_lon;
            if (!compost_id) { return; }
            const formData = new FormData(form);
            const typeSelect = document.getElementById('type_change');
            const accesSelect = document.getElementById('acces_change');
            const idInput = document.querySelector('[name="id"][form="formulaire_changer"]');
            const newType = typeSelect ? typeSelect.value : null;
            if (typeSelect) formData.set('type', typeSelect.value);
            if (accesSelect) formData.set('acces', accesSelect.value);
            if (idInput) formData.set('id', idInput.value);
            let enregistrer = document.getElementById("boutton");
            fetch(form.getAttribute('action'), { method: 'POST', body: formData })
            .then(response => { if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`); return response.text(); })
            .then(data => {
                if (data.includes("ne peut pas") || data.includes("Fatal error")) {
                    enregistrer.innerHTML = '<div style="color:red">' + data + '</div><input type="submit" value="Enregistrer">';
                } else {
                    if (nouv === 1) { alert("Compost créé !"); location.reload(); }
                    if (newType && markerMap.has(compost_id) && composteursLayer && conteneursLayer) {
                        const marker = markerMap.get(compost_id);
                        if (conteneursLayer.hasLayer(marker)) conteneursLayer.removeLayer(marker);
                        if (composteursLayer.hasLayer(marker)) composteursLayer.removeLayer(marker);
                        const updatedIcon = newType === "Conteneur"
                            ? L.icon({ iconUrl: '/assets/img/marker-bleu.png', iconSize: [20, 38], iconAnchor: [10, 38], popupAnchor: [0, -38] })
                            : L.icon({ iconUrl: '/assets/img/icon_vert.png', iconSize: [25, 38], iconAnchor: [19, 38], popupAnchor: [0, -38] });
                        marker.setIcon(updatedIcon);
                        if (newType === "Conteneur") { conteneursLayer.addLayer(marker); }
                        else { composteursLayer.addLayer(marker); }
                    }
                    info_compost(compost_id, lat, lon);
                }
            }).catch(error => { console.error("Erreur:", error); });
        });

        function modifier_compost(compost_id, Autor, Inter, acces, Acces, type, Type, donnees_autor, donnees_inter) {
            document.getElementById("supprimer_compost").style.visibility = "visible";
            let liste_type = ["Conteneur", "Compost bois", "Compost plastique"];
            let contenu_changer = '<select name="type" id="type_change" class="edit-select" form="formulaire_changer">';
            liste_type.forEach((t) => { contenu_changer += '<option value="' + t + '"' + (t === type ? ' selected' : '') + '>' + t + '</option>'; });
            contenu_changer += '</select><input type="hidden" name="id" value="' + compost_id + '" form="formulaire_changer">';
            Type.innerHTML = contenu_changer;
            let acces_changer = '<select name="acces" id="acces_change" class="edit-select" form="formulaire_changer">';
            ["public", "privé", "institution"].forEach((a) => { acces_changer += '<option value="' + a + '"' + (a === acces ? ' selected' : '') + '>' + a + '</option>'; });
            acces_changer += '</select>';
            Acces.innerHTML = acces_changer;
            let Tout_elt = ["produits laitiers", "tonte de pelouse", "reste de repas", "os", "poisson", "huile", "sac biodégradable", "viande", "cendres", "essuie-tout", "marc de café"];
            let Autorise_changer = ""; let Interdit_changer = "";
            Tout_elt.forEach((elt) => {
                const chk_a = donnees_autor && donnees_autor.includes(elt) ? ' checked' : '';
                Autorise_changer += '<label class="edit-check"><input type="checkbox" name="mettre[]" value="' + elt + '"' + chk_a + '/> ' + elt + '</label>';
                const chk_i = donnees_inter && donnees_inter.includes(elt) ? ' checked' : '';
                Interdit_changer += '<label class="edit-check"><input type="checkbox" name="pas_mettre[]" value="' + elt + '"' + chk_i + '/> ' + elt + '</label>';
            });
            Inter.innerHTML = Interdit_changer; Autor.innerHTML = Autorise_changer;
            document.getElementById("boutton").innerHTML = '<input type="submit" value="💾 Enregistrer">';
        }

        function calcul_trajet(id, lat, lon) {
            navigator.geolocation.getCurrentPosition((position) => {
                const lat_pos = position.coords.latitude; const long_pos = position.coords.longitude;
                let osm = "https://www.openstreetmap.org/directions?engine=fossgis_osrm_" + id + "&route=" + lat_pos + "%2C" + long_pos + "%3B" + lat + "%2C" + lon + "#";
                window.open(osm);
            }, (error) => { console.error("Géolocalisation:", error.message); });
        }

        function trouverPlusProche(lat_pos, long_pos) {
            var posIcon = L.icon({ iconUrl: '/assets/img/bleu.png', iconSize: [30, 30], iconAnchor: [15, 15] });
            L.marker([lat_pos, long_pos], { icon: posIcon }).addTo(map);
            fetch('/api/carte/sites.php', { method: 'POST', body: new URLSearchParams({ france: 'france' }) })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!Array.isArray(data)) return;
                var d_min = 99999999999999, long_min = 0, lat_min = 0, id = 0;
                data.forEach(function(compost) {
                    var dLat = ((lat_pos - compost.lat) * Math.PI) / 180;
                    var dLon = ((long_pos - compost.lon) * Math.PI) / 180;
                    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos((compost.lat*Math.PI)/180)*Math.cos((lat_pos*Math.PI)/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
                    var distance = 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)) * 1000;
                    if (distance < d_min) { d_min = distance; long_min = compost.lon; lat_min = compost.lat; id = compost.id; }
                });
                map.flyTo([lat_min, long_min], 15);
                nb_compost.textContent = 'Le compost le plus proche est a ' + Math.round(d_min) + 'm.';
                info_compost(id, lat_min, long_min);
            });
        }

        function afficherRechercheVille() {
            nb_compost.innerHTML = '<form id="form-ville" style="display:inline-flex;gap:6px;align-items:center"><input id="input-ville" type="text" placeholder="Adresse, quartier, ville..." style="padding:4px 8px;border:1px solid #1e6e3e;border-radius:8px;font-size:0.85rem"/><button type="submit" style="background:#1e6e3e;color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:0.85rem;cursor:pointer">Rechercher<\/button><\/form>';
            document.getElementById('form-ville').addEventListener('submit', function(e) {
                e.preventDefault();
                var ville = document.getElementById('input-ville').value.trim();
                if (!ville) return;
                nb_compost.textContent = 'Recherche de ' + ville + '...';
                fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(ville) + '&format=json&limit=1', { headers: { 'Accept-Language': 'fr' } })
                .then(function(r) { return r.json(); })
                .then(function(results) {
                    if (!results.length) { nb_compost.textContent = 'Ville introuvable, reessayez.'; afficherRechercheVille(); return; }
                    nb_compost.textContent = 'Recherche du compost le plus proche...';
                    trouverPlusProche(parseFloat(results[0].lat), parseFloat(results[0].lon));
                })
                .catch(function() { nb_compost.textContent = 'Erreur reseau, reessayez.'; afficherRechercheVille(); });
            });
        }

        function lieu() {
            afficherRechercheVille();
        }

        currentMarker_click = null;
        var current_lat_click = null; var current_lon_click = null;

        function onMapClick(e) {
            document.getElementById("supprimer_compost").style.visibility = "hidden";
            var contenu_modi = document.getElementById("rajouter_compost");
            contenu_modi.innerHTML = '<button type="button" id="valid_rajout">📍 Cliquez ici pour rajouter le compost</button>';
            current_lat_click = e.latlng.lat; current_lon_click = e.latlng.lng;
            if (currentMarker_click !== null) { map.removeLayer(currentMarker_click); }
            var greenIcon = L.icon({ iconUrl: '/assets/img/compost_proche.png', iconSize: [30, 30], iconAnchor: [12, 20] });
            currentMarker_click = L.marker(L.latLng(current_lat_click, current_lon_click), {icon: greenIcon});
            currentMarker_click.addTo(map);
            document.getElementById("rajouter_compost").style.visibility = "visible";
            document.getElementById("tableau").style.display = "none";
            document.getElementById('valid_rajout').addEventListener('click', function () {
                fetch("/api/carte/sites.php", { method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"}, body: new URLSearchParams({lat_click: current_lat_click, lon_click: current_lon_click}) })
                .then((response) => response.text())
                .then((data) => {
                    document.getElementById("tableau").style.display = "block";
                    document.getElementById("rajouter_compost").style.visibility = "hidden";
                    const number = parseInt(data.replace(/"/g, '').trim(), 10);
                    let Acces = document.getElementById("acces"); let Type = document.getElementById("type");
                    current_compost_id = number; nouv = 1;
                    modifier_compost(number, "", "", "", Acces, "", Type, null, null);
                });
            });
        }

        supp = document.getElementById("supprimer_compost");
        supp.addEventListener('click', function () {
            document.getElementById("tableau").style.display = "none";
            document.getElementById("supprimer_compost").style.visibility = "hidden";
            var supprimer = document.getElementById("rajouter_compost");
            supprimer.style.visibility = "visible";
            supprimer.innerHTML = "Êtes-vous sûr de vouloir supprimer ce compost ? <button id='oui'>Oui</button><button id='non'>Non</button>";
            document.getElementById("non").addEventListener('click', () => location.reload());
            document.getElementById("oui").addEventListener('click', () => {
                fetch("/api/carte/sites.php", { method: "POST", body: new URLSearchParams({supprimer: current_compost_id}) })
                .then((response) => response.text()).then((data) => { console.log(data); });
                alert("Le compost a bien été supprimé !");
                location.reload();
            });
        });
    </script>
    <script src="/assets/js/theme.js"></script>
</body>
</html>
