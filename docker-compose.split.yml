# Étape 2.1 — architecture multi-services + 3 bases séparées (db-map/db-games/db-core).
# Lancer :  docker compose -f docker-compose.split.yml up --build
# Repartir de bases vides (wipe assumé) :  docker compose -f docker-compose.split.yml down -v
#
# ⚠️ En 2.1 le CODE n'est pas encore adapté : map-api/games-api lisent encore `users`
# (isAdmin, JOIN top-5) qui n'est plus dans leur base → les actions ADMIN et le top-5
# échoueront jusqu'à l'étape 2.2. La carte, la liste, le login restent fonctionnels.
#
# Le compose d'origine (docker-compose.yml) reste intact comme filet de sécurité.
services:
  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - map-api
      - games-api
      - courses-api
      - auth-api
    networks: [composmart]

  map-api:
    build:
      context: .
      dockerfile: services/map-api/Dockerfile
    environment:
      DB_HOST: db-map
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db-map: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [composmart]

  games-api:
    build:
      context: .
      dockerfile: services/games-api/Dockerfile
    environment:
      DB_HOST: db-games
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db-games: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [composmart]

  courses-api:
    build:
      context: .
      dockerfile: services/courses-api/Dockerfile
    environment:
      DB_HOST: db-core
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db-core: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [composmart]

  auth-api:
    build:
      context: .
      dockerfile: services/auth-api/Dockerfile
    environment:
      DB_HOST: db-core
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db-core: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [composmart]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [composmart]

  # ── 3 bases séparées (variante B). Chaque base initialise son propre schéma. ──
  db-map:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_map_data:/var/lib/mysql
      - ./db/map.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [composmart]

  db-games:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_games_data:/var/lib/mysql
      - ./db/games.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [composmart]

  db-core:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_core_data:/var/lib/mysql
      - ./db/core.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [composmart]

  # ── Seeds découpés : composts → db-map, cours → db-core (deux conteneurs jetables). ──
  seed-map:
    build:
      context: .
      dockerfile: services/map-api/Dockerfile
    environment:
      DB_HOST: db-map
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    entrypoint: ["php", "/docker-seeds/seed_map.php"]
    volumes:
      - ./db/seeds:/docker-seeds
    depends_on:
      db-map: { condition: service_healthy }
    networks: [composmart]
    restart: "no"

  seed-core:
    build:
      context: .
      dockerfile: services/courses-api/Dockerfile
    environment:
      DB_HOST: db-core
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    entrypoint: ["php", "/docker-seeds/seed_core.php"]
    volumes:
      - ./db/seeds:/docker-seeds
      - ./content:/var/www/html/content
    depends_on:
      db-core: { condition: service_healthy }
    networks: [composmart]
    restart: "no"

networks:
  composmart:
    driver: bridge

volumes:
  db_map_data:
  db_games_data:
  db_core_data:
