# Étape 1 — architecture multi-services (validation locale avant k8s).
# DB encore UNIQUE et partagée (la séparation des bases est l'étape 2).
# Lancer :  docker compose -f docker-compose.split.yml up --build
#
# Le compose d'origine (docker-compose.yml) reste intact comme filet de sécurité.
services:
  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - map-api
      - games-api
      - courses-api
      - auth-api
    networks: [composmart]

  map-api:
    build:
      context: .
      dockerfile: services/map-api/Dockerfile
    env_file: [.env]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [composmart]

  games-api:
    build:
      context: .
      dockerfile: services/games-api/Dockerfile
    env_file: [.env]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [composmart]

  courses-api:
    build:
      context: .
      dockerfile: services/courses-api/Dockerfile
    env_file: [.env]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [composmart]

  auth-api:
    build:
      context: .
      dockerfile: services/auth-api/Dockerfile
    env_file: [.env]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [composmart]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [composmart]

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [composmart]

  # Seed initial (composts OSM/villes + cours). En monolithe c'était l'entrypoint web ;
  # ici on le lance une fois via un conteneur jetable qui réutilise l'image courses-api.
  seed:
    build:
      context: .
      dockerfile: services/courses-api/Dockerfile
    env_file: [.env]
    entrypoint: ["php", "/docker-seeds/seed.php"]
    volumes:
      - ./db/seeds:/docker-seeds
    depends_on:
      db: { condition: service_healthy }
    networks: [composmart]
    restart: "no"

networks:
  composmart:
    driver: bridge

volumes:
  db_data:
