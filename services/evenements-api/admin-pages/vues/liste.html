<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
  <link rel="stylesheet" href="/assets/css/dark.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;900&family=Nunito:wght@400;600;700;900&display=swap">
  <title>CompoSmart – Admin Événements</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #eef4ec; font-family: 'Nunito', Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

    .hero { text-align: center; padding: 26px 20px 12px; }
    .hero-badge { display: inline-block; background: #e53935; color: #fff; font-size: 0.78rem; font-weight: 900; padding: 5px 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
    h1 { font-family: 'Baloo 2', cursive; font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 900; color: #1a3a25; }
    .hero-lien { display: inline-block; margin-top: 12px; background: #1e6e3e; color: #fff; font-family: 'Baloo 2', cursive; font-size: 0.88rem; font-weight: 800; padding: 9px 20px; border-radius: 50px; text-decoration: none; }
    .hero-lien:hover { background: #17572f; }
    html.dark .hero-lien { background: #2d9959; }

    .page-content { width: 100%; max-width: 760px; padding: 16px; }
    .section-title { font-family: 'Baloo 2', cursive; font-size: 1.1rem; font-weight: 900; color: #1a3a25; margin: 12px 4px 12px; }

    .create-card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 10px rgba(30,110,62,0.08); margin-bottom: 24px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.75rem; font-weight: 800; color: #2c4a34; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .field input { display: block; width: 100%; padding: 10px 13px; border: 1.5px solid #c8dfc8; border-radius: 10px; font-size: 0.9rem; color: #1a3a25; background: #f7fbf8; outline: none; font-family: inherit; }
    .field input:focus { border-color: #1e6e3e; background: #fff; }
    .btn-create { background: #1e6e3e; color: #fff; border: none; border-radius: 50px; padding: 11px 24px; font-size: 0.9rem; font-weight: 800; cursor: pointer; font-family: 'Baloo 2', cursive; }
    .btn-create:disabled { opacity: 0.5; cursor: default; }
    .create-err { color: #c0392b; font-size: 0.82rem; font-weight: 700; margin-top: 10px; display: none; }

    .evt-item { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .evt-main { flex: 1; min-width: 200px; }
    .evt-titre { font-weight: 800; color: #1a3a25; font-size: 0.95rem; }
    .evt-meta { font-size: 0.78rem; color: #888; margin-top: 3px; }
    .evt-code { font-family: 'Baloo 2', cursive; font-weight: 900; letter-spacing: 2px; color: #1e6e3e; }
    .evt-statut { font-size: 0.66rem; font-weight: 900; padding: 3px 10px; border-radius: 10px; text-transform: uppercase; }
    .evt-statut.prevu { background: #fff3e0; color: #b26a00; }
    .evt-statut.ouvert { background: #e8f5e9; color: #1e6e3e; }
    .evt-statut.en_cours { background: #e3f2fd; color: #1565c0; }
    .evt-statut.termine { background: #ede7f6; color: #5e35b1; }
    .evt-statut.annule { background: #fff3e0; color: #e65100; }
    .evt-badge-supprime { font-size: 0.66rem; font-weight: 900; padding: 3px 10px; border-radius: 10px; text-transform: uppercase; background: #fdecea; color: #c0392b; }
    .evt-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .evt-actions a, .evt-actions button { border: none; border-radius: 12px; padding: 6px 12px; font-size: 0.75rem; font-weight: 800; cursor: pointer; text-decoration: none; font-family: inherit; }
    .btn-suivi { background: #eef4ec; color: #1e6e3e; }
    .btn-ouvrir, .btn-demarrer, .btn-restaurer { background: #e8f5e9; color: #1e6e3e; }
    .btn-reprevoir, .btn-terminer { background: #eceff1; color: #607d8b; }
    .btn-annuler { background: #fff3e0; color: #e65100; }
    .btn-supprimer { background: #fdecea; color: #c0392b; }
    .empty-msg { text-align: center; color: #999; font-size: 0.85rem; padding: 18px; background: #fff; border-radius: 12px; }
    .loader { text-align: center; padding: 40px; color: #4a7a5a; font-weight: 700; }

    /* Onglets de filtre (mêmes classes que /admin, cf. courses-api/admin-pages/vues/tableau-de-bord.html) */
    .tabs { display: flex; gap: 8px; padding: 0 0 4px; width: 100%; max-width: 760px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; box-sizing: border-box; margin-bottom: 18px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex-shrink: 0; white-space: nowrap; padding: 10px 16px; border-radius: 20px; font-family: 'Baloo 2', cursive; font-weight: 900; font-size: 0.85rem; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; background: #fff; color: #4a7a5a; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 6px; }
    .tab.active { background: #1e6e3e; color: #fff; border-color: #1e6e3e; }
    .tab:hover:not(.active) { border-color: #1e6e3e; color: #1e6e3e; }
    .tab.supprimes { margin-left: auto; }
    .tab.supprimes:not(.active) { color: #c0392b; }
    .tab.supprimes.active { background: #c0392b; border-color: #c0392b; }

    .bottom-leaf { position: fixed; bottom: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #1e6e3e, #52b788, #a7c957, #52b788, #1e6e3e); }

    html.dark body { background: #101a13; }
    html.dark nav { background: #14301f; }
    html.dark h1, html.dark .section-title, html.dark .evt-titre { color: #e8f5ee; }
    html.dark .create-card, html.dark .evt-item, html.dark .empty-msg { background: #16211a; }
    html.dark .field label { color: #7ab88e; }
    html.dark .field input { background: #1e2d22; border-color: #2d4030; color: #e8f5ee; }
    html.dark .btn-suivi, html.dark .btn-ouvrir, html.dark .btn-demarrer, html.dark .btn-restaurer { background: #16291c; color: #7fc99a; }
    html.dark .btn-reprevoir, html.dark .btn-terminer { background: #1e2d22; color: #9fb0a5; }
    html.dark .btn-annuler { background: #2e2410; color: #e0b95f; }
    html.dark .btn-supprimer { background: #3d1a1a; color: #ef9a9a; }
    html.dark .evt-statut.prevu { background: #2e2410; color: #e8b931; }
    html.dark .evt-statut.en_cours { background: #16283d; color: #7ab3e6; }
    html.dark .evt-statut.termine { background: #241b3d; color: #b39ddb; }
    html.dark .evt-statut.annule { background: #2e2410; color: #e0b95f; }
    html.dark .evt-badge-supprime { background: #3d1a1a; color: #ef9a9a; }
    html.dark .tab { background: #16211a; color: #7ab88e; }
    html.dark .tab.active { background: #2d9959; color: #fff; border-color: #2d9959; }
    html.dark .tab:hover:not(.active) { border-color: #52b788; color: #52b788; }
    html.dark .tab.supprimes:not(.active) { color: #ef9a9a; }
    html.dark .tab.supprimes.active { background: #c0392b; border-color: #c0392b; }
  </style>
  <link rel="stylesheet" href="/assets/css/site-nav.css">
  <link rel="stylesheet" href="/assets/css/desktop.css">
</head>
<body>

  <!-- Bandeau + sidebar partages (injectes par site-nav.js) -->
  <div id="site-nav"></div>

  <div class="hero">
    <div class="hero-badge">🎟️ Administration</div>
    <h1>Événements</h1>
    <!-- Les parcours sont une bibliothèque à part et non un onglet : ils ont
         leurs propres URL et vivent indépendamment des événements. -->
    <a href="/evenements-admin/parcours" class="hero-lien">🎬 Bibliothèque de parcours →</a>
    <a href="/evenements-admin/anecdotes" class="hero-lien" style="margin-left:8px">💡 Anecdotes →</a>
  </div>

  <div class="loader" id="loader">Chargement…</div>

  <div class="page-content" id="content" style="display:none">
    <div class="section-title">➕ Créer un événement</div>
    <div class="create-card">
      <form id="createForm">
        <div class="field"><label>Titre</label>
          <input type="text" id="titre" maxlength="150" placeholder="Atelier compostage — Entreprise X" required></div>
        <div class="field"><label>Lieu</label>
          <input type="text" id="lieu" maxlength="200" placeholder="Salle de réunion, 12 rue…"></div>
        <div class="field"><label>Date et heure</label>
          <input type="datetime-local" id="dateDebut" required></div>
        <button type="submit" class="btn-create" id="btnCreate">Créer</button>
        <div class="create-err" id="createErr"></div>
      </form>
    </div>

    <div class="section-title">📋 Événements</div>
    <div class="tabs" id="statutTabs">
      <div class="tab active" data-statut="">Tous</div>
      <div class="tab" data-statut="prevu">Prévu</div>
      <div class="tab" data-statut="ouvert">Ouvert</div>
      <div class="tab" data-statut="en_cours">En cours</div>
      <div class="tab" data-statut="annule">Annulé</div>
      <div class="tab" data-statut="termine">Terminé</div>
      <div class="tab supprimes" data-statut="__supprimes__">🗑️ Supprimés</div>
    </div>
    <div id="evtList"></div>
  </div>

  <div class="bottom-leaf"></div>

  <script>
    function echap(t) { const d = document.createElement('div'); d.textContent = (t == null ? '' : String(t)); return d.innerHTML; }

    let statutActif = ''; // '' = tous ; '__supprimes__' = onglet Supprimés

    function chargerListe() {
      const params = new URLSearchParams();
      if (statutActif === '__supprimes__') {
        params.set('supprimes', '1');
      } else if (statutActif) {
        params.set('statut', statutActif);
      }
      fetch('/api/evenements/admin.php?action=liste&' + params.toString())
        .then(r => { if (r.status === 403) { window.location.replace('/'); throw new Error('forbidden'); } return r.json(); })
        .then(d => renderListe(d.evenements || []))
        .catch(() => {});
    }

    const STATUT_LABEL = {
      prevu: 'Prévu', ouvert: 'Ouvert', en_cours: 'En cours', annule: 'Annulé', termine: 'Terminé',
    };

    // Boutons proposés selon le statut courant, hors "Suivi" (toujours présent).
    const ACTIONS_PAR_STATUT = {
      prevu:    [['ouvrir', 'btn-ouvrir', '▶ Ouvrir']],
      ouvert:   [['reprevoir', 'btn-reprevoir', '↩ Repasser en Prévu'], ['demarrer', 'btn-demarrer', '🟢 Démarrer']],
      en_cours: [['terminer', 'btn-terminer', '🏁 Terminer']],
      termine:  [],
      annule:   [],
    };

    function renderListe(evenements) {
      const vueSupprimes = statutActif === '__supprimes__';
      const box = document.getElementById('evtList');
      if (!evenements.length) {
        box.innerHTML = '<div class="empty-msg">' + (vueSupprimes ? 'Aucun événement supprimé.' : 'Aucun événement dans cette catégorie.') + '</div>';
        return;
      }
      box.innerHTML = evenements.map(e => {
        const date = new Date(e.date_debut.replace(' ', 'T')).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
        let actions = '<a href="/evenements-admin/' + e.id + '" class="btn-suivi">👁 Suivi</a>';

        if (vueSupprimes) {
          actions += ' <button class="btn-restaurer" data-act="restaurer" data-id="' + e.id + '">↩ Restaurer</button>';
        } else {
          (ACTIONS_PAR_STATUT[e.statut] || []).forEach(([act, cls, label]) => {
            actions += ' <button class="' + cls + '" data-act="' + act + '" data-id="' + e.id + '">' + label + '</button>';
          });
          if (e.statut !== 'annule') {
            actions += ' <button class="btn-annuler" data-act="annuler" data-id="' + e.id + '">✕ Annuler</button>';
          }
          actions += ' <button class="btn-supprimer" data-act="supprimer" data-id="' + e.id + '">🗑 Supprimer</button>';
        }

        // Le badge de statut (cycle de vie) et le badge de suppression sont deux
        // affichages distincts : un événement supprimé garde son statut visible.
        const badges = '<span class="evt-statut ' + e.statut + '">' + STATUT_LABEL[e.statut] + '</span>'
          + (e.supprime ? ' <span class="evt-badge-supprime">Supprimé</span>' : '');

        return '<div class="evt-item">'
          + '<div class="evt-main">'
          + '<div class="evt-titre">' + echap(e.titre) + '</div>'
          + '<div class="evt-meta">' + date + (e.lieu ? ' · ' + echap(e.lieu) : '') + ' · code <span class="evt-code">' + echap(e.code) + '</span> · ' + e.nb_participants + ' inscrit(s)</div>'
          + '</div>'
          + badges
          + '<div class="evt-actions">' + actions + '</div>'
          + '</div>';
      }).join('');
      box.querySelectorAll('[data-act]').forEach(btn => {
        btn.addEventListener('click', () => basculerStatut(btn.dataset.act, btn.dataset.id));
      });
    }

    // Confirmation intégrée à la page pour tout changement d'état : ces
    // actions ont un effet immédiat sur les téléphones de la salle.
    const CONFIRMATIONS = {
      ouvrir:    { titre: 'Ouvrir les inscriptions ?', texte: 'Les participants pourront rejoindre avec le code.', valider: 'Ouvrir' },
      reprevoir: { titre: 'Repasser en « Prévu » ?', texte: 'Les inscriptions seront coupées.', valider: 'Repasser en Prévu' },
      demarrer:  { titre: "Démarrer l'atelier ?", texte: 'Les inscriptions se ferment : personne ne pourra plus rejoindre.', valider: 'Démarrer' },
      terminer:  { titre: "Terminer l'atelier ?", texte: 'Tous les participants seront déconnectés.', valider: 'Terminer', danger: true },
      annuler:   { titre: 'Annuler cet événement ?', texte: 'Tous les participants seront déconnectés. Personne ne pourra plus rejoindre.', valider: "Annuler l’événement", danger: true },
      supprimer: { titre: 'Supprimer cet événement ?', texte: 'Il disparaît de la liste mais reste consultable dans les supprimés. Aucune donnée n’est effacée.', valider: 'Supprimer', danger: true },
      restaurer: { titre: 'Restaurer cet événement ?', texte: 'Il réapparaîtra dans la liste, avec son statut d’origine.', valider: 'Restaurer' },
    };

    async function basculerStatut(action, id) {
      const c = CONFIRMATIONS[action];
      if (c && !(await confirmer(c))) return;
      fetch('/api/evenements/admin.php?action=' + action, { method: 'POST', body: new URLSearchParams({ id }) })
        .then(r => r.json())
        .then(d => { if (d.ok) chargerListe(); else afficher(d.error || 'Action impossible.', false); })
        .catch(() => afficher('Erreur réseau.', false));
    }

    document.querySelectorAll('#statutTabs .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#statutTabs .tab').forEach(t => t.classList.toggle('active', t === tab));
        statutActif = tab.dataset.statut;
        chargerListe();
      });
    });

    document.getElementById('createForm').addEventListener('submit', e => {
      e.preventDefault();
      const err = document.getElementById('createErr');
      err.style.display = 'none';
      const btn = document.getElementById('btnCreate');
      btn.disabled = true; btn.textContent = 'Création…';

      const dateVal = document.getElementById('dateDebut').value; // format datetime-local
      const body = new URLSearchParams({
        titre: document.getElementById('titre').value.trim(),
        lieu: document.getElementById('lieu').value.trim(),
        date_debut: dateVal.replace('T', ' '),
      });
      fetch('/api/evenements/admin.php?action=creer', { method: 'POST', body })
        .then(r => r.json())
        .then(d => {
          if (!d.ok) { err.textContent = d.error || 'Erreur inconnue.'; err.style.display = 'block'; return; }
          document.getElementById('createForm').reset();
          chargerListe();
        })
        .catch(() => { err.textContent = 'Erreur réseau, réessaie.'; err.style.display = 'block'; })
        .finally(() => { btn.disabled = false; btn.textContent = 'Créer'; });
    });

    // Chargement initial : la garde a déjà vérifié la session côté serveur
    // (contrôleur), l'appel API confirme juste que le back n'a pas divergé.
    document.getElementById('loader').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    chargerListe();
  </script>
  <script src="/assets/js/confirmer.js"></script>
  <script src="/assets/js/site-nav.js"></script>
  <script src="/assets/js/theme.js"></script>
</body>
</html>
