<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
  <link rel="stylesheet" href="/assets/css/dark.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;900&family=Nunito:wght@400;600;700;900&display=swap">
  <title>CompoSmart – Suivi événement</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #eef4ec; font-family: 'Nunito', Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    nav { width: 100%; background: #1e6e3e; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; }
    .nav-logo { font-family: 'Baloo 2', cursive; font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; font-style: italic; text-decoration: none; }
    .nav-logo span { color: #a8e6bf; }
    .nav-back { color: rgba(255,255,255,0.85); text-decoration: none; font-weight: 700; font-size: 0.85rem; }

    .page-content { width: 100%; max-width: 820px; padding: 20px 16px; }
    .loader { text-align: center; padding: 60px; color: #4a7a5a; font-weight: 700; }

    .join-card { background: #fff; border-radius: 20px; box-shadow: 0 4px 24px rgba(30,110,62,0.10); padding: 28px; text-align: center; margin-bottom: 24px; }
    .join-titre { font-family: 'Baloo 2', cursive; font-size: 1.5rem; font-weight: 900; color: #1a3a25; }
    .join-meta { font-size: 0.9rem; color: #4a7a5a; font-weight: 700; margin-top: 6px; }
    .join-code { font-family: 'Baloo 2', cursive; font-size: 3rem; font-weight: 900; letter-spacing: 10px; color: #1e6e3e; margin: 18px 0 6px; }
    .join-qr { margin: 12px auto; border-radius: 12px; }
    .join-link { font-size: 0.82rem; color: #4a7a5a; word-break: break-all; background: #f7fbf8; border-radius: 10px; padding: 8px 12px; display: inline-block; }
    .join-statut { display: inline-block; font-size: 0.7rem; font-weight: 900; padding: 4px 12px; border-radius: 12px; text-transform: uppercase; margin-top: 14px; }
    .join-statut.ouvert { background: #e8f5e9; color: #1e6e3e; }
    .join-statut.ferme, .join-statut.brouillon { background: #eceff1; color: #607d8b; }
    .join-statut.en_cours { background: #e3f2fd; color: #1565c0; }
    .join-statut.termine { background: #ede7f6; color: #5e35b1; }
    .join-statut.annule { background: #fff3e0; color: #e65100; }
    .join-statut.archive { background: #fdecea; color: #c0392b; }
    .join-actions { margin-top: 16px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .join-actions button { border: none; border-radius: 50px; padding: 10px 20px; font-size: 0.85rem; font-weight: 800; cursor: pointer; font-family: 'Baloo 2', cursive; }
    .btn-principal { background: #1e6e3e; color: #fff; }
    .btn-secondaire { background: #eceff1; color: #607d8b; }
    .btn-annuler { background: #fff3e0; color: #e65100; }
    .btn-supprimer { background: #fdecea; color: #c0392b; }
    .btn-restaurer { background: #e8f5e9; color: #1e6e3e; }
    .lecture-seule-msg { font-size: 0.82rem; color: #888; font-weight: 700; margin-top: 14px; }

    .section-title { font-family: 'Baloo 2', cursive; font-size: 1.1rem; font-weight: 900; color: #1a3a25; margin: 8px 4px 12px; display: flex; align-items: center; justify-content: space-between; }
    .part-count { font-size: 0.8rem; color: #4a7a5a; font-weight: 700; }
    .part-list { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 10px rgba(30,110,62,0.08); }
    .part-item { padding: 10px 16px; border-top: 1px solid #f0f4f0; font-size: 0.88rem; color: #1a3a25; display: flex; justify-content: space-between; }
    .part-item:first-child { border-top: none; }
    .part-heure { color: #999; font-size: 0.76rem; }
    .empty-msg { text-align: center; color: #999; font-size: 0.85rem; padding: 18px; background: #fff; border-radius: 12px; }

    .bottom-leaf { position: fixed; bottom: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #1e6e3e, #52b788, #a7c957, #52b788, #1e6e3e); }

    html.dark body { background: #101a13; }
    html.dark nav { background: #14301f; }
    html.dark .join-card, html.dark .part-list, html.dark .empty-msg { background: #16211a; }
    html.dark .join-titre, html.dark .section-title, html.dark .part-item { color: #e8f5ee; }
    html.dark .join-link { background: #1e2d22; color: #7ab88e; }
    html.dark .part-item { border-top-color: #243a2c; }
    html.dark .join-statut.en_cours { background: #16283d; color: #7ab3e6; }
    html.dark .join-statut.termine { background: #241b3d; color: #b39ddb; }
    html.dark .join-statut.annule { background: #2e2410; color: #e0b95f; }
    html.dark .btn-secondaire { background: #1e2d22; color: #9fb0a5; }
    html.dark .btn-annuler { background: #2e2410; color: #e0b95f; }
    html.dark .btn-supprimer { background: #3d1a1a; color: #ef9a9a; }
    html.dark .btn-restaurer { background: #16291c; color: #7fc99a; }
    html.dark .lecture-seule-msg { color: #7ab88e; }
  </style>
  <link rel="stylesheet" href="/assets/css/desktop.css">
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Compo<span>Smart</span></a>
    <a href="/evenements-admin" class="nav-back">← Retour</a>
  </nav>

  <div class="loader" id="loader">Chargement…</div>

  <div class="page-content" id="content" style="display:none">
    <div class="join-card">
      <div class="join-titre" id="evtTitre"></div>
      <div class="join-meta" id="evtMeta"></div>
      <div class="join-code" id="evtCode"></div>
      <!-- QR généré via un service tiers (api.qrserver.com) : l'URL de
           l'événement (donc son code d'accès) lui est transmise à chaque
           affichage. Acceptable pour un premier jet, à remplacer par une
           génération 100% locale si la confidentialité du code doit être
           renforcée (cf. discussion conception). -->
      <img class="join-qr" id="evtQr" width="200" height="200" alt="QR code de l'événement">
      <br>
      <span class="join-link" id="evtLink"></span>
      <div>
        <span class="join-statut" id="evtStatutBadge"></span>
      </div>
      <div class="join-actions" id="evtActions"></div>
    </div>

    <div class="section-title">👥 Participants <span class="part-count" id="partCount"></span></div>
    <div id="partList"></div>
  </div>

  <div class="bottom-leaf"></div>

  <script>
    /*__ROUTE__*/
    function echap(t) { const d = document.createElement('div'); d.textContent = (t == null ? '' : String(t)); return d.innerHTML; }

    const evenementId = window.ROUTE && window.ROUTE.evenement_id;
    let pollTimer = null;

    function chargerSuivi() {
      fetch('/api/evenements/admin.php?action=suivi&id=' + evenementId)
        .then(r => { if (r.status === 403) { window.location.replace('/'); throw new Error('forbidden'); } return r.json(); })
        .then(d => {
          if (d.error) { document.getElementById('loader').textContent = d.error; return; }
          render(d.evenement, d.participants || []);
          document.getElementById('loader').style.display = 'none';
          document.getElementById('content').style.display = 'block';
        })
        .catch(() => {});
    }

    function render(evt, participants) {
      document.getElementById('evtTitre').textContent = evt.titre;
      let meta = evt.lieu || '';
      const date = new Date(evt.date_debut.replace(' ', 'T')).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
      meta += (meta ? ' · ' : '') + date;
      document.getElementById('evtMeta').textContent = meta;
      document.getElementById('evtCode').textContent = evt.code;

      const lien = window.location.origin + '/evenement?code=' + evt.code;
      document.getElementById('evtLink').textContent = lien;
      document.getElementById('evtQr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(lien);

      const STATUT_LABEL = {
        brouillon: 'Brouillon', ouvert: 'Ouvert aux inscriptions', ferme: 'Fermé',
        en_cours: 'En cours', termine: 'Terminé', annule: 'Annulé', archive: 'Supprimé',
      };
      const badge = document.getElementById('evtStatutBadge');
      badge.className = 'join-statut ' + evt.statut;
      badge.textContent = STATUT_LABEL[evt.statut] || evt.statut;

      // Boutons proposés selon le statut courant. Un événement annulé ou
      // supprimé reste consultable (participants toujours listés) mais en
      // lecture seule : pas de bascule ouvrir/fermer/démarrer/terminer.
      const ACTIONS_PAR_STATUT = {
        brouillon: [['ouvrir', 'btn-principal', '▶ Ouvrir les inscriptions']],
        ouvert:    [['fermer', 'btn-secondaire', '⏸ Fermer'], ['demarrer', 'btn-principal', '🟢 Démarrer']],
        ferme:     [['ouvrir', 'btn-principal', '▶ Rouvrir']],
        en_cours:  [['terminer', 'btn-secondaire', '🏁 Terminer']],
        termine:   [],
      };
      const zone = document.getElementById('evtActions');
      zone.innerHTML = '';
      if (evt.statut === 'archive') {
        zone.innerHTML = '<div class="lecture-seule-msg">🗑️ Événement supprimé — lecture seule.</div>'
          + '<button class="btn-restaurer" id="btnRestaurer">↩ Restaurer</button>';
        document.getElementById('btnRestaurer').onclick = () => basculer('restaurer');
      } else if (evt.statut === 'annule') {
        zone.innerHTML = '<div class="lecture-seule-msg">✕ Événement annulé.</div>';
      } else {
        (ACTIONS_PAR_STATUT[evt.statut] || []).forEach(([act, cls, label]) => {
          const b = document.createElement('button');
          b.className = cls; b.textContent = label;
          b.onclick = () => basculer(act);
          zone.appendChild(b);
        });
        const annulerBtn = document.createElement('button');
        annulerBtn.className = 'btn-annuler'; annulerBtn.textContent = '✕ Annuler';
        annulerBtn.onclick = () => { if (confirm("Annuler cet événement ? Les participants qui tentent de rejoindre verront un message d'annulation.")) basculer('annuler'); };
        zone.appendChild(annulerBtn);

        const supprimerBtn = document.createElement('button');
        supprimerBtn.className = 'btn-supprimer'; supprimerBtn.textContent = '🗑 Supprimer';
        supprimerBtn.onclick = () => { if (confirm('Supprimer cet événement ? Il restera consultable dans les supprimés.')) basculer('supprimer'); };
        zone.appendChild(supprimerBtn);
      }

      document.getElementById('partCount').textContent = '(' + participants.length + ')';
      const box = document.getElementById('partList');
      if (!participants.length) {
        box.innerHTML = '<div class="empty-msg">Personne n\'a encore rejoint.</div>';
        return;
      }
      box.innerHTML = '<div class="part-list">' + participants.map(p => {
        const heure = new Date(p.rejoint_at.replace(' ', 'T')).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        return '<div class="part-item"><span>' + echap(p.nom_affiche) + '</span><span class="part-heure">' + heure + '</span></div>';
      }).join('') + '</div>';
    }

    function basculer(action) {
      fetch('/api/evenements/admin.php?action=' + action, { method: 'POST', body: new URLSearchParams({ id: evenementId }) })
        .then(r => r.json())
        .then(d => { if (d.ok) chargerSuivi(); else alert(d.error || 'Action impossible.'); })
        .catch(() => alert('Erreur réseau.'));
    }

    chargerSuivi();
    // Suivi live : la liste des participants s'actualise pendant la
    // projection en salle, sans action de l'admin.
    pollTimer = setInterval(chargerSuivi, 4000);
    window.addEventListener('beforeunload', () => clearInterval(pollTimer));
  </script>
  <script src="/assets/js/theme.js"></script>
</body>
</html>
