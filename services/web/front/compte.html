<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
  <link rel="stylesheet" href="/assets/css/dark.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;900&family=Nunito:wght@400;600;700;900&display=swap">
  <title>CompoSmart – Mon compte</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #eef4ec; font-family: 'Nunito', Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── NAV / DRAWER (markup injecté par site-nav.js) ── */
    nav { width: 100%; background: #1e6e3e; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-family: 'Baloo 2', cursive; font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; font-style: italic; text-decoration: none; }
    .nav-logo span { color: #a8e6bf; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-profil { color: rgba(255,255,255,0.85); font-size: 1.3rem; text-decoration: none; line-height: 1; transition: color 0.15s; }
    .nav-profil:hover { color: #fff; }
    .burger { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 4px; }
    .burger span { display: block; width: 26px; height: 3px; background: #fff; border-radius: 2px; transition: all 0.3s ease; }
    .burger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; }
    .burger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
    .drawer { position: fixed; top: 0; right: -320px; width: 280px; max-width: 85vw; height: 100vh; background: #fff; z-index: 200; transition: right 0.32s cubic-bezier(.4,0,.2,1); box-shadow: -4px 0 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; }
    .drawer.open { right: 0; }
    .drawer-header { background: #1e6e3e; padding: 20px 20px 18px; display: flex; align-items: center; justify-content: space-between; }
    .drawer-logo { font-family: 'Baloo 2', cursive; font-size: 1.2rem; font-weight: 900; color: #fff; letter-spacing: 2px; font-style: italic; }
    .drawer-logo span { color: #a8e6bf; }
    .drawer-close { background: none; border: none; cursor: pointer; color: #fff; font-size: 1.6rem; line-height: 1; padding: 2px 6px; }
    .drawer-menu { list-style: none; padding: 8px 0; flex: 1; overflow-y: auto; }
    .drawer-menu li a { display: flex; align-items: center; gap: 14px; padding: 15px 24px; font-size: 1rem; font-weight: 700; color: #1a3a25; text-decoration: none; transition: background 0.15s; border-left: 3px solid transparent; }
    .drawer-menu li a:hover, .drawer-menu li a.active { background: #eef4ec; border-left-color: #1e6e3e; color: #1e6e3e; }
    .menu-icon { font-size: 1.2rem; width: 24px; text-align: center; }
    .drawer-divider { height: 1px; background: #e5ede8; margin: 4px 24px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .overlay.open { opacity: 1; pointer-events: all; }

    /* ── HERO ──
       Même traitement que l'accueil (motif + dégradé + courbe elliptique) : la
       page de profil doit appartenir au même site, pas ressembler à un module à part. */
    .hero {
      position: relative; text-align: center; padding: 56px 20px 84px; color: #fff; overflow: hidden;
      background-color: #1e6e3e;
      background-image: url('/assets/img/motif-branchage-light.svg'), linear-gradient(160deg, #145228 0%, #1e6e3e 55%, #2d9959 100%);
      background-repeat: repeat, no-repeat;
      background-size: 220px 220px, cover;
    }
    .hero::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 60px; background: #eef4ec; clip-path: ellipse(75% 100% at 50% 100%); }
    .hero-inner { position: relative; z-index: 2; max-width: 620px; margin: 0 auto; }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 18px;
      background: rgba(255,255,255,0.16); border: 3px solid rgba(255,255,255,0.45);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Baloo 2', cursive; font-size: 2.6rem; font-weight: 900; color: #fff;
      backdrop-filter: blur(4px);
    }
    .hero h1 { font-family: 'Baloo 2', cursive; font-size: clamp(1.7rem, 5vw, 2.6rem); font-weight: 900; line-height: 1.15; }
    .hero-sub { font-size: 1rem; color: rgba(255,255,255,0.9); font-weight: 600; margin-top: 6px; }

    /* Barre de niveau dans le hero : l'info d'identité la plus lue, elle mérite
       la place forte plutôt qu'une ligne perdue au milieu des sections. */
    .hero-xp { max-width: 420px; margin: 24px auto 0; }
    .hero-xp-track { height: 10px; background: rgba(255,255,255,0.22); border-radius: 20px; overflow: hidden; }
    .hero-xp-fill { height: 100%; background: #a8e6bf; border-radius: 20px; transition: width 0.7s cubic-bezier(.4,0,.2,1); }
    .hero-xp-label { font-size: 0.82rem; color: rgba(255,255,255,0.85); font-weight: 700; margin-top: 8px; }
    .hero-chip {
      display: inline-flex; align-items: center; gap: 7px; margin-top: 20px;
      background: rgba(255,255,255,0.15); color: #fff; border: 1.5px solid rgba(255,255,255,0.4);
      border-radius: 50px; padding: 9px 18px; font-size: 0.85rem; font-weight: 800;
      text-decoration: none; backdrop-filter: blur(4px); transition: background 0.15s, transform 0.15s;
    }
    .hero-chip:hover { background: rgba(255,255,255,0.26); transform: translateY(-2px); }

    /* ── CHIFFRES CLÉS (chevauchent la courbe du hero, comme sur l'accueil) ── */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 900px; margin: -52px auto 0; padding: 0 20px; position: relative; z-index: 5; }
    .stat { background: #fff; border-radius: 20px; padding: 20px 14px; text-align: center; box-shadow: 0 6px 22px rgba(30,110,62,0.12); }
    .stat-num { font-family: 'Baloo 2', cursive; font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 900; color: #1e6e3e; line-height: 1; }
    .stat-label { font-size: 0.8rem; color: #4a7a5a; font-weight: 700; margin-top: 6px; }

    /* ── LAYOUT ── une colonne en mobile, deux en desktop (pas de module centré) */
    .profil-layout { width: 100%; max-width: 1120px; margin: 0 auto; padding: 40px 20px 0; display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
    .col-main, .col-side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

    .panel { background: #fff; border-radius: 22px; padding: 24px; box-shadow: 0 4px 16px rgba(30,110,62,0.08); }
    .panel-head { display: flex; align-items: center; gap: 9px; font-family: 'Baloo 2', cursive; font-size: 1.1rem; font-weight: 900; color: #1a3a25; margin-bottom: 16px; }
    .panel-count { margin-left: auto; font-family: 'Nunito', sans-serif; font-size: 0.76rem; font-weight: 800; color: #4a7a5a; background: #eef4ec; padding: 3px 11px; border-radius: 20px; }

    /* Badges */
    .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .badge { text-align: center; padding: 14px 6px; border-radius: 16px; background: #f4f9f4; border: 1.5px solid #e3efe5; transition: transform 0.15s; }
    .badge.locked { opacity: 0.4; filter: grayscale(0.8); }
    .badge:not(.locked) { box-shadow: 0 2px 8px rgba(30,110,62,0.12); }
    .badge:not(.locked):hover { transform: translateY(-3px); }
    .badge-emoji { font-size: 1.8rem; line-height: 1; }
    .badge-label { font-family: 'Baloo 2', cursive; font-size: 0.72rem; font-weight: 900; color: #1a3a25; margin-top: 6px; line-height: 1.2; }
    .badge-desc { font-size: 0.62rem; color: #7aaa8a; margin-top: 2px; line-height: 1.25; font-weight: 600; }

    /* Records de jeux */
    .game-row { display: flex; align-items: center; gap: 12px; background: #f4f9f4; border-radius: 14px; padding: 12px 14px; text-decoration: none; transition: background 0.15s, transform 0.15s; }
    .game-row + .game-row { margin-top: 9px; }
    .game-row:hover { background: #eef4ec; transform: translateX(3px); }
    .game-row-emoji { font-size: 1.6rem; flex-shrink: 0; }
    .game-row-info { flex: 1; min-width: 0; }
    .game-row-name { font-family: 'Baloo 2', cursive; font-size: 0.92rem; font-weight: 900; color: #1a3a25; }
    .game-row-sub { font-size: 0.72rem; color: #7aaa8a; font-weight: 600; margin-top: 1px; }
    .game-row-best { font-family: 'Baloo 2', cursive; font-size: 1rem; font-weight: 900; color: #1e6e3e; white-space: nowrap; flex-shrink: 0; }
    .game-row-best.none { color: #bbb; font-size: 0.8rem; }

    /* Historique des cours */
    .history-list { display: flex; flex-direction: column; }
    .history-row { display: flex; align-items: center; gap: 11px; padding: 10px 4px; border-bottom: 1px solid #eef4ec; text-decoration: none; transition: background 0.12s; border-radius: 8px; }
    .history-row:last-child { border-bottom: none; }
    .history-row:hover { background: #f4f9f4; }
    .history-emoji { font-size: 1.2rem; flex-shrink: 0; }
    .history-title { flex: 1; min-width: 0; font-size: 0.86rem; font-weight: 700; color: #1a3a25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-date { font-size: 0.72rem; color: #7aaa8a; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
    .course-empty { font-size: 0.85rem; color: #7aaa8a; font-weight: 600; }
    .course-empty a { color: #1e6e3e; font-weight: 800; }

    /* Courbe de progression XP (une seule série → pas de légende) */
    .xp-curve { width: 100%; height: 120px; display: block; overflow: visible; }
    .xp-curve-grid { stroke: #e3efe5; stroke-width: 1; }
    .xp-curve-area { fill: #2d9959; fill-opacity: 0.12; stroke: none; }
    .xp-curve-line { fill: none; stroke: #2d9959; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .xp-curve-end { fill: #2d9959; stroke: #fff; stroke-width: 2; }
    .xp-curve-tick { font-size: 8px; fill: #7aaa8a; font-weight: 600; }
    .xp-curve-end-label { font-size: 9px; font-weight: 800; fill: #1a3a25; }
    .xp-curve-axis { display: flex; justify-content: space-between; font-size: 0.7rem; color: #7aaa8a; font-weight: 700; margin-top: 6px; }
    .xp-chart-empty { font-size: 0.85rem; color: #7aaa8a; font-weight: 600; }

    /* Déconnexion : action rare, en lien discret plutôt qu'en gros bouton rouge */
    .logout-wrap { max-width: 1120px; margin: 0 auto; padding: 26px 20px 48px; text-align: center; }
    .btn-logout { background: none; border: none; color: #c0392b; font-family: inherit; font-size: 0.88rem; font-weight: 700; cursor: pointer; padding: 10px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(192,57,43,0.35); }
    .btn-logout:hover { text-decoration-color: currentColor; }

    /* ── Non connecté ── */
    .guest { max-width: 460px; margin: 0 auto; text-align: center; }
    .guest .panel { padding: 34px 26px; }
    .guest-title { font-family: 'Baloo 2', cursive; font-size: 1.4rem; font-weight: 900; color: #1a3a25; margin-bottom: 8px; }
    .guest-sub { font-size: 0.92rem; color: #4a7a5a; font-weight: 600; margin-bottom: 26px; line-height: 1.55; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 50px; font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 0.98rem; text-decoration: none; cursor: pointer; border: none; transition: transform 0.18s, box-shadow 0.18s, background 0.18s; }
    .btn-primary { background: #1e6e3e; color: #fff; box-shadow: 0 4px 14px rgba(30,110,62,0.28); margin-bottom: 10px; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,110,62,0.34); }
    .btn-secondary { background: #fff; color: #1e6e3e; border: 1.5px solid #a8e6bf; }
    .btn-secondary:hover { background: #eef4ec; }

    .bottom-leaf { position: fixed; bottom: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #1e6e3e, #52b788, #a7c957, #52b788, #1e6e3e); z-index: 90; }

    /* ── DESKTOP ── */
    @media (min-width: 640px) {
      .stats { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 900px) {
      /* Deux colonnes : la progression (lecture longue) à gauche, les blocs
         courts (badges, records) en colonne d'appoint à droite. */
      .profil-layout { grid-template-columns: 1.45fr 1fr; padding-top: 48px; }
      /* Visiteur non connecté : une seule carte, donc on annule la 2e colonne
         (sinon la carte se coincerait dans la colonne de gauche). */
      .profil-layout.guest { grid-template-columns: 1fr; }
    }

    /* ── DARK MODE ── */
    html.dark body { background: #0f1811; color: #e8f5ee; }
    html.dark .hero {
      background-color: #0d2f18;
      background-image: url('/assets/img/motif-branchage-dark.svg'), linear-gradient(160deg, #0d2f18 0%, #12401f 55%, #1a5c33 100%);
      background-repeat: repeat, no-repeat;
      background-size: 220px 220px, cover;
    }
    html.dark .hero::after { background: #0f1811; }
    html.dark .hero-sub { color: rgba(255,255,255,0.82); }
    html.dark .stat, html.dark .panel { background: #16211a; box-shadow: 0 4px 16px rgba(0,0,0,0.35); }
    html.dark .stat-num { color: #52b788; }
    html.dark .stat-label { color: #7ab88e; }
    html.dark .panel-head, html.dark .badge-label, html.dark .game-row-name,
    html.dark .history-title, html.dark .guest-title { color: #e8f5ee; }
    html.dark .panel-count { background: #1e2d22; color: #7ab88e; }
    html.dark .badge { background: #101a13; border-color: #243a2c; }
    html.dark .badge-desc, html.dark .game-row-sub, html.dark .history-date,
    html.dark .course-empty, html.dark .xp-chart-empty, html.dark .xp-curve-axis,
    html.dark .guest-sub { color: #7ab88e; }
    html.dark .game-row { background: #101a13; }
    html.dark .game-row:hover { background: #1e2d22; }
    html.dark .game-row-best { color: #52b788; }
    html.dark .history-row { border-bottom-color: #243328; }
    html.dark .history-row:hover { background: #101a13; }
    html.dark .course-empty a { color: #52b788; }
    html.dark .xp-curve-grid { stroke: #243328; }
    html.dark .xp-curve-area { fill: #52b788; }
    html.dark .xp-curve-line { stroke: #52b788; }
    html.dark .xp-curve-end { fill: #52b788; stroke: #16211a; }
    html.dark .xp-curve-tick { fill: #7ab88e; }
    html.dark .xp-curve-end-label { fill: #e8f5ee; }
    html.dark .btn-primary { background: #2d9959; }
    html.dark .btn-secondary { background: #16211a; color: #52b788; border-color: #2d4030; }
    html.dark .btn-secondary:hover { background: #1e2d22; }
    html.dark .btn-logout { color: #e57373; }
    html.dark .drawer { background: #1a2b1e; }
    html.dark .drawer-menu li a { color: #b0d4be; }
    html.dark .drawer-menu li a:hover, html.dark .drawer-menu li a.active { background: #243328; color: #52b788; border-left-color: #52b788; }
    html.dark .drawer-divider { background: #2a3d2e; }
  </style>
  <link rel="stylesheet" href="/assets/css/desktop.css">

<body>

  <!-- Bandeau + sidebar partagés (injectés par site-nav.js) -->
  <div id="site-nav"></div>

  <header class="hero">
    <div class="hero-inner">
      <div class="avatar" id="heroAvatar">👤</div>
      <h1 id="heroTitle">Mon compte</h1>
      <p class="hero-sub" id="heroSub"></p>
      <div id="heroXp"></div>
      <div id="heroChip"></div>
    </div>
  </header>

  <div class="stats" id="statsRow"></div>

  <main class="profil-layout" id="profilLayout">
    <div class="col-main" id="colMain"></div>
    <aside class="col-side" id="colSide"></aside>
  </main>

  <div class="logout-wrap" id="logoutWrap"></div>

  <!-- Footer partagé (injecté par site-footer.js) -->
  <div id="site-footer"></div>

  <div class="bottom-leaf"></div>

  <script>
    function esc(t) { const d = document.createElement('div'); d.textContent = (t == null ? '' : String(t)); return d.innerHTML; }

    // profile.php (db-core) ne connaît pas les jeux : on agrège les records jeux
    // depuis games-api (db-games), puis on complète badges + parties côté front.
    Promise.all([
      fetch('/api/auth/profile.php').then(r => r.json()).catch(() => ({})),
      fetch('/api/jeux/score.php?action=profile').then(r => r.json()).catch(() => ({ records: [], parties: 0 })),
    ]).then(([profile, jeux]) => {
      if (!profile.logged_in) { renderGuest(); return; }
      profile.records = jeux.records || [];
      profile.parties = jeux.parties || 0;
      // Badges jeux (db-games) injectés ici : Joueur + Touche-à-tout.
      const nbJeux = profile.records.filter(r => r.best !== null).length;
      const allJeux = profile.records.length > 0 && nbJeux >= profile.records.length;
      profile.badges.splice(2, 0,
        { emoji: '🎮', label: 'Joueur',        desc: 'Jouer à un mini-jeu',  unlocked: profile.parties >= 1 },
        { emoji: '🏆', label: 'Touche-à-tout', desc: 'Essayer tous les jeux', unlocked: allJeux });
      renderProfile(profile);
    });

    function ordinal(n) { return n === 1 ? '1er' : n + 'e'; }

    // completed_at/created_at viennent en 'YYYY-MM-DD HH:MM:SS' (datetime MySQL, sans
    // fuseau) : on force le 'T' pour un parsing fiable cross-navigateur.
    function parseSqlDate(s) { return new Date(String(s).replace(' ', 'T')); }
    function formatDate(s) {
      return parseSqlDate(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    }
    // « membre depuis » : le jour n'apporte rien, le mois et l'année suffisent.
    function formatMoisAnnee(s) {
      return parseSqlDate(s).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    }

    // Agrège xp_history (liste d'événements datés, ASC) par jour civil pour obtenir
    // l'XP cumulée jour par jour depuis le premier gain, puis rend une courbe SVG
    // (ligne + aire légère). Série unique → pas de légende, dates réelles en axe X
    // (cf. skill dataviz, marks-and-anatomy).
    function buildXpChartHtml(history) {
      if (!history.length) {
        return `<div class="xp-chart-empty">Pas encore assez de données pour tracer une courbe. Termine un cours ou joue à un mini-jeu !</div>`;
      }
      const byDay = new Map();
      history.forEach(function(ev) {
        const day = String(ev.created_at).slice(0, 10); // 'YYYY-MM-DD'
        byDay.set(day, (byDay.get(day) || 0) + ev.delta);
      });
      const days = Array.from(byDay.keys()); // ASC (insertion suit history, déjà trié)

      // Cumul jour par jour depuis le tout premier événement, en comblant les jours
      // sans gain (sinon la courbe "saute" les jours creux au lieu de rester plate).
      const start = parseSqlDate(days[0] + ' 00:00:00');
      const end   = parseSqlDate(days[days.length - 1] + ' 00:00:00');
      const totalDays = Math.round((end - start) / 86400000);
      let cumul = 0;
      const points = []; // { n, xp, dateObj }
      for (let n = 0; n <= totalDays; n++) {
        const d = new Date(start.getTime() + n * 86400000);
        // Clé locale (pas toISOString(), qui convertit en UTC et peut décaler le
        // jour) — doit matcher le format 'YYYY-MM-DD' des clés de byDay.
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        cumul += byDay.get(key) || 0;
        points.push({ n: n, xp: cumul, dateObj: d });
      }

      // PAD_L élargi : place pour le tick "0". PAD_T élargi : place pour le label
      // de valeur au-dessus du point final (toujours au sommet, cumul croissant).
      const W = 300, H = 100, PAD_L = 28, PAD_R = 8, PAD_T = 18, PAD_B = 4;
      const maxXp = points[points.length - 1].xp || 1;
      const x = function(n) { return PAD_L + (n / Math.max(1, totalDays)) * (W - PAD_L - PAD_R); };
      const y = function(xp) { return PAD_T + (1 - xp / maxXp) * (H - PAD_T - PAD_B); };

      const linePath = points.map(function(p, i) { return (i === 0 ? 'M' : 'L') + x(p.n).toFixed(1) + ',' + y(p.xp).toFixed(1); }).join(' ');
      const areaPath = linePath + ` L${x(points[points.length - 1].n).toFixed(1)},${H - PAD_B} L${x(0).toFixed(1)},${H - PAD_B} Z`;

      const last = points[points.length - 1];
      const fmtDate = function(d) { return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); };
      const dotsHtml = points.map(function(p) {
        // Cercle transparent plus grand que le point visible : cible de survol confortable.
        return `<circle cx="${x(p.n).toFixed(1)}" cy="${y(p.xp).toFixed(1)}" r="7" fill="transparent">`
          + `<title>${fmtDate(p.dateObj)} — ${p.xp} XP</title></circle>`;
      }).join('');

      // Échelle Y : seul "0" en bas (le haut affiche déjà le max via le label du
      // point final ci-dessous — le cumul étant croissant, ce point EST le max,
      // donc un 2e tick en haut ferait doublon).
      const yAxisHtml = `<text class="xp-curve-tick" x="${PAD_L - 6}" y="${H - PAD_B}" text-anchor="end" dominant-baseline="middle">0</text>`;

      // Label direct sur le point final (recommandé pour une ligne : valeur à l'extrémité).
      const endLabelX = x(last.n) - 4;
      const endLabelHtml = `<text class="xp-curve-end-label" x="${endLabelX.toFixed(1)}" y="${(y(last.xp) - 8).toFixed(1)}" text-anchor="end">${last.xp} XP</text>`;

      return `
        <svg class="xp-curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Courbe d'XP cumulée du ${fmtDate(points[0].dateObj)} au ${fmtDate(last.dateObj)}, de 0 à ${maxXp} XP">
          <line class="xp-curve-grid" x1="${PAD_L}" y1="${H - PAD_B}" x2="${W - PAD_R}" y2="${H - PAD_B}" />
          <line class="xp-curve-grid" x1="${PAD_L}" y1="${PAD_T}" x2="${W - PAD_R}" y2="${PAD_T}" />
          ${yAxisHtml}
          <path class="xp-curve-area" d="${areaPath}" />
          <path class="xp-curve-line" d="${linePath}" />
          ${dotsHtml}
          <circle class="xp-curve-end" cx="${x(last.n).toFixed(1)}" cy="${y(last.xp).toFixed(1)}" r="4" />
          ${endLabelHtml}
        </svg>
        <div class="xp-curve-axis"><span>${fmtDate(points[0].dateObj)}</span><span>${fmtDate(last.dateObj)}</span></div>`;
    }

    function renderProfile(u) {
      const xpInLevel = u.xp % 100;
      const pct = Math.min(100, Math.round(xpInLevel));
      const badgesOk = u.badges.filter(b => b.unlocked).length;

      // ── Hero ──
      document.getElementById('heroAvatar').textContent = u.username.charAt(0).toUpperCase();
      document.getElementById('heroTitle').textContent = 'Bonjour, ' + u.username + ' !';
      document.getElementById('heroSub').textContent = 'Niveau ' + u.niveau + ' · membre depuis ' + formatMoisAnnee(u.membre_depuis);
      document.getElementById('heroXp').innerHTML = `
        <div class="hero-xp">
          <div class="hero-xp-track"><div class="hero-xp-fill" style="width:${pct}%"></div></div>
          <div class="hero-xp-label">${xpInLevel} / 100 XP pour le niveau ${u.niveau + 1}</div>
        </div>`;
      document.getElementById('heroChip').innerHTML = u.isAdmin
        ? ''
        : `<a href="/classement" class="hero-chip">🏆 ${ordinal(u.rank)} au classement général</a>`;

      // ── Chiffres clés (le niveau est déjà porté par le hero, pas de doublon ici) ──
      document.getElementById('statsRow').innerHTML = `
        <div class="stat"><div class="stat-num">${u.xp}</div><div class="stat-label">XP total</div></div>
        <div class="stat"><div class="stat-num">${u.cours.done}</div><div class="stat-label">Cours terminés</div></div>
        <div class="stat"><div class="stat-num">${u.parties}</div><div class="stat-label">Parties jouées</div></div>
        <div class="stat"><div class="stat-num">${badgesOk}</div><div class="stat-label">Badges obtenus</div></div>`;

      // ── Colonne principale : progression + historique ──
      document.getElementById('colMain').innerHTML = `
        <section class="panel">
          <div class="panel-head">📈 Progression de l'XP</div>
          ${buildXpChartHtml(u.xp_history || [])}
        </section>
        <section class="panel">
          <div class="panel-head">📚 Cours terminés <span class="panel-count">${u.cours.done} / ${u.cours.total}</span></div>
          ${u.cours.liste.length
            ? `<div class="history-list">${u.cours.liste.map(c => `
                <a href="/cours/${esc(c.slug)}" class="history-row">
                  <span class="history-emoji">${c.emoji}</span>
                  <span class="history-title">${esc(c.titre)}</span>
                  <span class="history-date">${formatDate(c.completed_at)}</span>
                </a>`).join('')}</div>`
            : `<div class="course-empty">Aucun cours terminé pour l'instant. <a href="/cours">Commence ici !</a></div>`}
        </section>`;

      // ── Colonne d'appoint : badges + records ──
      document.getElementById('colSide').innerHTML = `
        <section class="panel">
          <div class="panel-head">🎖️ Badges <span class="panel-count">${badgesOk} / ${u.badges.length}</span></div>
          <div class="badge-grid">
            ${u.badges.map(b => `
              <div class="badge ${b.unlocked ? '' : 'locked'}" title="${esc(b.desc)}">
                <div class="badge-emoji">${b.emoji}</div>
                <div class="badge-label">${esc(b.label)}</div>
                <div class="badge-desc">${esc(b.desc)}</div>
              </div>`).join('')}
          </div>
        </section>
        <section class="panel">
          <div class="panel-head">🎮 Records de jeux</div>
          ${u.records.map(r => `
            <a href="/jeu-${r.slug}" class="game-row">
              <div class="game-row-emoji">${r.emoji}</div>
              <div class="game-row-info">
                <div class="game-row-name">${esc(r.nom)}</div>
                <div class="game-row-sub">${r.parties > 0 ? r.parties + ' partie' + (r.parties > 1 ? 's' : '') + ' jouée' + (r.parties > 1 ? 's' : '') : 'Pas encore joué'}</div>
              </div>
              ${r.best !== null
                ? `<div class="game-row-best">🏆 ${r.best} / ${r.max}</div>`
                : `<div class="game-row-best none">Jouer →</div>`}
            </a>`).join('')}
        </section>`;

      // ── Déconnexion ──
      const wrap = document.getElementById('logoutWrap');
      wrap.innerHTML = `<button class="btn-logout" id="btnLogout">Se déconnecter</button>`;
      document.getElementById('btnLogout').addEventListener('click', () => {
        fetch('/api/auth/logout.php', { method: 'POST' })
          .then(() => location.reload());
      });
    }

    function renderGuest() {
      document.getElementById('heroAvatar').textContent = '🌱';
      document.getElementById('heroTitle').textContent = 'Mon compte';
      document.getElementById('heroSub').textContent = 'Rejoins la communauté Composmart';

      // Pas de chiffres ni de colonnes pour un visiteur : une seule carte d'accueil.
      document.getElementById('statsRow').style.display = 'none';
      document.getElementById('profilLayout').classList.add('guest');
      document.getElementById('colSide').style.display = 'none';
      document.getElementById('colMain').innerHTML = `
        <section class="panel">
          <div class="guest-title">Bienvenue !</div>
          <div class="guest-sub">Connecte-toi pour suivre ta progression, gagner de l'XP et débloquer des badges.</div>
          <a href="/signin" class="btn btn-primary">Créer un compte</a>
          <a href="/login" class="btn btn-secondary">Se connecter</a>
        </section>`;
    }
  </script>
