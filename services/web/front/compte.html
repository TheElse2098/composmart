<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
  <link rel="stylesheet" href="/assets/css/dark.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>CompoSmart – Mon compte</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #eef4ec; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

    nav { width: 100%; background: #1e6e3e; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; font-style: italic; text-decoration: none; }
    .nav-logo span { color: #a8e6bf; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-profil { color: rgba(255,255,255,0.85); font-size: 1.3rem; text-decoration: none; line-height: 1; transition: color 0.15s; }
    .nav-profil:hover { color: #fff; }
    .burger { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 4px; }
    .burger span { display: block; width: 26px; height: 3px; background: #fff; border-radius: 2px; transition: all 0.3s ease; }
    .burger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; }
    .burger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
    .drawer { position: fixed; top: 0; right: -320px; width: 280px; max-width: 85vw; height: 100vh; background: #fff; z-index: 200; transition: right 0.32s cubic-bezier(.4,0,.2,1); box-shadow: -4px 0 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; }
    .drawer.open { right: 0; }
    .drawer-header { background: #1e6e3e; padding: 20px 20px 18px; display: flex; align-items: center; justify-content: space-between; }
    .drawer-logo { font-size: 1.2rem; font-weight: 900; color: #fff; letter-spacing: 2px; font-style: italic; }
    .drawer-logo span { color: #a8e6bf; }
    .drawer-close { background: none; border: none; cursor: pointer; color: #fff; font-size: 1.6rem; line-height: 1; padding: 2px 6px; }
    .drawer-menu { list-style: none; padding: 8px 0; flex: 1; overflow-y: auto; }
    .drawer-menu li a { display: flex; align-items: center; gap: 14px; padding: 15px 24px; font-size: 1rem; font-weight: 700; color: #1a3a25; text-decoration: none; transition: background 0.15s; border-left: 3px solid transparent; }
    .drawer-menu li a:hover, .drawer-menu li a.active { background: #eef4ec; border-left-color: #1e6e3e; color: #1e6e3e; }
    .menu-icon { font-size: 1.2rem; width: 24px; text-align: center; }
    .drawer-divider { height: 1px; background: #e5ede8; margin: 4px 24px; }
    .drawer-footer { padding: 16px 24px; border-top: 1px solid #e5ede8; }
    .drawer-footer a { display: flex; align-items: center; gap: 14px; font-size: 0.95rem; font-weight: 600; color: #1e6e3e; text-decoration: none; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .overlay.open { opacity: 1; pointer-events: all; }

    /* ── Hero ── */
    .hero { background: linear-gradient(160deg, #145228 0%, #1e6e3e 55%, #2a9450 100%); padding: 36px 24px 52px; text-align: center; }
    .hero h1 { font-size: clamp(1.3rem, 4vw, 1.8rem); color: #fff; font-weight: 900; margin-top: 14px; }
    .hero-sub { font-size: 0.9rem; color: #a8e6bf; margin-top: 6px; }

    /* Avatar cercle avec initiale */
    .avatar { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 3px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; color: #fff; margin: 0 auto; letter-spacing: 0; }

    /* ── Card ── */
    .card { background: #fff; border-radius: 24px; margin-top: -20px; padding: 32px 24px 40px; max-width: 520px; margin-left: auto; margin-right: auto; position: relative; }

    /* ── Profil connecté ── */
    .stat-row { display: flex; justify-content: space-around; margin-bottom: 28px; }
    .stat-cell { text-align: center; }
    .stat-val { font-size: 1.6rem; font-weight: 900; color: #1e6e3e; line-height: 1; }
    .stat-lbl { font-size: 0.72rem; font-weight: 700; color: #7aaa8a; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 3px; }
    .xp-bar-wrap { background: #eef4ec; border-radius: 20px; height: 10px; margin-bottom: 6px; overflow: hidden; }
    .xp-bar { height: 100%; background: linear-gradient(90deg, #1e6e3e, #2a9450); border-radius: 20px; transition: width 0.6s ease; }
    .xp-label { font-size: 0.72rem; color: #7aaa8a; text-align: right; margin-bottom: 28px; }
    .btn-logout { display: block; width: 100%; background: #fff; color: #c0392b; border: 1.5px solid #c0392b; border-radius: 50px; padding: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: background 0.15s; }
    .btn-logout:hover { background: #fdecea; }

    /* ── Sections enrichies ── */
    .sec-head { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 800; color: #1a3a25; margin: 26px 0 12px; }
    .sec-head .sec-count { margin-left: auto; font-size: 0.78rem; font-weight: 700; color: #7aaa8a; }

    /* Badges */
    .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .badge { text-align: center; padding: 12px 6px; border-radius: 14px; background: #f4f9f4; border: 1.5px solid #e3efe5; transition: transform 0.15s; }
    .badge.locked { opacity: 0.4; filter: grayscale(0.8); }
    .badge:not(.locked) { box-shadow: 0 2px 8px rgba(30,110,62,0.12); }
    .badge:not(.locked):hover { transform: translateY(-2px); }
    .badge-emoji { font-size: 1.7rem; line-height: 1; }
    .badge-label { font-size: 0.68rem; font-weight: 800; color: #1a3a25; margin-top: 5px; line-height: 1.2; }
    .badge-desc { font-size: 0.6rem; color: #7aaa8a; margin-top: 2px; line-height: 1.2; }

    /* Records de jeux */
    .game-row { display: flex; align-items: center; gap: 12px; background: #f4f9f4; border-radius: 14px; padding: 11px 14px; margin-bottom: 9px; text-decoration: none; }
    .game-row:hover { background: #eef4ec; }
    .game-row-emoji { font-size: 1.6rem; flex-shrink: 0; }
    .game-row-info { flex: 1; min-width: 0; }
    .game-row-name { font-size: 0.88rem; font-weight: 800; color: #1a3a25; }
    .game-row-sub { font-size: 0.7rem; color: #7aaa8a; font-weight: 600; margin-top: 1px; }
    .game-row-best { font-size: 0.95rem; font-weight: 900; color: #1e6e3e; white-space: nowrap; flex-shrink: 0; }
    .game-row-best.none { color: #bbb; font-size: 0.78rem; font-weight: 700; }

    /* Cours terminés */
    .course-empty { font-size: 0.82rem; color: #7aaa8a; font-style: italic; }

    /* Historique des cours (timeline datée) */
    .history-list { display: flex; flex-direction: column; gap: 2px; }
    .history-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #eef4ec; text-decoration: none; }
    .history-row:last-child { border-bottom: none; }
    .history-emoji { font-size: 1.15rem; flex-shrink: 0; }
    .history-title { flex: 1; min-width: 0; font-size: 0.82rem; font-weight: 700; color: #1a3a25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-date { font-size: 0.7rem; color: #7aaa8a; font-weight: 600; white-space: nowrap; flex-shrink: 0; }

    /* Courbe de progression XP (une seule série → pas de légende) */
    .xp-curve { width: 100%; height: 100px; display: block; overflow: visible; }
    .xp-curve-grid { stroke: #e3efe5; stroke-width: 1; }
    .xp-curve-area { fill: #2a9450; fill-opacity: 0.1; stroke: none; }
    .xp-curve-line { fill: none; stroke: #2a9450; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .xp-curve-end { fill: #2a9450; stroke: #fff; stroke-width: 2; }
    .xp-curve-tick { font-size: 8px; fill: #7aaa8a; font-weight: 600; }
    .xp-curve-end-label { font-size: 9px; font-weight: 800; fill: #1a3a25; }
    .xp-curve-axis { display: flex; justify-content: space-between; font-size: 0.65rem; color: #7aaa8a; font-weight: 600; margin-top: 4px; }
    .xp-chart-empty { font-size: 0.82rem; color: #7aaa8a; font-style: italic; }

    /* ── Non connecté ── */
    .guest-title { font-size: 1.2rem; font-weight: 800; color: #1a3a25; margin-bottom: 8px; text-align: center; }
    .guest-sub { font-size: 0.9rem; color: #7aaa8a; text-align: center; margin-bottom: 32px; line-height: 1.5; }
    .btn-primary { display: block; width: 100%; background: #1e6e3e; color: #fff; border: none; border-radius: 50px; padding: 14px; font-size: 1rem; font-weight: 700; text-decoration: none; text-align: center; margin-bottom: 12px; cursor: pointer; transition: opacity 0.15s; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-secondary { display: block; width: 100%; background: #fff; color: #1e6e3e; border: 1.5px solid #1e6e3e; border-radius: 50px; padding: 14px; font-size: 1rem; font-weight: 700; text-decoration: none; text-align: center; cursor: pointer; transition: background 0.15s; }
    .btn-secondary:hover { background: #eef4ec; }

    /* dark mode */
    html.dark .card { background: #1a2b1e; }
    html.dark .guest-title { color: #c8e6d4; }
    html.dark .guest-sub { color: #5a8a6a; }
    html.dark .stat-val { color: #52b788; }
    html.dark .stat-lbl { color: #4a7a5a; }
    html.dark .xp-bar-wrap { background: #243328; }
    html.dark .xp-label { color: #4a7a5a; }
    html.dark .btn-secondary { background: #1a2b1e; color: #52b788; border-color: #2d4030; }
    html.dark .btn-secondary:hover { background: #243328; }
    html.dark .btn-logout { background: #1a2b1e; color: #e57373; border-color: #4d2a2a; }
    html.dark .btn-logout:hover { background: #2d1a1a; }
    html.dark .drawer { background: #1a2b1e; }
    html.dark .drawer-menu li a { color: #b0d4be; }
    html.dark .drawer-menu li a:hover, html.dark .drawer-menu li a.active { background: #243328; color: #52b788; border-left-color: #52b788; }
    html.dark .drawer-divider { background: #2a3d2e; }
    html.dark .sec-head { color: #c8e6d4; }
    html.dark .badge { background: #16241a; border-color: #243a2c; }
    html.dark .badge-label { color: #c8e6d4; }
    html.dark .badge-desc, html.dark .sec-head .sec-count, html.dark .game-row-sub { color: #5a8a6a; }
    html.dark .game-row { background: #16241a; }
    html.dark .game-row:hover { background: #1e2d22; }
    html.dark .game-row-name { color: #c8e6d4; }
    html.dark .game-row-best { color: #52b788; }
    html.dark .history-row { border-bottom-color: #243328; }
    html.dark .history-title { color: #c8e6d4; }
    html.dark .history-date, html.dark .xp-chart-empty, html.dark .xp-curve-axis { color: #4a7a5a; }
    html.dark .xp-curve-grid { stroke: #243328; }
    html.dark .xp-curve-area { fill: #52b788; }
    html.dark .xp-curve-line { stroke: #52b788; }
    html.dark .xp-curve-end { fill: #52b788; stroke: #1a2b1e; }
    html.dark .xp-curve-tick { fill: #4a7a5a; }
    html.dark .xp-curve-end-label { fill: #c8e6d4; }

    /* Puce rang */
    .rank-chip { display: inline-flex; align-items: center; gap: 6px; background: #fff9c4; color: #b26a00; border-radius: 20px; padding: 7px 16px; font-size: 0.82rem; font-weight: 800; text-decoration: none; margin-bottom: 24px; transition: background 0.15s; }
    .rank-chip:hover { background: #fff176; }
    html.dark .rank-chip { background: rgba(249,168,37,0.15); color: #f9a825; }
    html.dark .rank-chip:hover { background: rgba(249,168,37,0.25); }
  </style>

  <div class="hero" id="hero">
    <div class="avatar" id="heroAvatar">👤</div>

  <div class="card" id="cardContent">

  <script>
    const burger = document.getElementById('burgerBtn');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    const closeBtn = document.getElementById('closeBtn');
    function openMenu() { drawer.classList.add('open'); overlay.classList.add('open'); burger.classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeMenu() { drawer.classList.remove('open'); overlay.classList.remove('open'); burger.classList.remove('open'); document.body.style.overflow = ''; }
    burger.addEventListener('click', openMenu);
    closeBtn.addEventListener('click', closeMenu);
    overlay.addEventListener('click', closeMenu);

    function esc(t) { const d = document.createElement('div'); d.textContent = (t == null ? '' : String(t)); return d.innerHTML; }

    // profile.php (db-core) ne connaît pas les jeux : on agrège les records jeux
    // depuis games-api (db-games), puis on complète badges + parties côté front.
    Promise.all([
      fetch('/api/auth/profile.php').then(r => r.json()).catch(() => ({})),
      fetch('/api/jeux/score.php?action=profile').then(r => r.json()).catch(() => ({ records: [], parties: 0 })),
    ]).then(([profile, jeux]) => {
      if (!profile.logged_in) { renderGuest(); return; }
      profile.records = jeux.records || [];
      profile.parties = jeux.parties || 0;
      // Badges jeux (db-games) injectés ici : Joueur + Touche-à-tout.
      const nbJeux = profile.records.filter(r => r.best !== null).length;
      const allJeux = profile.records.length > 0 && nbJeux >= profile.records.length;
      profile.badges.splice(2, 0,
        { emoji: '🎮', label: 'Joueur',        desc: 'Jouer à un mini-jeu',  unlocked: profile.parties >= 1 },
        { emoji: '🏆', label: 'Touche-à-tout', desc: 'Essayer tous les jeux', unlocked: allJeux });
      renderProfile(profile);
    });

    function ordinal(n) { return n === 1 ? '1er' : n + 'e'; }

    // completed_at/created_at viennent en 'YYYY-MM-DD HH:MM:SS' (datetime MySQL, sans
    // fuseau) : on force le 'T' pour un parsing fiable cross-navigateur.
    function parseSqlDate(s) { return new Date(String(s).replace(' ', 'T')); }
    function formatDate(s) {
      return parseSqlDate(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    }

    // Agrège xp_history (liste d'événements datés, ASC) par jour civil pour obtenir
    // l'XP cumulée jour par jour depuis le premier gain, puis rend une courbe SVG
    // (ligne + aire légère). Série unique → pas de légende, dates réelles en axe X
    // (cf. skill dataviz, marks-and-anatomy).
    function buildXpChartHtml(history) {
      if (!history.length) {
        return `<div class="sec-head">📈 Progression de l'XP</div><div class="xp-chart-empty">Pas encore assez de données pour un graphique.</div>`;
      }
      const byDay = new Map();
      history.forEach(function(ev) {
        const day = String(ev.created_at).slice(0, 10); // 'YYYY-MM-DD'
        byDay.set(day, (byDay.get(day) || 0) + ev.delta);
      });
      const days = Array.from(byDay.keys()); // ASC (insertion suit history, déjà trié)

      // Cumul jour par jour depuis le tout premier événement, en comblant les jours
      // sans gain (sinon la courbe "saute" les jours creux au lieu de rester plate).
      const start = parseSqlDate(days[0] + ' 00:00:00');
      const end   = parseSqlDate(days[days.length - 1] + ' 00:00:00');
      const totalDays = Math.round((end - start) / 86400000);
      let cumul = 0;
      const points = []; // { n, xp, dateObj }
      for (let n = 0; n <= totalDays; n++) {
        const d = new Date(start.getTime() + n * 86400000);
        // Clé locale (pas toISOString(), qui convertit en UTC et peut décaler le
        // jour) — doit matcher le format 'YYYY-MM-DD' des clés de byDay.
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        cumul += byDay.get(key) || 0;
        points.push({ n: n, xp: cumul, dateObj: d });
      }

      // PAD_L élargi : place pour le tick "0". PAD_T élargi : place pour le label
      // de valeur au-dessus du point final (toujours au sommet, cumul croissant).
      const W = 300, H = 100, PAD_L = 28, PAD_R = 8, PAD_T = 18, PAD_B = 4;
      const maxXp = points[points.length - 1].xp || 1;
      const x = function(n) { return PAD_L + (n / Math.max(1, totalDays)) * (W - PAD_L - PAD_R); };
      const y = function(xp) { return PAD_T + (1 - xp / maxXp) * (H - PAD_T - PAD_B); };

      const linePath = points.map(function(p, i) { return (i === 0 ? 'M' : 'L') + x(p.n).toFixed(1) + ',' + y(p.xp).toFixed(1); }).join(' ');
      const areaPath = linePath + ` L${x(points[points.length - 1].n).toFixed(1)},${H - PAD_B} L${x(0).toFixed(1)},${H - PAD_B} Z`;

      const last = points[points.length - 1];
      const fmtDate = function(d) { return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); };
      const dotsHtml = points.map(function(p) {
        // Cercle transparent plus grand que le point visible : cible de survol confortable.
        return `<circle cx="${x(p.n).toFixed(1)}" cy="${y(p.xp).toFixed(1)}" r="7" fill="transparent">`
          + `<title>${fmtDate(p.dateObj)} — ${p.xp} XP</title></circle>`;
      }).join('');

      // Échelle Y : seul "0" en bas (le haut affiche déjà le max via le label du
      // point final ci-dessous — le cumul étant croissant, ce point EST le max,
      // donc un 2e tick en haut ferait doublon).
      const yAxisHtml = `<text class="xp-curve-tick" x="${PAD_L - 6}" y="${H - PAD_B}" text-anchor="end" dominant-baseline="middle">0</text>`;

      // Label direct sur le point final (recommandé pour une ligne : valeur à l'extrémité).
      const endLabelX = x(last.n) - 4;
      const endLabelHtml = `<text class="xp-curve-end-label" x="${endLabelX.toFixed(1)}" y="${(y(last.xp) - 8).toFixed(1)}" text-anchor="end">${last.xp} XP</text>`;

      return `
        <div class="sec-head">📈 Progression de l'XP</div>
        <svg class="xp-curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Courbe d'XP cumulée du ${fmtDate(points[0].dateObj)} au ${fmtDate(last.dateObj)}, de 0 à ${maxXp} XP">
          <line class="xp-curve-grid" x1="${PAD_L}" y1="${H - PAD_B}" x2="${W - PAD_R}" y2="${H - PAD_B}" />
          <line class="xp-curve-grid" x1="${PAD_L}" y1="${PAD_T}" x2="${W - PAD_R}" y2="${PAD_T}" />
          ${yAxisHtml}
          <path class="xp-curve-area" d="${areaPath}" />
          <path class="xp-curve-line" d="${linePath}" />
          ${dotsHtml}
          <circle class="xp-curve-end" cx="${x(last.n).toFixed(1)}" cy="${y(last.xp).toFixed(1)}" r="4" />
          ${endLabelHtml}
        </svg>
        <div class="xp-curve-axis"><span>${fmtDate(points[0].dateObj)}</span><span>${fmtDate(last.dateObj)}</span></div>`;
    }

    function renderProfile(u) {
      const initial = u.username.charAt(0).toUpperCase();
      document.getElementById('heroAvatar').textContent = initial;
      document.getElementById('heroTitle').textContent = 'Bonjour, ' + esc(u.username) + ' !';
      document.getElementById('heroSub').textContent = 'Niveau ' + u.niveau + ' · ' + u.xp + ' XP';

      const xpInLevel = u.xp % 100;
      const xpToNext  = 100;
      const pct       = Math.min(100, Math.round(xpInLevel / xpToNext * 100));

      // Stats : niveau, XP, cours finis, parties
      const statsHtml = `
        <div class="stat-row">
          <div class="stat-cell"><div class="stat-val">${u.niveau}</div><div class="stat-lbl">Niveau</div></div>
          <div class="stat-cell"><div class="stat-val">${u.xp}</div><div class="stat-lbl">XP total</div></div>
          <div class="stat-cell"><div class="stat-val">${u.cours.done}</div><div class="stat-lbl">Cours finis</div></div>
          <div class="stat-cell"><div class="stat-val">${u.parties}</div><div class="stat-lbl">Parties</div></div>
        </div>
        <div class="xp-bar-wrap"><div class="xp-bar" style="width:${pct}%"></div></div>
        <div class="xp-label">${xpInLevel} / ${xpToNext} XP pour le niveau ${u.niveau + 1}</div>
        ${u.isAdmin ? '' : `<a href="/classement" class="rank-chip">🏆 ${ordinal(u.rank)} au classement général</a>`}`;

      // Badges
      const badgesHtml = `
        <div class="sec-head">🎖️ Badges <span class="sec-count">${u.badges.filter(b => b.unlocked).length} / ${u.badges.length}</span></div>
        <div class="badge-grid">
          ${u.badges.map(b => `
            <div class="badge ${b.unlocked ? '' : 'locked'}" title="${esc(b.desc)}">
              <div class="badge-emoji">${b.emoji}</div>
              <div class="badge-label">${esc(b.label)}</div>
              <div class="badge-desc">${esc(b.desc)}</div>
            </div>`).join('')}
        </div>`;

      // Records de jeux
      const recordsHtml = `
        <div class="sec-head">🎮 Records de jeux</div>
        ${u.records.map(r => `
          <a href="/jeu-${r.slug}" class="game-row">
            <div class="game-row-emoji">${r.emoji}</div>
            <div class="game-row-info">
              <div class="game-row-name">${esc(r.nom)}</div>
              <div class="game-row-sub">${r.parties > 0 ? r.parties + ' partie' + (r.parties > 1 ? 's' : '') + ' jouée' + (r.parties > 1 ? 's' : '') : 'Pas encore joué'}</div>
            </div>
            ${r.best !== null
              ? `<div class="game-row-best">🏆 ${r.best} / ${r.max}</div>`
              : `<div class="game-row-best none">Jouer →</div>`}
          </a>`).join('')}`;

      // Historique des cours (chronologique, daté)
      const historyHtml = `
        <div class="sec-head">📚 Cours terminés <span class="sec-count">${u.cours.done} / ${u.cours.total}</span></div>
        ${u.cours.liste.length
          ? `<div class="history-list">${u.cours.liste.map(c => `
              <a href="/cours/${esc(c.slug)}" class="history-row">
                <span class="history-emoji">${c.emoji}</span>
                <span class="history-title">${esc(c.titre)}</span>
                <span class="history-date">${formatDate(c.completed_at)}</span>
              </a>`).join('')}</div>`
          : `<div class="course-empty">Aucun cours terminé pour l'instant. <a href="/cours">Commence ici !</a></div>`}`;

      // Histogramme XP : agrégation par jour (delta cumulé du jour, cours + jeux confondus)
      const xpChartHtml = buildXpChartHtml(u.xp_history || []);

      document.getElementById('cardContent').innerHTML =
        statsHtml + badgesHtml + recordsHtml + xpChartHtml + historyHtml +
        `<button class="btn-logout" id="btnLogout" style="margin-top:28px">Se déconnecter</button>`;

      document.getElementById('btnLogout').addEventListener('click', () => {
        fetch('/api/auth/logout.php', { method: 'POST' })
          .then(() => location.reload());
      });
    }

    function renderGuest() {
      document.getElementById('heroAvatar').textContent = '🌱';
      document.getElementById('heroTitle').textContent = 'Mon compte';
      document.getElementById('heroSub').textContent = 'Rejoignez la communauté CompoSmart';

      document.getElementById('cardContent').innerHTML = `
        <div class="guest-title">Bienvenue !</div>
        <div class="guest-sub">Connectez-vous pour suivre votre progression,<br>gagner de l'XP et débloquer des badges.</div>
        <a href="/signin" class="btn-primary">Créer un compte</a>
        <a href="/login" class="btn-secondary">Se connecter</a>
        <div style="margin-top:20px;text-align:center"><a href="/classement" class="rank-chip">🏆 Voir le classement général</a></div>
      `;
    }
  </script>

  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/admin-badge.js?v=2"></script>
</body>
</html>
