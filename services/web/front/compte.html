<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
  <link rel="stylesheet" href="/assets/css/dark.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;900&family=Nunito:wght@400;600;700;900&display=swap">
  <title>CompoSmart – Mon compte</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #eef4ec; font-family: 'Nunito', Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── NAV / DRAWER (markup injecté par site-nav.js) ── */
    nav { width: 100%; background: #1e6e3e; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-family: 'Baloo 2', cursive; font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; font-style: italic; text-decoration: none; }
    .nav-logo span { color: #a8e6bf; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-profil { color: rgba(255,255,255,0.85); font-size: 1.3rem; text-decoration: none; line-height: 1; transition: color 0.15s; }
    .nav-profil:hover { color: #fff; }
    .burger { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 4px; }
    .burger span { display: block; width: 26px; height: 3px; background: #fff; border-radius: 2px; transition: all 0.3s ease; }
    .burger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; }
    .burger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
    .drawer { position: fixed; top: 0; right: -320px; width: 280px; max-width: 85vw; height: 100vh; background: #fff; z-index: 200; transition: right 0.32s cubic-bezier(.4,0,.2,1); box-shadow: -4px 0 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; }
    .drawer.open { right: 0; }
    .drawer-header { background: #1e6e3e; padding: 20px 20px 18px; display: flex; align-items: center; justify-content: space-between; }
    .drawer-logo { font-family: 'Baloo 2', cursive; font-size: 1.2rem; font-weight: 900; color: #fff; letter-spacing: 2px; font-style: italic; }
    .drawer-logo span { color: #a8e6bf; }
    .drawer-close { background: none; border: none; cursor: pointer; color: #fff; font-size: 1.6rem; line-height: 1; padding: 2px 6px; }
    .drawer-menu { list-style: none; padding: 8px 0; flex: 1; overflow-y: auto; }
    .drawer-menu li a { display: flex; align-items: center; gap: 14px; padding: 15px 24px; font-size: 1rem; font-weight: 700; color: #1a3a25; text-decoration: none; transition: background 0.15s; border-left: 3px solid transparent; }
    .drawer-menu li a:hover, .drawer-menu li a.active { background: #eef4ec; border-left-color: #1e6e3e; color: #1e6e3e; }
    .menu-icon { font-size: 1.2rem; width: 24px; text-align: center; }
    .drawer-divider { height: 1px; background: #e5ede8; margin: 4px 24px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .overlay.open { opacity: 1; pointer-events: all; }

    /* ── HERO ──
       Même traitement que l'accueil (motif + dégradé + courbe elliptique) : la
       page de profil doit appartenir au même site, pas ressembler à un module à part. */
    .hero {
      position: relative; text-align: center; padding: 56px 20px 84px; color: #fff; overflow: hidden;
      background-color: #1e6e3e;
      background-image: url('/assets/img/motif-branchage-light.svg'), linear-gradient(160deg, #145228 0%, #1e6e3e 55%, #2d9959 100%);
      background-repeat: repeat, no-repeat;
      background-size: 220px 220px, cover;
    }
    .hero::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 60px; background: #eef4ec; clip-path: ellipse(75% 100% at 50% 100%); }
    .hero-inner { position: relative; z-index: 2; max-width: 620px; margin: 0 auto; }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 18px;
      background: rgba(255,255,255,0.16); border: 3px solid rgba(255,255,255,0.45);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Baloo 2', cursive; font-size: 2.6rem; font-weight: 900; color: #fff;
      backdrop-filter: blur(4px);
    }
    .hero h1 { font-family: 'Baloo 2', cursive; font-size: clamp(1.7rem, 5vw, 2.6rem); font-weight: 900; line-height: 1.15; }
    .hero-sub { font-size: 1rem; color: rgba(255,255,255,0.9); font-weight: 600; margin-top: 6px; }

    /* Barre de niveau dans le hero : l'info d'identité la plus lue, elle mérite
       la place forte plutôt qu'une ligne perdue au milieu des sections. */
    .hero-xp { max-width: 420px; margin: 24px auto 0; }
    .hero-xp-track { height: 10px; background: rgba(255,255,255,0.22); border-radius: 20px; overflow: hidden; }
    .hero-xp-fill { height: 100%; background: #a8e6bf; border-radius: 20px; transition: width 0.7s cubic-bezier(.4,0,.2,1); }
    .hero-xp-label { font-size: 0.82rem; color: rgba(255,255,255,0.85); font-weight: 700; margin-top: 8px; }
    .hero-chip {
      display: inline-flex; align-items: center; gap: 7px; margin-top: 20px;
      background: rgba(255,255,255,0.15); color: #fff; border: 1.5px solid rgba(255,255,255,0.4);
      border-radius: 50px; padding: 9px 18px; font-size: 0.85rem; font-weight: 800;
      text-decoration: none; backdrop-filter: blur(4px); transition: background 0.15s, transform 0.15s;
    }
    .hero-chip:hover { background: rgba(255,255,255,0.26); transform: translateY(-2px); }

    /* ── CHIFFRES CLÉS (chevauchent la courbe du hero, comme sur l'accueil) ── */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 900px; margin: -52px auto 0; padding: 0 20px; position: relative; z-index: 5; }
    .stat { background: #fff; border-radius: 20px; padding: 20px 14px; text-align: center; box-shadow: 0 6px 22px rgba(30,110,62,0.12); }
    .stat-num { font-family: 'Baloo 2', cursive; font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 900; color: #1e6e3e; line-height: 1; }
    .stat-label { font-size: 0.8rem; color: #4a7a5a; font-weight: 700; margin-top: 6px; }

    /* ── LAYOUT ── une colonne en mobile, deux en desktop (pas de module centré) */
    .profil-layout { width: 100%; max-width: 1120px; margin: 0 auto; padding: 40px 20px 0; display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
    .col-main, .col-side { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

    .panel { background: #fff; border-radius: 22px; padding: 24px; box-shadow: 0 4px 16px rgba(30,110,62,0.08); }
    .panel-head { display: flex; align-items: center; gap: 9px; font-family: 'Baloo 2', cursive; font-size: 1.1rem; font-weight: 900; color: #1a3a25; margin-bottom: 16px; }
    .panel-count { margin-left: auto; font-family: 'Nunito', sans-serif; font-size: 0.76rem; font-weight: 800; color: #4a7a5a; background: #eef4ec; padding: 3px 11px; border-radius: 20px; }

    /* Badges */
    .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .badge { text-align: center; padding: 14px 6px; border-radius: 16px; background: #f4f9f4; border: 1.5px solid #e3efe5; transition: transform 0.15s; }
    .badge.locked { opacity: 0.4; filter: grayscale(0.8); }
    .badge:not(.locked) { box-shadow: 0 2px 8px rgba(30,110,62,0.12); }
    .badge:not(.locked):hover { transform: translateY(-3px); }
    .badge-emoji { font-size: 1.8rem; line-height: 1; }
    .badge-label { font-family: 'Baloo 2', cursive; font-size: 0.72rem; font-weight: 900; color: #1a3a25; margin-top: 6px; line-height: 1.2; }
    .badge-desc { font-size: 0.62rem; color: #7aaa8a; margin-top: 2px; line-height: 1.25; font-weight: 600; }

    /* Records de jeux */
    .game-row { display: flex; align-items: center; gap: 12px; background: #f4f9f4; border-radius: 14px; padding: 12px 14px; text-decoration: none; transition: background 0.15s, transform 0.15s; }
    .game-row + .game-row { margin-top: 9px; }
    .game-row:hover { background: #eef4ec; transform: translateX(3px); }
    .game-row-emoji { font-size: 1.6rem; flex-shrink: 0; }
    .game-row-info { flex: 1; min-width: 0; }
    .game-row-name { font-family: 'Baloo 2', cursive; font-size: 0.92rem; font-weight: 900; color: #1a3a25; }
    .game-row-sub { font-size: 0.72rem; color: #7aaa8a; font-weight: 600; margin-top: 1px; }
    .game-row-best { font-family: 'Baloo 2', cursive; font-size: 1rem; font-weight: 900; color: #1e6e3e; white-space: nowrap; flex-shrink: 0; }
    .game-row-best.none { color: #bbb; font-size: 0.8rem; }

    /* Historique des cours */
    .history-list { display: flex; flex-direction: column; }
    .history-row { display: flex; align-items: center; gap: 11px; padding: 10px 4px; border-bottom: 1px solid #eef4ec; text-decoration: none; transition: background 0.12s; border-radius: 8px; }
    .history-row:last-child { border-bottom: none; }
    .history-row:hover { background: #f4f9f4; }
    .history-emoji { font-size: 1.2rem; flex-shrink: 0; }
    .history-title { flex: 1; min-width: 0; font-size: 0.86rem; font-weight: 700; color: #1a3a25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-date { font-size: 0.72rem; color: #7aaa8a; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
    .course-empty { font-size: 0.85rem; color: #7aaa8a; font-weight: 600; }
    .course-empty a { color: #1e6e3e; font-weight: 800; }

    /* ── Mes signalements ── */
    .ticket-row { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #eef4ec; cursor: pointer; border-radius: 8px; background: none; border-left: none; border-right: none; border-top: none; width: 100%; text-align: left; font-family: inherit; }
    .ticket-row:hover { background: #f6faf6; }
    .ticket-row:last-child { border-bottom: none; }
    .ticket-chip { font-size: 0.64rem; font-weight: 900; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.4px; flex-shrink: 0; }
    .ticket-chip.ouvert { background: #e4f6ea; color: #1e6e3e; }
    .ticket-chip.clos { background: #eceff1; color: #607d8b; }
    .ticket-chip.clos_definitif { background: #fdecea; color: #c0392b; }
    .ticket-sujet { flex: 1; min-width: 0; font-size: 0.85rem; font-weight: 700; color: #1a3a25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ticket-date { font-size: 0.7rem; color: #7aaa8a; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
    .ticket-reponse { background: #e53935; color: #fff; font-size: 0.62rem; font-weight: 900; padding: 2px 7px; border-radius: 20px; flex-shrink: 0; text-transform: uppercase; }
    .ticket-voir-clos { background: none; border: none; color: #7aaa8a; font-family: inherit; font-size: 0.78rem; font-weight: 800; cursor: pointer; margin-top: 8px; text-decoration: underline; text-underline-offset: 3px; }
    .ticket-voir-clos:hover { color: #1e6e3e; }

    /* Fil de discussion (boîte modale) */
    .tchat-voile { position: fixed; inset: 0; background: rgba(15,24,17,0.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 300; }
    .tchat-voile.ouvert { display: flex; }
    .tchat { background: #fff; border-radius: 18px; width: 100%; max-width: 520px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
    .tchat-tete { padding: 13px 16px; border-bottom: 1.5px solid #eef4ec; display: flex; align-items: center; gap: 10px; }
    .tchat-titre { flex: 1; min-width: 0; font-family: 'Baloo 2', cursive; font-weight: 900; font-size: 0.92rem; color: #1a3a25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tchat-fermer { background: none; border: none; font-size: 1.05rem; cursor: pointer; color: #7aaa8a; }
    .tchat-fil { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #f6faf6; min-height: 160px; }
    /* overflow-wrap:anywhere — une URL collée sans espaces ne doit pas élargir
       la bulle au-delà de la fenêtre. */
    .bulle { max-width: 82%; border-radius: 14px; padding: 8px 12px; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bulle.moi { align-self: flex-end; background: #1e6e3e; color: #fff; border-bottom-right-radius: 4px; }
    .bulle.admin { align-self: flex-start; background: #fff; color: #1a3a25; border: 1px solid #e0eee4; border-bottom-left-radius: 4px; }
    .bulle-meta { font-size: 0.64rem; font-weight: 800; opacity: 0.75; margin-bottom: 3px; }
    .tchat-info { padding: 8px 14px; font-size: 0.78rem; font-weight: 700; text-align: center; background: #fdf1d8; color: #8a6100; }
    .tchat-saisie { padding: 10px 12px; border-top: 1.5px solid #eef4ec; display: flex; gap: 8px; align-items: flex-end; }
    .tchat-saisie textarea { flex: 1; min-width: 0; resize: none; border: 1.5px solid #c8dfc8; border-radius: 12px; padding: 9px 12px; font-family: inherit; font-size: 0.86rem; background: #f7fbf8; color: #1a3a25; }
    .tchat-saisie textarea:focus { outline: none; border-color: #1e6e3e; background: #fff; }
    .tchat-envoyer { background: #1e6e3e; color: #fff; border: none; border-radius: 12px; padding: 10px 16px; font-family: 'Baloo 2', cursive; font-weight: 800; cursor: pointer; }
    .tchat-envoyer:disabled { opacity: 0.5; cursor: default; }
    .tchat-actions { display: flex; gap: 8px; padding: 0 12px 12px; }
    .tchat-btn { flex: 1; background: #fff; border: 1.5px solid #d4e6d8; color: #4a7a5a; border-radius: 10px; padding: 8px; font-size: 0.76rem; font-weight: 800; cursor: pointer; font-family: 'Baloo 2', cursive; }
    .tchat-btn:hover { border-color: #1e6e3e; color: #1e6e3e; }
    .tchat-err { padding: 0 14px 10px; font-size: 0.76rem; font-weight: 700; color: #c0392b; text-align: center; }
    .tchat-err[hidden] { display: none; }

    /* Courbe de progression XP (une seule série → pas de légende) */
    .xp-curve { width: 100%; height: 120px; display: block; overflow: visible; }
    .xp-curve-grid { stroke: #e3efe5; stroke-width: 1; }
    .xp-curve-area { fill: #2d9959; fill-opacity: 0.12; stroke: none; }
    .xp-curve-line { fill: none; stroke: #2d9959; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    /* Total en HTML, hors du SVG étiré : police du site, jamais déformée. */
    .xp-curve-total { font-family: 'Baloo 2', cursive; font-size: 1.5rem; font-weight: 900; color: #1e6e3e; line-height: 1; margin-bottom: 12px; }
    .xp-curve-total span { font-family: 'Nunito', sans-serif; font-size: 0.78rem; font-weight: 700; color: #7aaa8a; }
    .xp-curve-axis { display: flex; justify-content: space-between; font-size: 0.7rem; color: #7aaa8a; font-weight: 700; margin-top: 6px; }
    .xp-chart-empty { font-size: 0.85rem; color: #7aaa8a; font-weight: 600; }

    /* Bloc « Mon compte » : libellé à gauche, valeur à droite. La valeur peut
       être une adresse email longue dans une colonne étroite → elle doit pouvoir
       se couper (overflow-wrap) et le conteneur flex l'autoriser (min-width:0). */
    .info-list { display: flex; flex-direction: column; gap: 2px; }
    .info-row { display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid #eef4ec; }
    .info-row:last-child { border-bottom: none; }
    .info-key { flex-shrink: 0; font-size: 0.74rem; font-weight: 800; color: #7aaa8a; text-transform: uppercase; letter-spacing: 0.4px; }
    .info-value { flex: 1; min-width: 0; text-align: right; font-size: 0.86rem; font-weight: 700; color: #1a3a25; overflow-wrap: anywhere; }
    .info-tag { display: inline-block; font-size: 0.72rem; font-weight: 800; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
    .info-tag.ok { background: #e4f6ea; color: #1e6e3e; }
    .info-tag.pending { background: #fdf1d8; color: #8a6100; }
    .info-link { display: inline-block; margin-top: 14px; font-size: 0.8rem; font-weight: 800; color: #1e6e3e; text-decoration: underline; text-underline-offset: 3px; }
    .info-btn { width: 100%; margin-top: 14px; padding: 10px; border-radius: 50px; border: 1.5px solid #f0d49a; background: #fdf1d8; color: #8a6100; font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 0.85rem; cursor: pointer; }
    .info-btn:hover { background: #fbe7bd; }
    .info-btn:disabled { opacity: 0.6; cursor: default; }
    .info-msg { margin-top: 8px; font-size: 0.78rem; font-weight: 700; color: #8a6100; text-align: center; }
    .info-msg[hidden] { display: none; }

    /* Déconnexion : action rare, en lien discret plutôt qu'en gros bouton rouge */
    .logout-wrap { max-width: 1120px; margin: 0 auto; padding: 26px 20px 48px; text-align: center; }
    .btn-logout { background: none; border: none; color: #c0392b; font-family: inherit; font-size: 0.88rem; font-weight: 700; cursor: pointer; padding: 10px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(192,57,43,0.35); }
    .btn-logout:hover { text-decoration-color: currentColor; }

    /* Suppression de compte : irréversible, donc repliée par défaut et bien
       séparée de la déconnexion — on ne clique pas l'une en visant l'autre. */
    .danger-sep { max-width: 420px; margin: 4px auto 14px; height: 1px; background: #e3efe5; }
    .btn-danger-open { background: none; border: none; color: #9aa8a0; font-family: inherit; font-size: 0.78rem; font-weight: 700; cursor: pointer; padding: 6px 10px; }
    .btn-danger-open:hover { color: #c0392b; }
    .danger-panel { max-width: 460px; margin: 14px auto 0; background: #fff5f4; border: 1.5px solid #f0c9c4; border-radius: 16px; padding: 20px; text-align: left; }
    .danger-panel[hidden] { display: none; }
    .danger-title { font-family: 'Baloo 2', cursive; font-size: 1.05rem; font-weight: 900; color: #c0392b; margin-bottom: 8px; }
    .danger-text { font-size: 0.84rem; color: #6b4a46; font-weight: 600; line-height: 1.6; margin-bottom: 14px; }
    .danger-text b { color: #c0392b; }
    .danger-label { display: block; font-size: 0.78rem; font-weight: 800; color: #6b4a46; margin-bottom: 6px; }
    .danger-input { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1.5px solid #f0c9c4; background: #fff; font-family: inherit; font-size: 0.9rem; color: #1a3a25; margin-bottom: 12px; }
    .danger-input:focus { outline: none; border-color: #c0392b; }
    .danger-actions { display: flex; gap: 10px; }
    .btn-danger-go, .btn-danger-cancel { flex: 1; padding: 11px; border-radius: 50px; font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 0.9rem; cursor: pointer; border: none; transition: background 0.18s, opacity 0.18s; }
    .btn-danger-go { background: #c0392b; color: #fff; }
    .btn-danger-go:hover { background: #a5301f; }
    .btn-danger-go:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-danger-cancel { background: #fff; color: #6b4a46; border: 1.5px solid #f0c9c4; }
    .btn-danger-cancel:hover { background: #fdecea; }
    .danger-msg { font-size: 0.8rem; font-weight: 700; color: #c0392b; margin-top: 10px; }

    /* ── Non connecté ── */
    .guest { max-width: 460px; margin: 0 auto; text-align: center; }
    .guest .panel { padding: 34px 26px; }
    .guest-title { font-family: 'Baloo 2', cursive; font-size: 1.4rem; font-weight: 900; color: #1a3a25; margin-bottom: 8px; }
    .guest-sub { font-size: 0.92rem; color: #4a7a5a; font-weight: 600; margin-bottom: 26px; line-height: 1.55; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 50px; font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 0.98rem; text-decoration: none; cursor: pointer; border: none; transition: transform 0.18s, box-shadow 0.18s, background 0.18s; }
    .btn-primary { background: #1e6e3e; color: #fff; box-shadow: 0 4px 14px rgba(30,110,62,0.28); margin-bottom: 10px; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,110,62,0.34); }
    .btn-secondary { background: #fff; color: #1e6e3e; border: 1.5px solid #a8e6bf; }
    .btn-secondary:hover { background: #eef4ec; }

    .bottom-leaf { position: fixed; bottom: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #1e6e3e, #52b788, #a7c957, #52b788, #1e6e3e); z-index: 90; }

    /* ── DESKTOP ── */
    @media (min-width: 640px) {
      .stats { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 900px) {
      /* Deux colonnes : la progression (lecture longue) à gauche, les blocs
         courts (badges, records) en colonne d'appoint à droite. */
      .profil-layout { grid-template-columns: 1.45fr 1fr; padding-top: 48px; }
      /* Visiteur non connecté : une seule carte, donc on annule la 2e colonne
         (sinon la carte se coincerait dans la colonne de gauche). */
      .profil-layout.guest { grid-template-columns: 1fr; }
    }

    /* ── DARK MODE ── */
    html.dark body { background: #0f1811; color: #e8f5ee; }
    html.dark .hero {
      background-color: #0d2f18;
      background-image: url('/assets/img/motif-branchage-dark.svg'), linear-gradient(160deg, #0d2f18 0%, #12401f 55%, #1a5c33 100%);
      background-repeat: repeat, no-repeat;
      background-size: 220px 220px, cover;

    html.dark .hero-sub { color: rgba(255,255,255,0.82); }

    html.dark .guest-sub { color: #7ab88e; }

    html.dark .xp-curve-total span { color: #7ab88e; }
    html.dark .btn-primary { background: #2d9959; }
    html.dark .btn-secondary { background: #16211a; color: #52b788; border-color: #2d4030; }
    html.dark .btn-secondary:hover { background: #1e2d22; }

    html.dark .ticket-voir-clos:hover { color: #52b788; }

    html.dark .btn-logout { color: #e57373; }
    html.dark .danger-sep { background: #243328; }

    html.dark .btn-danger-open:hover { color: #e57373; }

    html.dark .drawer-divider { background: #2a3d2e; }
  </style>
  <link rel="stylesheet" href="/assets/css/desktop.css">
</head>
<body>

  <!-- Bandeau + sidebar partagés (injectés par site-nav.js) -->
  <div id="site-nav"></div>

  <header class="hero">
    <div class="hero-inner">
      <div class="avatar" id="heroAvatar">👤</div>
      <h1 id="heroTitle">Mon compte</h1>
      <p class="hero-sub" id="heroSub"></p>
      <div id="heroXp"></div>
      <div id="heroChip"></div>
    </div>
  </header>

  <div class="stats" id="statsRow"></div>

  <main class="profil-layout" id="profilLayout">
    <div class="col-main" id="colMain"></div>
    <aside class="col-side" id="colSide"></aside>
  </main>

  <div class="logout-wrap" id="logoutWrap"></div>

  <!-- Footer partagé (injecté par site-footer.js) -->
  <div id="site-footer"></div>

  <div class="bottom-leaf"></div>

  <!-- Fil de discussion d'un signalement -->
  <div class="tchat-voile" id="tchatVoile">
    <div class="tchat">
      <div class="tchat-tete">
        <span class="ticket-chip" id="tchatChip"></span>
        <div class="tchat-titre" id="tchatTitre"></div>
        <button type="button" class="tchat-fermer" id="tchatFermer" aria-label="Fermer">✕</button>
      </div>
      <div class="tchat-fil" id="tchatFil"></div>
      <div class="tchat-info" id="tchatInfo" style="display:none"></div>
      <div class="tchat-saisie" id="tchatSaisie">
        <textarea id="tchatTexte" rows="2" maxlength="3000" placeholder="Écrire un message…"></textarea>
        <button type="button" class="tchat-envoyer" id="tchatEnvoyer">Envoyer</button>
      </div>
      <div class="tchat-err" id="tchatErr" hidden></div>
      <div class="tchat-actions" id="tchatActions"></div>
    </div>
  </div>

  <script src="/assets/js/xp-chart.js"></script>
  <script>
    function esc(t) { const d = document.createElement('div'); d.textContent = (t == null ? '' : String(t)); return d.innerHTML; }

    // profile.php (db-core) ne connaît pas les jeux : on agrège les records jeux
    // depuis games-api (db-games), puis on complète badges + parties côté front.
    Promise.all([
      fetch('/api/auth/profile.php').then(r => r.json()).catch(() => ({})),
      fetch('/api/jeux/score.php?action=profile').then(r => r.json()).catch(() => ({ records: [], parties: 0 })),
    ]).then(([profile, jeux]) => {
      if (!profile.logged_in) { renderGuest(); return; }
      profile.records = jeux.records || [];
      profile.parties = jeux.parties || 0;
      // Badges jeux (db-games) injectés ici : Joueur + Touche-à-tout.
      const nbJeux = profile.records.filter(r => r.best !== null).length;
      const allJeux = profile.records.length > 0 && nbJeux >= profile.records.length;
      profile.badges.splice(2, 0,
        { emoji: '🎮', label: 'Joueur',        desc: 'Jouer à un mini-jeu',  unlocked: profile.parties >= 1 },
        { emoji: '🏆', label: 'Touche-à-tout', desc: 'Essayer tous les jeux', unlocked: allJeux });
      renderProfile(profile);
    });

    function ordinal(n) { return n === 1 ? '1er' : n + 'e'; }

    // parseSqlDate + buildXpChartHtml vivent dans xp-chart.js (chargé plus bas) :
    // partagés avec la fiche joueur de l'admin, qui doit voir EXACTEMENT la même
    // courbe que celle qu'un joueur voit sur son propre profil.
    function formatDate(s) {
      return XpChart.parseSqlDate(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    }
    // « membre depuis » : le jour n'apporte rien, le mois et l'année suffisent.
    function formatMoisAnnee(s) {
      return XpChart.parseSqlDate(s).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    }

    function renderProfile(u) {
      const xpInLevel = u.xp % 100;
      const pct = Math.min(100, Math.round(xpInLevel));
      const badgesOk = u.badges.filter(b => b.unlocked).length;

      // ── Hero ──
      document.getElementById('heroAvatar').textContent = u.username.charAt(0).toUpperCase();
      document.getElementById('heroTitle').textContent = 'Bonjour, ' + u.username + ' !';
      document.getElementById('heroSub').textContent = 'Niveau ' + u.niveau + ' · membre depuis ' + formatMoisAnnee(u.membre_depuis);
      document.getElementById('heroXp').innerHTML = `
        <div class="hero-xp">
          <div class="hero-xp-track"><div class="hero-xp-fill" style="width:${pct}%"></div></div>
          <div class="hero-xp-label">${xpInLevel} / 100 XP pour le niveau ${u.niveau + 1}</div>
        </div>`;
      document.getElementById('heroChip').innerHTML = u.isAdmin
        ? ''
        : `<a href="/classement" class="hero-chip">🏆 ${ordinal(u.rank)} au classement général</a>`;

      // ── Chiffres clés (le niveau est déjà porté par le hero, pas de doublon ici) ──
      document.getElementById('statsRow').innerHTML = `
        <div class="stat"><div class="stat-num">${u.xp}</div><div class="stat-label">XP total</div></div>
        <div class="stat"><div class="stat-num">${u.cours.done}</div><div class="stat-label">Cours terminés</div></div>
        <div class="stat"><div class="stat-num">${u.parties}</div><div class="stat-label">Parties jouées</div></div>
        <div class="stat"><div class="stat-num">${badgesOk}</div><div class="stat-label">Badges obtenus</div></div>`;

      // ── Colonne principale : progression + historique ──
      document.getElementById('colMain').innerHTML = `
        <section class="panel">
          <div class="panel-head">📈 Progression de l'XP</div>
          ${XpChart.buildXpChartHtml(u.xp_history || [], 'Pas encore assez de données pour tracer une courbe. Termine un cours ou joue à un mini-jeu !')}
        </section>
        <section class="panel">
          <div class="panel-head">📚 Cours terminés <span class="panel-count">${u.cours.done} / ${u.cours.total}</span></div>
          ${u.cours.liste.length
            ? `<div class="history-list">${u.cours.liste.map(c => `
                <a href="/cours/${esc(c.slug)}" class="history-row">
                  <span class="history-emoji">${c.emoji}</span>
                  <span class="history-title">${esc(c.titre)}</span>
                  <span class="history-date">${formatDate(c.completed_at)}</span>
                </a>`).join('')}</div>`
            : `<div class="course-empty">Aucun cours terminé pour l'instant. <a href="/cours">Commence ici !</a></div>`}
        </section>
        <section class="panel" id="ticketsPanel" hidden>
          <div class="panel-head">📨 Mes signalements <span class="panel-count" id="ticketsCount"></span></div>
          <div id="ticketsOuverts"></div>
          <button type="button" class="ticket-voir-clos" id="ticketsToggleClos" hidden></button>
          <div id="ticketsClos" hidden></div>
        </section>`;

      chargerTickets();

      // ── Colonne d'appoint : identité, badges, records ──
      // L'adresse email conditionne l'accès aux cours et la récupération du mot
      // de passe : elle doit être consultable, pas seulement dans le bandeau
      // d'avertissement qui disparaît une fois le compte vérifié.
      document.getElementById('colSide').innerHTML = `
        <section class="panel">
          <div class="panel-head">👤 Mon compte</div>
          <div class="info-list">
            <div class="info-row">
              <span class="info-key">Nom d'utilisateur</span>
              <span class="info-value">${esc(u.username)}</span>
            </div>
            <div class="info-row">
              <span class="info-key">Adresse email</span>
              <span class="info-value">${esc(u.email || '—')}</span>
            </div>
            <div class="info-row">
              <span class="info-key">Statut</span>
              <span class="info-value">
                ${u.email_verifie
                  ? `<span class="info-tag ok">✓ Adresse confirmée</span>`
                  : `<span class="info-tag pending">⏳ En attente de confirmation</span>`}
              </span>
            </div>
            <div class="info-row">
              <span class="info-key">Membre depuis</span>
              <span class="info-value">${formatMoisAnnee(u.membre_depuis)}</span>
            </div>
          </div>
          ${u.email_verifie ? '' : `
            <button class="info-btn" id="btnRenvoi">Renvoyer le lien de confirmation</button>
            <div class="info-msg" id="renvoiMsg" hidden></div>`}
          <a href="/mot-de-passe-oublie" class="info-link">Réinitialiser mon mot de passe</a>
        </section>
        <section class="panel">
          <div class="panel-head">🎖️ Badges <span class="panel-count">${badgesOk} / ${u.badges.length}</span></div>
          <div class="badge-grid">
            ${u.badges.map(b => `
              <div class="badge ${b.unlocked ? '' : 'locked'}" title="${esc(b.desc)}">
                <div class="badge-emoji">${b.emoji}</div>
                <div class="badge-label">${esc(b.label)}</div>
                <div class="badge-desc">${esc(b.desc)}</div>
              </div>`).join('')}
          </div>
        </section>
        <section class="panel">
          <div class="panel-head">🎮 Records de jeux</div>
          ${u.records.map(r => `
            <a href="/jeu-${r.slug}" class="game-row">
              <div class="game-row-emoji">${r.emoji}</div>
              <div class="game-row-info">
                <div class="game-row-name">${esc(r.nom)}</div>
                <div class="game-row-sub">${r.parties > 0 ? r.parties + ' partie' + (r.parties > 1 ? 's' : '') + ' jouée' + (r.parties > 1 ? 's' : '') : 'Pas encore joué'}</div>
              </div>
              ${r.best !== null
                ? `<div class="game-row-best">🏆 ${r.best} / ${r.max}</div>`
                : `<div class="game-row-best none">Jouer →</div>`}
            </a>`).join('')}
        </section>`;

      // Renvoi du lien de confirmation (bouton présent seulement si non vérifié).
      // Le serveur limite à 3 envois par heure et répond 429 au-delà.
      const btnRenvoi = document.getElementById('btnRenvoi');
      if (btnRenvoi) {
        btnRenvoi.addEventListener('click', () => {
          const m = document.getElementById('renvoiMsg');
          btnRenvoi.disabled = true;
          btnRenvoi.textContent = 'Envoi…';
          fetch('/api/auth/resend.php', { method: 'POST' })
            .then(r => r.json().catch(() => ({})))
            .then(d => {
              m.textContent = d.ok
                ? 'Lien envoyé, regarde ta boîte mail.'
                : (d.error || "L'envoi a échoué.");
              m.hidden = false;
              btnRenvoi.textContent = d.ok ? 'Lien envoyé ✓' : 'Réessayer';
              btnRenvoi.disabled = !!d.ok;
            })
            .catch(() => {
              m.textContent = 'Connexion au serveur impossible.';
              m.hidden = false;
              btnRenvoi.textContent = 'Réessayer';
              btnRenvoi.disabled = false;
            });
        });
      }

      // ── Déconnexion + suppression de compte ──
      const wrap = document.getElementById('logoutWrap');
      wrap.innerHTML = `
        <button class="btn-logout" id="btnLogout">Se déconnecter</button>
        <div class="danger-sep"></div>
        <button class="btn-danger-open" id="btnDangerOpen">Supprimer mon compte</button>
        <div class="danger-panel" id="dangerPanel" hidden>
          <div class="danger-title">Supprimer définitivement mon compte</div>
          <div class="danger-text">
            Ton compte, ton pseudo, ton adresse email et tes scores seront <b>effacés
            et irrécupérables</b>. Ton activité (XP gagnée, cours terminés, connexions)
            est conservée sous forme de <b>statistiques anonymes</b>, sans aucun lien
            avec toi. Tes signalements de composteurs restent traités, mais sans ton nom.
          </div>
          <label class="danger-label" for="dangerConfirm">Pour confirmer, saisis ton nom d'utilisateur : <b>${esc(u.username)}</b></label>
          <input class="danger-input" id="dangerConfirm" type="text" autocomplete="off" spellcheck="false" placeholder="Nom d'utilisateur">
          <div class="danger-actions">
            <button class="btn-danger-cancel" id="btnDangerCancel">Annuler</button>
            <button class="btn-danger-go" id="btnDangerGo" disabled>Supprimer</button>
          </div>
          <div class="danger-msg" id="dangerMsg" hidden></div>
        </div>`;

      document.getElementById('btnLogout').addEventListener('click', () => {
        fetch('/api/auth/logout.php', { method: 'POST' })
          .then(() => location.reload());
      });

      const panel   = document.getElementById('dangerPanel');
      const champ   = document.getElementById('dangerConfirm');
      const btnGo   = document.getElementById('btnDangerGo');
      const msg     = document.getElementById('dangerMsg');

      document.getElementById('btnDangerOpen').addEventListener('click', () => {
        panel.hidden = false;
        document.getElementById('btnDangerOpen').hidden = true;
        champ.focus();
      });
      document.getElementById('btnDangerCancel').addEventListener('click', () => {
        panel.hidden = true;
        document.getElementById('btnDangerOpen').hidden = false;
        champ.value = '';
        btnGo.disabled = true;
        msg.hidden = true;
      });

      // Le bouton ne s'active qu'une fois le pseudo saisi exactement : la
      // confirmation doit demander un geste conscient, pas un clic réflexe.
      champ.addEventListener('input', () => {
        btnGo.disabled = champ.value !== u.username;
      });

      btnGo.addEventListener('click', () => {
        btnGo.disabled = true;
        btnGo.textContent = 'Suppression…';
        msg.hidden = true;
        fetch('/api/auth/delete_account.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ confirmation: champ.value }),
        })
          .then(r => r.json().catch(() => ({ error: 'Réponse inattendue du serveur.' })))
          .then(d => {
            if (d.ok) {
              // Confirmation sur place (l'accueil n'a pas de zone de message),
              // puis retour à l'accueil déconnecté.
              panel.innerHTML = `
                <div class="danger-title">Compte supprimé</div>
                <div class="danger-text">Tes données personnelles ont été effacées. Merci d'avoir fait un bout de chemin avec Composmart 🌱</div>`;
              setTimeout(() => { location.href = '/'; }, 3000);
              return;
            }
            msg.textContent = d.error || 'La suppression a échoué.';
            msg.hidden = false;
            btnGo.textContent = 'Supprimer';
            btnGo.disabled = champ.value !== u.username;
          })
          .catch(() => {
            msg.textContent = 'Connexion au serveur impossible.';
            msg.hidden = false;
            btnGo.textContent = 'Supprimer';
            btnGo.disabled = false;
          });
      });
    }

    /* ══ MES SIGNALEMENTS ═══════════════════════════════════════════════════
       L'API (contact/tickets.php) ne renvoie QUE les tickets de la session en
       cours — la propriété est vérifiée côté serveur, jamais ici. Tout le rendu
       des contenus passe par textContent : rien de ce qu'un interlocuteur a
       écrit n'est interprété comme du HTML. */
    const CAT_TICKET = { bug: '🐛', suggestion: '💡', question: '❓', autre: '✉️' };
    const CHIP_TICKET = { ouvert: 'Ouvert', clos: 'Clos', clos_definitif: 'Fermé' };
    let tchatId = null, tchatTimer = null, tchatNb = -1;

    function formatActivite(s) {
      return String(s || '').slice(0, 16).replace('T', ' ');
    }

    function chargerTickets() {
      fetch('/api/contact/tickets.php')
        .then(r => r.json())
        .then(d => { if (d && Array.isArray(d.tickets)) renderTickets(d.tickets); })
        .catch(() => {});
    }

    function ligneTicket(t) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'ticket-row';
      const chip = document.createElement('span');
      chip.className = 'ticket-chip ' + t.statut;
      chip.textContent = CHIP_TICKET[t.statut] || t.statut;
      const sujet = document.createElement('span');
      sujet.className = 'ticket-sujet';
      sujet.textContent = (CAT_TICKET[t.categorie] || '✉️') + ' #' + t.id + ' · ' + t.sujet;
      row.append(chip, sujet);
      if (t.non_lu) {
        const badge = document.createElement('span');
        badge.className = 'ticket-reponse';
        badge.textContent = 'Réponse';
        row.appendChild(badge);
      }
      const date = document.createElement('span');
      date.className = 'ticket-date';
      date.textContent = formatDate(t.activite);
      row.appendChild(date);
      row.addEventListener('click', () => ouvrirTchat(t.id));
      return row;
    }

    function renderTickets(tickets) {
      const panel = document.getElementById('ticketsPanel');
      if (!panel) return;
      // Pas de panneau vide sur le profil : la section n'existe que si un
      // signalement a déjà été envoyé.
      if (!tickets.length) { panel.hidden = true; return; }
      panel.hidden = false;

      const ouverts = tickets.filter(t => t.statut === 'ouvert');
      const clos    = tickets.filter(t => t.statut !== 'ouvert');
      const nonLus  = tickets.filter(t => t.non_lu).length;
      document.getElementById('ticketsCount').textContent =
        nonLus > 0 ? nonLus + ' réponse' + (nonLus > 1 ? 's' : '') + ' non lue' + (nonLus > 1 ? 's' : '') : ouverts.length + ' ouvert' + (ouverts.length > 1 ? 's' : '');

      const boxO = document.getElementById('ticketsOuverts');
      boxO.innerHTML = '';
      if (ouverts.length) {
        ouverts.forEach(t => boxO.appendChild(ligneTicket(t)));
      } else {
        const vide = document.createElement('div');
        vide.className = 'course-empty';
        vide.textContent = 'Aucun signalement ouvert.';
        boxO.appendChild(vide);
      }

      const toggle = document.getElementById('ticketsToggleClos');
      const boxC = document.getElementById('ticketsClos');
      boxC.innerHTML = '';
      if (clos.length) {
        clos.forEach(t => boxC.appendChild(ligneTicket(t)));
        toggle.hidden = false;
        toggle.textContent = (boxC.hidden ? 'Voir' : 'Masquer') + ' les signalements clos (' + clos.length + ')';
        toggle.onclick = function () {
          boxC.hidden = !boxC.hidden;
          toggle.textContent = (boxC.hidden ? 'Voir' : 'Masquer') + ' les signalements clos (' + clos.length + ')';
        };
      } else {
        toggle.hidden = true;
        boxC.hidden = true;
      }
    }

    // ── Fil de discussion ──
    function ouvrirTchat(id) {
      tchatId = id;
      tchatNb = -1;
      document.getElementById('tchatFil').innerHTML = '';
      document.getElementById('tchatErr').hidden = true;
      document.getElementById('tchatVoile').classList.add('ouvert');
      chargerFil();
      // Poll léger tant que la boîte est ouverte : un admin peut répondre
      // pendant qu'on lit.
      clearInterval(tchatTimer);
      tchatTimer = setInterval(chargerFil, 8000);
    }

    function fermerTchat() {
      clearInterval(tchatTimer);
      tchatTimer = null;
      tchatId = null;
      document.getElementById('tchatVoile').classList.remove('ouvert');
      chargerTickets();   // la pastille « Réponse » vient de s'éteindre
    }

    function chargerFil() {
      if (!tchatId) return;
      fetch('/api/contact/tickets.php?id=' + tchatId)
        .then(r => r.json())
        .then(d => { if (d && d.ticket) renderFil(d); })
        .catch(() => {});
    }

    function renderFil(d) {
      const t = d.ticket;
      const chip = document.getElementById('tchatChip');
      chip.className = 'ticket-chip ' + t.statut;
      chip.textContent = CHIP_TICKET[t.statut] || t.statut;
      document.getElementById('tchatTitre').textContent = '#' + t.id + ' · ' + t.sujet;

      // Re-rendu seulement quand le nombre de messages change : le poll ne doit
      // pas casser une sélection de texte ou la position de lecture.
      const fil = document.getElementById('tchatFil');
      if (d.messages.length !== tchatNb) {
        tchatNb = d.messages.length;
        fil.innerHTML = '';
        d.messages.forEach(m => {
          const b = document.createElement('div');
          b.className = 'bulle ' + (m.est_admin ? 'admin' : 'moi');
          const meta = document.createElement('div');
          meta.className = 'bulle-meta';
          meta.textContent = (m.est_admin ? m.auteur + ' · ADMIN' : 'Moi')
            + ' · ' + formatActivite(m.created_at);
          const corps = document.createElement('div');
          corps.textContent = m.corps;
          b.append(meta, corps);
          fil.appendChild(b);
        });
        fil.scrollTop = fil.scrollHeight;
      }

      const ouvert = t.statut === 'ouvert';
      document.getElementById('tchatSaisie').style.display = ouvert ? 'flex' : 'none';
      const info = document.getElementById('tchatInfo');
      info.style.display = ouvert ? 'none' : 'block';
      info.textContent = t.statut === 'clos'
        ? 'Signalement clos — rouvre-le pour répondre.'
        : 'Signalement définitivement clos : il reste lisible, mais plus modifiable.';

      const act = document.getElementById('tchatActions');
      act.innerHTML = '';
      if (t.statut === 'ouvert' || t.statut === 'clos') {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tchat-btn';
        b.textContent = t.statut === 'ouvert' ? '✓ Marquer comme résolu' : '↺ Rouvrir ce signalement';
        b.addEventListener('click', () => actionTicket(t.statut === 'ouvert' ? 'clore' : 'rouvrir'));
        act.appendChild(b);
      }
    }

    function erreurTchat(msg) {
      const e = document.getElementById('tchatErr');
      e.textContent = msg;
      e.hidden = false;
    }

    function actionTicket(action) {
      fetch('/api/contact/tickets.php', {
        method: 'POST',
        body: new URLSearchParams({ action: action, id: tchatId })
      })
        .then(r => r.json())
        .then(d => {
          if (d.error) { erreurTchat(d.error); return; }
          document.getElementById('tchatErr').hidden = true;
          tchatNb = -1;
          chargerFil();
        })
        .catch(() => erreurTchat('Connexion au serveur impossible.'));
    }

    function envoyerTchat() {
      const zone = document.getElementById('tchatTexte');
      const corps = zone.value.trim();
      if (!corps || !tchatId) return;
      const btn = document.getElementById('tchatEnvoyer');
      btn.disabled = true;
      fetch('/api/contact/tickets.php', {
        method: 'POST',
        body: new URLSearchParams({ action: 'repondre', id: tchatId, corps: corps })
      })
        .then(r => r.json())
        .then(d => {
          btn.disabled = false;
          if (d.error) { erreurTchat(d.error); return; }
          document.getElementById('tchatErr').hidden = true;
          zone.value = '';
          tchatNb = -1;
          chargerFil();
        })
        .catch(() => { btn.disabled = false; erreurTchat('Connexion au serveur impossible.'); });
    }

    document.getElementById('tchatEnvoyer').addEventListener('click', envoyerTchat);
    document.getElementById('tchatTexte').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) envoyerTchat();
    });
    document.getElementById('tchatFermer').addEventListener('click', fermerTchat);
    document.getElementById('tchatVoile').addEventListener('click', function (e) {
      if (e.target === this) fermerTchat();
    });

    function renderGuest() {
      document.getElementById('heroAvatar').textContent = '🌱';
      document.getElementById('heroTitle').textContent = 'Mon compte';
      document.getElementById('heroSub').textContent = 'Rejoins la communauté Composmart';

      // Pas de chiffres ni de colonnes pour un visiteur : une seule carte d'accueil.
      document.getElementById('statsRow').style.display = 'none';
      document.getElementById('profilLayout').classList.add('guest');
      document.getElementById('colSide').style.display = 'none';
      document.getElementById('colMain').innerHTML = `
        <section class="panel">
          <div class="guest-title">Bienvenue !</div>
          <div class="guest-sub">Connecte-toi pour suivre ta progression, gagner de l'XP et débloquer des badges.</div>
          <a href="/signin" class="btn btn-primary">Créer un compte</a>
          <a href="/login" class="btn btn-secondary">Se connecter</a>
        </section>`;
    }
  </script>
