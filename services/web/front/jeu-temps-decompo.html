<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
  <link rel="stylesheet" href="/assets/css/dark.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <title>CompoSmart – Combien de temps ?</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #eef4ec; font-family: 'Nunito', Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 70px; }

    nav { width: 100%; background: #1e6e3e; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; z-index: 100; }
    .nav-logo { font-family: 'Baloo 2', cursive; font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; font-style: italic; text-decoration: none; }
    .nav-logo span { color: #a8e6bf; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-profil { color: rgba(255,255,255,0.85); font-size: 1.3rem; text-decoration: none; line-height: 1; }

    .hero { text-align: center; padding: 24px 20px 10px; }
    .hero-badge { display: inline-block; background: #a8e6bf; color: #1a3a25; font-size: 0.82rem; font-weight: 800; padding: 5px 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    h1 { font-family: 'Baloo 2', cursive; font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 900; color: #1a3a25; }

    .page-content { width: 100%; max-width: 520px; padding: 0 16px; }
    .game-status {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.82rem; font-weight: 800; color: #4a7a5a; padding: 10px 4px;
    }
    .game-card {
      background: #fff; border-radius: 18px; padding: 26px 18px;
      box-shadow: 0 2px 12px rgba(30,110,62,0.1); text-align: center;
    }
    .item-emoji { font-size: 4rem; margin: 6px 0 4px; }
    .item-question { font-family: 'Baloo 2', cursive; font-size: 1.1rem; font-weight: 900; color: #1a3a25; min-height: 52px; line-height: 1.35; padding: 0 4px; }

    /* ── Curseur sur échelle logarithmique ── */
    .slider-zone { margin: 26px 0 6px; }
    .bubble {
      display: inline-block; position: relative; left: 0;
      background: #1e6e3e; color: #fff; font-family: 'Baloo 2', cursive;
      font-size: 0.95rem; font-weight: 900; padding: 6px 14px; border-radius: 14px;
      transform: translateX(-50%); white-space: nowrap; margin-bottom: 10px;
      transition: background 0.2s;
    }
    .bubble::after {
      content: ''; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
      border: 6px solid transparent; border-top-color: #1e6e3e; border-bottom: none;
    }
    .bubble-wrap { text-align: left; height: 44px; }
    .track-wrap { position: relative; padding: 6px 0 2px; }
    input[type=range] {
      -webkit-appearance: none; appearance: none; width: 100%;
      height: 8px; border-radius: 4px; background: #c8e6c9; outline: none; display: block;
      cursor: pointer;
    }
    /* Pion large : facile à attraper au doigt comme à la souris */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 46px; height: 46px; border-radius: 50%;
      background: #1e6e3e; border: 5px solid #fff;
      box-shadow: 0 3px 10px rgba(30,110,62,0.45); cursor: grab;
    }
    input[type=range]:active::-webkit-slider-thumb { cursor: grabbing; }
    input[type=range]::-moz-range-thumb {
      width: 46px; height: 46px; border-radius: 50%;
      background: #1e6e3e; border: 5px solid #fff;
      box-shadow: 0 3px 10px rgba(30,110,62,0.45); cursor: grab;
    }
    input[type=range]:disabled::-webkit-slider-thumb { background: #9bb8a5; cursor: default; }
    input[type=range]:disabled::-moz-range-thumb { background: #9bb8a5; cursor: default; }

    /* Marqueur de la vraie réponse (affiché après validation) */
    .true-marker {
      position: absolute; top: -14px; transform: translateX(-50%);
      font-size: 1.5rem; line-height: 1; display: none; pointer-events: none;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
    }
    .true-marker.show { display: block; animation: dropIn 0.45s cubic-bezier(.2,1.4,.4,1); }
    @keyframes dropIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-14px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .ticks { position: relative; height: 34px; margin-top: 8px; }
    .tick {
      position: absolute; transform: translateX(-50%); text-align: center;
      font-size: 0.68rem; font-weight: 800; color: #4a7a5a; white-space: nowrap;
    }
    .tick::before { content: ''; display: block; width: 2px; height: 8px; background: #9bb8a5; margin: 0 auto 3px; border-radius: 1px; }

    .btn-valider {
      border: none; border-radius: 16px; padding: 14px 34px; margin-top: 16px;
      font-family: 'Baloo 2', cursive; font-size: 1rem; font-weight: 900; cursor: pointer;
      background: #1e6e3e; color: #fff; box-shadow: 0 3px 0 #14502c; transition: transform 0.12s;
    }
    .btn-valider:hover:not(:disabled) { transform: translateY(-2px); }
    .btn-valider:disabled { opacity: 0.45; cursor: default; transform: none; }

    .feedback {
      margin-top: 16px; border-radius: 14px; padding: 12px 14px;
      font-size: 0.84rem; font-weight: 700; line-height: 1.45;
      display: none; text-align: left;
    }
    .feedback.ok { display: block; background: #e8f5e9; color: #1e6e3e; border-left: 4px solid #1e6e3e; }
    .feedback.mid { display: block; background: #fff8e1; color: #b26a00; border-left: 4px solid #f9a825; }
    .feedback.ko { display: block; background: #ffebee; color: #c0392b; border-left: 4px solid #e53935; }
    .btn-continuer {
      border: none; border-radius: 16px; padding: 12px 28px; margin-top: 14px; display: none;
      font-family: 'Baloo 2', cursive; font-size: 0.95rem; font-weight: 900; cursor: pointer;
      background: #1e6e3e; color: #fff; box-shadow: 0 3px 0 #14502c;
    }

    /* Écran de fin */
    .end-screen { display: none; text-align: center; }
    .end-emoji { font-size: 3.2rem; margin: 8px 0; }
    .end-score { font-family: 'Baloo 2', cursive; font-size: 2rem; font-weight: 900; color: #1e6e3e; }
    .end-msg { font-size: 0.9rem; color: #4a7a5a; font-weight: 700; margin: 6px 0 14px; }
    .end-record { display: inline-block; background: #fff9c4; color: #b26a00; font-size: 0.78rem; font-weight: 800; padding: 5px 14px; border-radius: 14px; margin-bottom: 12px; }
    .end-xp { display: inline-block; background: #e8f5e9; color: #1e6e3e; font-size: 0.78rem; font-weight: 800; padding: 5px 14px; border-radius: 14px; margin-bottom: 12px; margin-left: 6px; }
    .leaderboard { text-align: left; margin: 14px auto 0; max-width: 300px; }
    .lb-title { font-family: 'Baloo 2', cursive; font-size: 0.9rem; font-weight: 900; color: #1a3a25; margin-bottom: 8px; text-align: center; }
    .lb-row { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 700; color: #1a3a25; padding: 5px 10px; border-radius: 8px; }
    .lb-row:nth-child(even) { background: #f6faf6; }
    .end-actions { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .end-actions a, .end-actions button {
      border: none; border-radius: 20px; padding: 10px 20px; text-decoration: none;
      font-family: 'Baloo 2', cursive; font-size: 0.88rem; font-weight: 900; cursor: pointer;
    }
    .btn-rejouer { background: #1e6e3e; color: #fff; }
    .btn-retour { background: #eef4ec; color: #1e6e3e; }
    .save-info { background: #eef4ec; border-radius: 16px; padding: 16px; margin-top: 14px; text-align: center; }
    .save-info-text { font-size: 0.84rem; color: #4a7a5a; font-weight: 700; margin-bottom: 12px; }
    .save-info-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .save-info-btn-login { display: inline-block; background: linear-gradient(135deg,#1e6e3e,#2d9959); color: #fff; font-family: 'Baloo 2', cursive; font-weight: 900; font-size: 0.85rem; padding: 9px 18px; border-radius: 12px; text-decoration: none; box-shadow: 0 2px 8px rgba(30,110,62,0.3); }
    .save-info-btn-register { display: inline-block; background: #fff; color: #1e6e3e; border: 2px solid #a8e6bf; font-family: 'Baloo 2', cursive; font-weight: 900; font-size: 0.85rem; padding: 8px 16px; border-radius: 12px; text-decoration: none; }

    html.dark .save-info { background: #1e2d22; }
    html.dark .save-info-btn-register { background: #1e2d22; color: #52b788; border-color: #2d4030; }
    html.dark .game-card { background: #16211a; }
    html.dark .item-question { color: #e8f5ee; }
    html.dark h1 { color: #e8f5ee; }
    html.dark input[type=range] { background: #2d4030; }
    html.dark .tick { color: #7fc99a; }
    html.dark .feedback.ok { background: #16291c; color: #7fc99a; }
    html.dark .feedback.mid { background: #2e2410; color: #e8b931; }
    html.dark .feedback.ko { background: #3d1a1a; color: #ef9a9a; }
    html.dark .btn-retour { background: #1e2d22; color: #7fc99a; }
    html.dark .lb-row { color: #e8f5ee; }
    html.dark .lb-row:nth-child(even) { background: #1e2d22; }
    html.dark .lb-title { color: #e8f5ee; }
    html.dark .end-record { background: #2e2410; color: #e8b931; }
    html.dark .end-xp { background: #16291c; color: #7fc99a; }

    .bottom-leaf { position: fixed; bottom: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #1e6e3e, #52b788, #a7c957, #52b788, #1e6e3e); }
  </style>

<body>

  <nav>
    <a href="index.html" class="nav-logo">Compos<span>mart</span></a>
    <div class="nav-right"><a href="compte" class="nav-profil">&#128100;</a><button id="themeToggle" aria-label="Thème">🌙</button><a href="/jeux" style="color:#fff;font-size:0.82rem;font-weight:800;text-decoration:none">✕ Quitter</a></div>
  </nav>

  <div class="hero">
    <div class="hero-badge">⏳ Combien de temps ?</div>
    <h1>La nature prend son temps</h1>
  </div>

  <div class="page-content">
    <div class="game-status">
      <span id="statusItem">Déchet 1/10</span>
      <span id="statusScore">Score : 0</span>
    </div>

    <div class="game-card">
      <div id="gameZone">
        <div class="item-emoji" id="itemEmoji"></div>
        <div class="item-question" id="itemQuestion"></div>

        <div class="slider-zone">
          <div class="bubble-wrap"><span class="bubble" id="bubble">~1 mois</span></div>
          <div class="track-wrap">
            <span class="true-marker" id="trueMarker">📍</span>
            <input type="range" id="slider" min="0" max="1000" value="500" aria-label="Estimation de la durée de décomposition">
          </div>
          <div class="ticks" id="ticks"></div>
        </div>

        <button type="button" class="btn-valider" id="btnValider">Valider ✓</button>
        <div class="feedback" id="feedback"></div>
        <button type="button" class="btn-continuer" id="btnContinuer">Continuer ➜</button>
      </div>

      <div class="end-screen" id="endScreen">
        <div class="end-emoji" id="endEmoji">🏆</div>
        <div class="end-score" id="endScore"></div>
        <div class="end-msg" id="endMsg"></div>
        <div class="end-record" id="endRecord" style="display:none">🎉 Nouveau record perso !</div>
        <div class="end-xp" id="endXp" style="display:none"></div>
        <div class="leaderboard" id="leaderboard" style="display:none">
          <div class="lb-title">🏅 Top 5</div>
          <div id="lbRows"></div>
        </div>
        <div class="save-info" id="saveInfo" style="display:none">
          <div class="save-info-text">Connecte-toi pour sauvegarder ton score et apparaître dans le classement !</div>
          <div class="save-info-actions">
            <a href="/login" class="save-info-btn-login">Se connecter</a>
            <a href="/signin" class="save-info-btn-register">Créer un compte</a>
          </div>
        </div>
        <div class="end-actions">
          <button type="button" class="btn-rejouer" id="btnRejouer">🔄 Rejouer</button>
          <a href="/jeux" class="btn-retour">🎮 Autres jeux</a>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-leaf"></div>

  <script src="/assets/js/jeu-base.js"></script>
  <script>
    const JEU_ID = 'temps-decompo';
    // Contenu (déchets et durées) et règles (déchets courts/longs par partie,
    // paliers de précision) : édités dans /jeux-admin, reçus par JeuBase.lancer.
    // Un déchet est « court » s'il met 1 an ou moins : même seuil que
    // games-api/jeux/_jeux.php (JEUX_TEMPS_SEUIL_COURT), qui vérifie qu'il y en
    // a assez de chaque sorte pour une partie.
    const SEUIL_COURT = 365;
    let JEU = null, NB_ITEMS = 0, SEUILS = [];

    // Échelle logarithmique : 1 jour → 1000 ans. p ∈ [0,1] ↔ log10(jours).
    const JOURS_MAX = 365000;
    const LOG_MAX = Math.log10(JOURS_MAX);
    function pVersJours(p) { return Math.pow(10, p * LOG_MAX); }
    function joursVersP(j) { return Math.log10(Math.max(1, j)) / LOG_MAX; }

    // Libellés des trois paliers de précision, du plus précis au plus large.
    // Tolérance (en fraction de la largeur de la ligne, échelle log, donc en
    // ordres de grandeur) et points de chaque palier : règles du jeu.
    const LIBELLES_SEUILS = ['🎯 En plein dans le mille !', '👍 Très proche !', '🤏 Pas loin...'];

    const TICKS = [
      { label: '1 jour',    jours: 1 },
      { label: '1 mois',    jours: 30 },
      { label: '1 an',      jours: 365 },
      { label: '10 ans',    jours: 3650 },
      { label: '100 ans',   jours: 36500 },
      { label: '1000 ans',  jours: 365000 }
    ];

    const THUMB_W = 46; // doit suivre la largeur CSS du pion

    let items = [], round = 0, score = 0, verrou = false;

    const slider = document.getElementById('slider');
    const bubble = document.getElementById('bubble');
    const trueMarker = document.getElementById('trueMarker');

    function fmtDuree(j) {
      if (j < 14)   { const n = Math.round(j);       return n + (n > 1 ? ' jours' : ' jour'); }
      if (j < 60)   { const n = Math.round(j / 7);   return n + ' semaine' + (n > 1 ? 's' : ''); }
      if (j < 350)  { const n = Math.round(j / 30);  return n + ' mois'; }
      const n = Math.round(j / 365);
      return n + ' an' + (n > 1 ? 's' : '');
    }

    // Position horizontale (px) du centre du pion pour une fraction p de l'échelle
    // (le pion ne dépasse pas de la piste : sa course fait largeur - THUMB_W).
    function pVersPx(p) {
      return THUMB_W / 2 + p * (slider.offsetWidth - THUMB_W);
    }

    function placerTicks() {
      const ticks = document.getElementById('ticks');
      ticks.innerHTML = '';
      TICKS.forEach(t => {
        const el = document.createElement('span');
        el.className = 'tick';
        el.textContent = t.label;
        el.style.left = pVersPx(joursVersP(t.jours)) + 'px';
        ticks.appendChild(el);
      });
    }

    function majBulle() {
      const p = slider.value / 1000;
      bubble.textContent = '~' + fmtDuree(pVersJours(p));
      bubble.style.left = pVersPx(p) + 'px';
    }

    function demarrer() {
      const courts = JEU.items.filter(i => i.jours <= SEUIL_COURT);
      const longs  = JEU.items.filter(i => i.jours > SEUIL_COURT);
      items = JeuBase.melanger(JeuBase.melanger(courts).slice(0, JEU.regles.nb_courts)
        .concat(JeuBase.melanger(longs).slice(0, JEU.regles.nb_longs)));
      round = 0; score = 0; verrou = false;
      document.getElementById('endScreen').style.display = 'none';
      document.getElementById('gameZone').style.display = 'block';
      afficherRound();
    }

    function afficherRound() {
      verrou = false;
      const it = items[round];
      document.getElementById('statusItem').textContent = 'Déchet ' + (round + 1) + '/' + NB_ITEMS;
      document.getElementById('statusScore').textContent = 'Score : ' + score;
      document.getElementById('itemEmoji').textContent = it.emoji;
      document.getElementById('itemQuestion').textContent = 'Combien de temps met ' + it.nom + ' à se décomposer ?';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('btnValider').style.display = 'inline-block';
      document.getElementById('btnValider').disabled = false;
      document.getElementById('btnContinuer').style.display = 'none';
      trueMarker.classList.remove('show');
      slider.disabled = false;
      slider.value = 500;
      majBulle();
    }

    function valider() {
      if (verrou) return;
      verrou = true;
      slider.disabled = true;
      document.getElementById('btnValider').style.display = 'none';

      const it = items[round];
      const pJoueur = slider.value / 1000;
      const pVrai = joursVersP(it.jours);
      const ecart = Math.abs(pJoueur - pVrai);

      let pts = 0, label = '❌ Raté !', rang = -1;
      for (let i = 0; i < SEUILS.length; i++) {
        if (ecart <= SEUILS[i].d) { pts = SEUILS[i].pts; label = LIBELLES_SEUILS[i]; rang = i; break; }
      }
      score += pts;
      document.getElementById('statusScore').textContent = 'Score : ' + score;

      // La vraie réponse apparaît sur la ligne
      trueMarker.style.left = pVersPx(pVrai) + 'px';
      trueMarker.classList.add('show');

      // L'explication est saisie dans l'admin : posée en texte, jamais en HTML.
      const fb = document.getElementById('feedback');
      fb.className = 'feedback ' + (rang === 0 ? 'ok' : (pts >= 1 ? 'mid' : 'ko'));
      const titre = document.createElement('strong');
      titre.textContent = label + ' +' + pts + ' pt' + (pts > 1 ? 's' : '');
      const duree = document.createElement('strong');
      duree.textContent = fmtDuree(it.jours);
      fb.textContent = '';
      fb.append(titre, document.createElement('br'), 'Réponse : ', duree, '. ' + it.info);

      document.getElementById('btnContinuer').style.display = 'inline-block';
    }

    function continuer() {
      round++;
      if (round >= NB_ITEMS) finJeu();
      else afficherRound();
    }

    slider.addEventListener('input', majBulle);
    document.getElementById('btnValider').addEventListener('click', valider);
    document.getElementById('btnContinuer').addEventListener('click', continuer);
    window.addEventListener('resize', () => {
      placerTicks(); majBulle();
      if (trueMarker.classList.contains('show') && items[round]) {
        trueMarker.style.left = pVersPx(joursVersP(items[round].jours)) + 'px';
      }
    });

    function finJeu() {
      JeuBase.afficherFin(JEU, score);
      JeuBase.sauvegarder(JEU_ID, score);
    }

    document.getElementById('btnRejouer').addEventListener('click', () => {
      JeuBase.reinitialiserFin();
      demarrer();
    });

    JeuBase.lancer(JEU_ID, function (jeu) {
      JEU = jeu;
      SEUILS = jeu.regles.seuils;
      NB_ITEMS = jeu.regles.nb_courts + jeu.regles.nb_longs;
      demarrer();      // rend la zone visible : la largeur du curseur est alors connue
      placerTicks();
    });
  </script>
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/admin-badge.js?v=3"></script>
</body>
</html>
