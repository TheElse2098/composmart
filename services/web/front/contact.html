<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
  <link rel="stylesheet" href="/assets/css/dark.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;900&family=Nunito:wght@400;600;700;900&display=swap">
  <title>CompoSmart – Nous contacter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #eef4ec; font-family: 'Nunito', Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

    nav { width: 100%; background: #1e6e3e; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; z-index: 100; }
    .nav-logo { font-family: 'Baloo 2', cursive; font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; font-style: italic; text-decoration: none; }
    .nav-logo span { color: #a8e6bf; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-profil { color: rgba(255,255,255,0.85); font-size: 1.3rem; text-decoration: none; line-height: 1; }
    .nav-profil:hover { color: #fff; }
    .burger { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 4px; }
    .burger span { display: block; width: 26px; height: 3px; background: #fff; border-radius: 2px; transition: all 0.3s ease; }
    .burger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; }
    .burger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
    .drawer { position: fixed; top: 0; right: -320px; width: 280px; max-width: 85vw; height: 100vh; background: #fff; z-index: 200; transition: right 0.32s cubic-bezier(.4,0,.2,1); box-shadow: -4px 0 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; }
    .drawer.open { right: 0; }
    .drawer-header { background: #1e6e3e; padding: 20px 20px 18px; display: flex; align-items: center; justify-content: space-between; }
    .drawer-logo { font-family: 'Baloo 2', cursive; font-size: 1.2rem; font-weight: 900; color: #fff; letter-spacing: 2px; font-style: italic; }
    .drawer-logo span { color: #a8e6bf; }
    .drawer-close { background: none; border: none; cursor: pointer; color: #fff; font-size: 1.6rem; line-height: 1; padding: 2px 6px; }
    .drawer-menu { list-style: none; padding: 8px 0; flex: 1; overflow-y: auto; }
    .drawer-menu li a { display: flex; align-items: center; gap: 14px; padding: 15px 24px; font-size: 1rem; font-weight: 700; color: #1a3a25; text-decoration: none; transition: background 0.15s; border-left: 3px solid transparent; }
    .drawer-menu li a:hover, .drawer-menu li a.active { background: #eef4ec; border-left-color: #1e6e3e; color: #1e6e3e; }
    .menu-icon { font-size: 1.2rem; width: 24px; text-align: center; }
    .drawer-divider { height: 1px; background: #e5ede8; margin: 4px 24px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .overlay.open { opacity: 1; pointer-events: all; }

    .hero { text-align: center; padding: 28px 20px 8px; }
    .hero-badge { display: inline-block; background: #a8e6bf; color: #1a3a25; font-size: 0.82rem; font-weight: 800; padding: 5px 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    h1 { font-family: 'Baloo 2', cursive; font-size: clamp(1.5rem, 5vw, 2.4rem); font-weight: 900; color: #1a3a25; }
    .hero-sub { font-size: 0.95rem; color: #4a7a5a; margin-top: 6px; font-weight: 600; }

    .contact-card { background: #fff; border-radius: 20px; box-shadow: 0 4px 24px rgba(30,110,62,0.10); width: 100%; max-width: 560px; margin: 16px; padding: 28px 24px 30px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.78rem; font-weight: 800; color: #2c4a34; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .field input, .field select, .field textarea { display: block; width: 100%; padding: 11px 14px; border: 1.5px solid #c8dfc8; border-radius: 10px; font-size: 0.95rem; color: #1a3a25; background: #f7fbf8; outline: none; font-family: inherit; transition: border-color 0.15s; }
    .field textarea { min-height: 130px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #1e6e3e; background: #fff; }

    .msg { border-radius: 10px; padding: 11px 14px; font-size: 0.88rem; font-weight: 700; margin-bottom: 16px; display: none; }
    .msg.error { background: #fdecea; color: #c0392b; }
    .msg.ok { background: #e8f5e9; color: #1e6e3e; }

    .btn-submit { display: block; width: 100%; background: #1e6e3e; color: #fff; border: none; border-radius: 50px; padding: 13px; font-size: 1rem; font-weight: 800; cursor: pointer; transition: opacity 0.15s; margin-top: 4px; font-family: 'Baloo 2', cursive; }
    .btn-submit:hover { opacity: 0.88; }
    .btn-submit:disabled { opacity: 0.5; cursor: default; }

    /* Écran "connecte-toi" (non connecté) */
    .guard { text-align: center; padding: 10px 4px; }
    .guard-emoji { font-size: 2.6rem; }
    .guard-text { font-size: 0.95rem; color: #4a7a5a; font-weight: 700; margin: 10px 0 18px; line-height: 1.4; }
    .guard-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .guard-btns a { background: #1e6e3e; color: #fff; text-decoration: none; padding: 11px 22px; border-radius: 50px; font-weight: 800; font-family: 'Baloo 2', cursive; }
    .guard-btns a.secondary { background: #e3efe6; color: #1e6e3e; }

    .bottom-leaf { position: fixed; bottom: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #1e6e3e, #52b788, #a7c957, #52b788, #1e6e3e); }

    html.dark .contact-card { background: #1a2b1e; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
    html.dark .field label { color: #7ab88e; }
    html.dark .field input, html.dark .field select, html.dark .field textarea { background: #1e2d22; border-color: #2d4030; color: #e8f5ee; }
    html.dark .field input:focus, html.dark .field select:focus, html.dark .field textarea:focus { border-color: #52b788; background: #243328; }
    html.dark .guard-btns a.secondary { background: #24352a; color: #7ab88e; }
  </style>
  <link rel="stylesheet" href="/assets/css/desktop.css">
</head>
<body>

    <!-- Bandeau + sidebar partagés (injectés par site-nav.js) -->
  <div id="site-nav"></div>

  <div class="hero">
    <div class="hero-badge">✉️ Contact</div>
    <h1>Nous contacter</h1>
    <p class="hero-sub">Une question, un bug, une idée ? Écris-nous !</p>
  </div>

  <div class="contact-card" id="card">
    <!-- rempli par JS selon l'état de connexion -->
    <div class="guard"><div class="guard-emoji">⏳</div><div class="guard-text">Chargement…</div></div>
  </div>

    <!-- Footer partagé (injecté par site-footer.js) -->
  <div id="site-footer"></div>

  <div class="bottom-leaf"></div>

  <script>
    // Drawer
    const card = document.getElementById('card');

    function renderGuard() {
      card.innerHTML =
        '<div class="guard">' +
          '<div class="guard-emoji">🔒</div>' +
          '<div class="guard-text">Tu dois être connecté pour nous envoyer un message.</div>' +
          '<div class="guard-btns">' +
            '<a href="/login">Se connecter</a>' +
            '<a href="/signin" class="secondary">Créer un compte</a>' +
          '</div>' +
        '</div>';
    }

    function renderForm() {
      card.innerHTML =
        '<div class="msg" id="msg"></div>' +
        '<form id="contactForm">' +
          '<div class="field"><label>Catégorie</label>' +
            '<select name="categorie" id="categorie">' +
              '<option value="question">Question</option>' +
              '<option value="bug">Signaler un bug</option>' +
              '<option value="suggestion">Suggestion</option>' +
              '<option value="autre">Autre</option>' +
            '</select></div>' +
          '<div class="field"><label>Sujet</label>' +
            '<input type="text" id="sujet" maxlength="150" placeholder="Résume ta demande en quelques mots" required></div>' +
          '<div class="field"><label>Message</label>' +
            '<textarea id="message" maxlength="3000" placeholder="Décris ta demande…" required></textarea></div>' +
          '<button type="submit" class="btn-submit" id="btnSend">Envoyer</button>' +
        '</form>';

      const form = document.getElementById('contactForm');
      const msg  = document.getElementById('msg');
      const btn  = document.getElementById('btnSend');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        msg.style.display = 'none';
        const body = new URLSearchParams({
          categorie: document.getElementById('categorie').value,
          sujet:     document.getElementById('sujet').value.trim(),
          message:   document.getElementById('message').value.trim(),
        });
        btn.disabled = true; btn.textContent = 'Envoi…';
        fetch('/api/contact/send.php', { method: 'POST', body })
          .then(r => r.json())
          .then(d => {
            if (d.ok) {
              msg.className = 'msg ok'; msg.textContent = '✅ Message envoyé, merci ! Tu peux suivre la réponse depuis ta page de compte, rubrique « Mes signalements ».';
              msg.style.display = 'block';
              form.reset();
            } else {
              msg.className = 'msg error'; msg.textContent = d.error || 'Erreur inconnue.';
              msg.style.display = 'block';
            }
          })
          .catch(() => { msg.className = 'msg error'; msg.textContent = 'Erreur réseau, réessaie.'; msg.style.display = 'block'; })
          .finally(() => { btn.disabled = false; btn.textContent = 'Envoyer'; });
      });
    }

    // Détermine l'état de connexion puis affiche le bon écran
    fetch('/api/auth/me.php').then(r => r.json()).catch(() => ({}))
      .then(me => { (me && me.logged_in) ? renderForm() : renderGuard(); });
  </script>
  <script src="/assets/js/site-footer.js"></script>
  <script src="/assets/js/site-nav.js"></script>
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/admin-badge.js?v=2"></script>
</body>
</html>
