<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
  <link rel="stylesheet" href="/assets/css/dark.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>CompoSmart – Launchpad</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #eef4ec; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }

    .auth-card { background: #fff; border-radius: 24px; box-shadow: 0 4px 32px rgba(30,110,62,0.12); width: 100%; max-width: 400px; overflow: hidden; }
    .auth-header { background: linear-gradient(160deg, #1a1a4a 0%, #2d2d7a 60%, #3a3a9a 100%); padding: 28px 24px 24px; text-align: center; }
    .auth-logo { font-size: 1.3rem; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; font-style: italic; text-decoration: none; display: block; margin-bottom: 10px; }
    .auth-logo span { color: #a8e6bf; }
    .setup-badge { display: inline-block; background: rgba(255,255,255,0.15); color: #e8d5ff; font-size: 0.72rem; font-weight: 800; padding: 4px 12px; border-radius: 20px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
    .auth-title { font-size: 1.2rem; font-weight: 800; color: #fff; }
    .auth-subtitle { font-size: 0.8rem; color: rgba(255,255,255,0.65); margin-top: 5px; }
    .auth-body { padding: 28px 24px 32px; }

    .warn-box { background: #fff8e1; border-left: 4px solid #f9a825; border-radius: 10px; padding: 11px 14px; font-size: 0.8rem; font-weight: 600; color: #6d4c00; margin-bottom: 20px; line-height: 1.45; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.78rem; font-weight: 700; color: #2c4a34; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .field input { display: block; width: 100%; padding: 11px 14px; border: 1.5px solid #c8dfc8; border-radius: 10px; font-size: 0.95rem; color: #1a3a25; background: #f7fbf8; outline: none; transition: border-color 0.15s; }
    .field input:focus { border-color: #3a3a9a; background: #fff; }

    .pass-wrap { position: relative; }
    .pass-wrap input { padding-right: 44px; }
    .toggle-pass { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1rem; color: #7aaa8a; }

    .error-msg { background: #fdecea; color: #c0392b; border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; font-weight: 600; margin-bottom: 16px; display: none; }
    .btn-submit { display: block; width: 100%; background: linear-gradient(135deg, #2d2d7a, #3a3a9a); color: #fff; border: none; border-radius: 50px; padding: 13px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s; margin-top: 8px; }
    .btn-submit:hover { opacity: 0.88; }
    .btn-submit:disabled { opacity: 0.5; cursor: default; }

    /* État de chargement */
    .loading-state { text-align: center; padding: 48px 24px; }
    .loading-spinner { font-size: 2.5rem; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 14px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.9rem; color: #4a7a5a; font-weight: 600; }

    /* État admin déjà là */
    .already-state { text-align: center; padding: 48px 24px; }
    .already-icon { font-size: 3rem; margin-bottom: 14px; display: block; }
    .already-title { font-size: 1.1rem; font-weight: 800; color: #1a3a25; margin-bottom: 8px; }
    .already-sub { font-size: 0.85rem; color: #4a7a5a; font-weight: 600; }

    html.dark body { background: #121c14; }
    html.dark .auth-card { background: #1a2b1e; box-shadow: 0 4px 32px rgba(0,0,0,0.4); }
    html.dark .field label { color: #7ab88e; }
    html.dark .field input { background: #1e2d22; border-color: #2d4030; color: #e8f5ee; }
    html.dark .field input:focus { border-color: #6060c0; background: #243328; }
    html.dark .warn-box { background: #2a1f00; border-left-color: #f9a825; color: #f0c060; }
    html.dark .loading-text { color: #4a7a5a; }
    html.dark .already-title { color: #c8e6d4; }
    html.dark .already-sub { color: #4a7a5a; }
  </style>
  <link rel="stylesheet" href="/assets/css/desktop.css">
</head>
<body>

  <div class="auth-card" id="card">
    <!-- Chargement initial -->
    <div class="loading-state" id="stateLoading">
      <div class="loading-spinner">🚀</div>
      <div class="loading-text">Vérification en cours…</div>
    </div>
  </div>

  <script>
    fetch('/api/auth/launchpad.php')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.has_admin) {
          showAlreadyDone();
        } else {
          showSetupForm();
        }
      })
      .catch(function() {
        showSetupForm(); // En cas d'erreur réseau, afficher le form quand même
      });

    function showAlreadyDone() {
      document.getElementById('card').innerHTML =
        '<div class="auth-header" style="background:linear-gradient(160deg,#1a1a4a,#2d2d7a,#3a3a9a)">' +
          '<a href="/" class="auth-logo">Compos<span>mart</span></a>' +
        '</div>' +
        '<div class="already-state">' +
          '<span class="already-icon">🔐</span>' +
          '<div class="already-title">Admin déjà configuré</div>' +
          '<div class="already-sub">Redirection vers votre compte…</div>' +
        '</div>';
      setTimeout(function() { window.location.href = '/compte'; }, 1800);
    }

    function showSetupForm() {
      document.getElementById('card').innerHTML =
        '<div class="auth-header">' +
          '<a href="/" class="auth-logo">Compos<span>mart</span></a>' +
          '<div class="setup-badge">🛠️ Configuration initiale</div>' +
          '<div class="auth-title">Créer le compte admin</div>' +
          '<div class="auth-subtitle">Ce compte aura tous les droits.</div>' +
        '</div>' +
        '<div class="auth-body">' +
          '<div class="warn-box">⚠️ Aucun administrateur n\'est enregistré. Ce formulaire ne s\'affiche qu\'une seule fois — une fois un admin créé, cette page redirige vers /compte.</div>' +
          '<div class="error-msg" id="errorMsg"></div>' +
          '<form id="setupForm">' +
            '<div class="field"><label for="username">Nom d\'utilisateur</label>' +
              '<input type="text" id="username" name="username" placeholder="ex : admin" autocomplete="username" required /></div>' +
            '<div class="field"><label for="password">Mot de passe</label>' +
              '<div class="pass-wrap"><input type="password" id="password" name="password" placeholder="8 caractères, lettres + chiffres" autocomplete="new-password" required />' +
              '<button type="button" class="toggle-pass" data-target="password">👁</button></div></div>' +
            '<div class="field"><label for="password2">Confirmer le mot de passe</label>' +
              '<div class="pass-wrap"><input type="password" id="password2" name="password2" placeholder="Retapez le mot de passe" autocomplete="new-password" required />' +
              '<button type="button" class="toggle-pass" data-target="password2">👁</button></div></div>' +
            '<button type="submit" class="btn-submit" id="submitBtn">🚀 Créer le compte admin</button>' +
          '</form>' +
        '</div>';

      // Toggle password visibility
      document.querySelectorAll('.toggle-pass').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var input = document.getElementById(btn.dataset.target);
          input.type = input.type === 'password' ? 'text' : 'password';
        });
      });

      document.getElementById('setupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var username  = document.getElementById('username').value.trim();
        var password  = document.getElementById('password').value;
        var password2 = document.getElementById('password2').value;
        var errorMsg  = document.getElementById('errorMsg');
        var submitBtn = document.getElementById('submitBtn');

        errorMsg.style.display = 'none';

        if (password !== password2) {
          errorMsg.textContent = 'Les mots de passe ne correspondent pas.';
          errorMsg.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Création…';

        var body = new URLSearchParams({ username: username, password: password });
        fetch('/api/auth/launchpad.php', { method: 'POST', body: body })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.ok) {
              submitBtn.textContent = '✓ Compte créé, redirection…';
              setTimeout(function() { window.location.href = '/compte'; }, 1000);
            } else {
              errorMsg.textContent = data.error || 'Erreur inconnue.';
              errorMsg.style.display = 'block';
              submitBtn.disabled = false;
              submitBtn.textContent = '🚀 Créer le compte admin';
            }
          })
          .catch(function() {
            errorMsg.textContent = 'Erreur réseau, réessayez.';
            errorMsg.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = '🚀 Créer le compte admin';
          });
      });
    }
  </script>

  <script src="/assets/js/theme.js"></script>
</body>
</html>
