<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
  <link rel="stylesheet" href="/assets/css/dark.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;900&family=Nunito:wght@400;600;700;900&display=swap">
  <title>CompoSmart – Rejoindre un événement</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #eef4ec; font-family: 'Nunito', Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

    nav { width: 100%; background: #1e6e3e; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; z-index: 100; }
    .nav-logo { font-family: 'Baloo 2', cursive; font-size: 1.4rem; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; font-style: italic; text-decoration: none; }
    .nav-logo span { color: #a8e6bf; }

    .hero { text-align: center; padding: 28px 20px 8px; }
    .hero-badge { display: inline-block; background: #a8e6bf; color: #1a3a25; font-size: 0.82rem; font-weight: 800; padding: 5px 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    h1 { font-family: 'Baloo 2', cursive; font-size: clamp(1.5rem, 5vw, 2.4rem); font-weight: 900; color: #1a3a25; }
    .hero-sub { font-size: 0.95rem; color: #4a7a5a; margin-top: 6px; font-weight: 600; }

    .evt-card { background: #fff; border-radius: 20px; box-shadow: 0 4px 24px rgba(30,110,62,0.10); width: 100%; max-width: 480px; margin: 16px; padding: 28px 24px 30px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.78rem; font-weight: 800; color: #2c4a34; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .field input { display: block; width: 100%; padding: 11px 14px; border: 1.5px solid #c8dfc8; border-radius: 10px; font-size: 0.95rem; color: #1a3a25; background: #f7fbf8; outline: none; font-family: inherit; transition: border-color 0.15s; }
    .field input:focus { border-color: #1e6e3e; background: #fff; }
    .code-input { text-align: center; font-family: 'Baloo 2', cursive; font-size: 1.6rem; font-weight: 900; letter-spacing: 6px; text-transform: uppercase; }

    .msg { border-radius: 10px; padding: 11px 14px; font-size: 0.88rem; font-weight: 700; margin-bottom: 16px; display: none; }
    .msg.error { background: #fdecea; color: #c0392b; }
    .msg.ok { background: #e8f5e9; color: #1e6e3e; }

    .btn-submit { display: block; width: 100%; background: #1e6e3e; color: #fff; border: none; border-radius: 50px; padding: 13px; font-size: 1rem; font-weight: 800; cursor: pointer; transition: opacity 0.15s; margin-top: 4px; font-family: 'Baloo 2', cursive; }
    .btn-submit:hover { opacity: 0.88; }
    .btn-submit:disabled { opacity: 0.5; cursor: default; }

    .evt-recap { text-align: center; padding: 4px 0 18px; }
    .evt-recap-titre { font-family: 'Baloo 2', cursive; font-size: 1.3rem; font-weight: 900; color: #1a3a25; }
    .evt-recap-meta { font-size: 0.85rem; color: #4a7a5a; font-weight: 700; margin-top: 6px; }

    .confirm { text-align: center; padding: 10px 4px; }
    .confirm-emoji { font-size: 2.8rem; }
    .confirm-text { font-size: 1rem; color: #1a3a25; font-weight: 800; margin: 14px 0 4px; }
    .confirm-sub { font-size: 0.85rem; color: #4a7a5a; font-weight: 600; }

    .bottom-leaf { position: fixed; bottom: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #1e6e3e, #52b788, #a7c957, #52b788, #1e6e3e); }

    html.dark body { background-color: #101a13; }
    html.dark nav { background: #14301f; }
    html.dark .evt-card { background: #1a2b1e; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
    html.dark h1, html.dark .evt-recap-titre, html.dark .confirm-text { color: #e8f5ee; }
    html.dark .field label { color: #7ab88e; }
    html.dark .field input { background: #1e2d22; border-color: #2d4030; color: #e8f5ee; }
    html.dark .field input:focus { border-color: #52b788; background: #243328; }
  </style>
  <link rel="stylesheet" href="/assets/css/desktop.css">
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">Compo<span>Smart</span></a>
  </nav>

  <div class="hero">
    <div class="hero-badge">🎟️ Événement</div>
    <h1>Rejoindre un événement</h1>
    <p class="hero-sub">Entre le code communiqué en salle, ou scanne le QR affiché.</p>
  </div>

  <div class="evt-card" id="card">
    <div class="msg" id="msg"></div>

    <form id="codeForm">
      <div class="field">
        <label>Code de l'événement</label>
        <input type="text" id="code" class="code-input" maxlength="6" placeholder="482913" autocomplete="off" required>
      </div>
      <button type="submit" class="btn-submit" id="btnVerifier">Continuer</button>
    </form>

    <div id="recapZone" style="display:none">
      <div class="evt-recap">
        <div class="evt-recap-titre" id="evtTitre"></div>
        <div class="evt-recap-meta" id="evtMeta"></div>
      </div>
      <form id="joinForm">
        <div class="field">
          <label>Ton nom</label>
          <input type="text" id="nomAffiche" maxlength="100" placeholder="Prénom Nom" autocomplete="off" required>
        </div>
        <button type="submit" class="btn-submit" id="btnRejoindre">Je participe</button>
      </form>
    </div>

    <div id="confirmZone" style="display:none">
      <div class="confirm">
        <div class="confirm-emoji">✅</div>
        <div class="confirm-text" id="confirmTitre"></div>
        <div class="confirm-sub">Tu es inscrit, bienvenue !</div>
      </div>
    </div>
  </div>

  <div class="bottom-leaf"></div>

  <script>
    var msg = document.getElementById('msg');
    var codeForm = document.getElementById('codeForm');
    var codeInput = document.getElementById('code');
    var recapZone = document.getElementById('recapZone');
    var confirmZone = document.getElementById('confirmZone');
    var codeValide = '';

    function afficherMsg(texte, ok) {
      msg.className = 'msg ' + (ok ? 'ok' : 'error');
      msg.textContent = texte;
      msg.style.display = 'block';
    }

    // Pré-remplissage depuis le lien du QR (?code=482913)
    var params = new URLSearchParams(window.location.search);
    if (params.get('code')) codeInput.value = params.get('code').toUpperCase();

    codeForm.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.style.display = 'none';
      var btn = document.getElementById('btnVerifier');
      btn.disabled = true; btn.textContent = 'Vérification…';

      fetch('/api/evenements/rejoindre.php?action=verifier_code&code=' + encodeURIComponent(codeInput.value))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) { afficherMsg(d.error || 'Code invalide.', false); return; }
          if (!d.ouvert) { afficherMsg("Cet événement n'accepte pas encore d'inscription.", false); return; }
          codeValide = codeInput.value.trim().toUpperCase();
          document.getElementById('evtTitre').textContent = d.titre;
          var meta = d.lieu ? d.lieu : '';
          if (d.date) meta += (meta ? ' · ' : '') + new Date(d.date.replace(' ', 'T')).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
          document.getElementById('evtMeta').textContent = meta;
          codeForm.style.display = 'none';
          recapZone.style.display = 'block';
        })
        .catch(function () { afficherMsg('Erreur réseau, réessaie.', false); })
        .finally(function () { btn.disabled = false; btn.textContent = 'Continuer'; });
    });

    document.getElementById('joinForm').addEventListener('submit', function (e) {
      e.preventDefault();
      msg.style.display = 'none';
      var btn = document.getElementById('btnRejoindre');
      btn.disabled = true; btn.textContent = 'Inscription…';

      var body = new URLSearchParams({
        code: codeValide,
        nom_affiche: document.getElementById('nomAffiche').value.trim(),
      });
      fetch('/api/evenements/rejoindre.php?action=rejoindre', { method: 'POST', body: body })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) { afficherMsg(d.error || 'Erreur inconnue.', false); return; }
          document.getElementById('confirmTitre').textContent = d.titre;
          recapZone.style.display = 'none';
          confirmZone.style.display = 'block';
        })
        .catch(function () { afficherMsg('Erreur réseau, réessaie.', false); })
        .finally(function () { btn.disabled = false; btn.textContent = 'Je participe'; });
    });
  </script>
  <script src="/assets/js/theme.js"></script>
</body>
</html>
