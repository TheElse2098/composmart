<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CompoSmart — Page introuvable (404)</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">

  <!--
    Page d'erreur 404 du site (ErrorDocument dans .htaccess). Source unique :
    les contrôleurs d'administration de courses-api, games-api et
    evenements-api renvoient ce même fichier, copié dans leur image, pour
    qu'une adresse refusée soit indiscernable d'une adresse inexistante.
    Toutes les adresses sont absolues : la page est servie à n'importe quelle
    profondeur (/cours/x/y, /admin/z).
  -->

  <!-- En-tête type des pages migrées (docs/front.md) : thème posé avant le
       premier affichage, puis polices, couleurs et socle. -->
  <script src="/ui/socle/amorce.js"></script>
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/ui/styles/jetons.css">
  <link rel="stylesheet" href="/ui/styles/base.css">

  <link rel="stylesheet" href="/ui/pages/introuvable/introuvable.css">
  <link rel="stylesheet" href="/ui/composants/bandeau/bandeau.css">
  <link rel="stylesheet" href="/ui/composants/pied/pied.css">
  <script type="module" src="/ui/composants/bandeau/bandeau.js"></script>
  <script type="module" src="/ui/composants/pied/pied.js"></script>
</head>
<body>
  <cs-bandeau></cs-bandeau>

  <main class="introuvable">
    <div class="introuvable-emoji">🍂</div>
    <div class="introuvable-code">404</div>
    <h1 class="introuvable-titre">Cette page est partie au compost</h1>
    <p class="introuvable-texte">La page que tu cherches n'existe pas ou a été déplacée. Pas de panique, on te ramène en terrain connu !</p>
    <div class="introuvable-liens">
      <a href="/" class="introuvable-lien principal">🏠 Retour à l'accueil</a>
      <a href="/carte" class="introuvable-lien second">🗺️ Voir la carte</a>
    </div>
  </main>

  <cs-pied></cs-pied>
  <div class="cs-lisere"></div>
</body>
</html>
