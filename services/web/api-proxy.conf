# Routage /api/<domaine> vers le service API correspondant (mêmes préfixes que
# l'Ingress k8s, cf. MIGRATION-K8S.md §5). Les noms d'hôtes (map-api, games-api...)
# sont résolus par le DNS interne de Docker Compose / Kubernetes.
#
# ProxyPass préserve le chemin complet : /api/carte/sites.php → http://map-api/api/carte/sites.php
# donc le require '__DIR__/../_guard.php' des endpoints reste valide côté service.

ProxyPreserveHost On

ProxyPass        /api/carte  http://map-api/api/carte
ProxyPassReverse /api/carte  http://map-api/api/carte

ProxyPass        /api/jeux   http://games-api/api/jeux
ProxyPassReverse /api/jeux   http://games-api/api/jeux

ProxyPass        /api/cours  http://courses-api/api/cours
ProxyPassReverse /api/cours  http://courses-api/api/cours

ProxyPass        /api/contact http://courses-api/api/contact
ProxyPassReverse /api/contact http://courses-api/api/contact

ProxyPass        /api/admin  http://courses-api/api/admin
ProxyPassReverse /api/admin  http://courses-api/api/admin

ProxyPass        /api/auth   http://auth-api/api/auth
ProxyPassReverse /api/auth   http://auth-api/api/auth

ProxyPass        /api/evenements  http://evenements-api/api/evenements
ProxyPassReverse /api/evenements  http://evenements-api/api/evenements
