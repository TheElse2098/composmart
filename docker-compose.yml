services:
  frontend:
    build:
      context: ./app/frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - composmart

  backend:
    build:
      context: ./app/backend
    ports:
      - "8000:8000"
    volumes:
      - ./app/backend:/app
    env_file:
      - .env
    networks:
      - composmart

networks:
  composmart:
    driver: bridge
