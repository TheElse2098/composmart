# Étape 2.1 — architecture multi-services + 3 bases séparées (db-map/db-games/db-core).
# Lancer :  docker compose -f docker-compose.split.yml up --build
# Repartir de bases vides (wipe assumé) :  docker compose -f docker-compose.split.yml down -v
#
# ⚠️ En 2.1 le CODE n'est pas encore adapté : map-api/games-api lisent encore `users`
# (isAdmin, JOIN top-5) qui n'est plus dans leur base → les actions ADMIN et le top-5
# échoueront jusqu'à l'étape 2.2. La carte, la liste, le login restent fonctionnels.
#
# Le compose d'origine (docker-compose.yml) reste intact comme filet de sécurité.
services:
  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - map-api
      - games-api
      - courses-api
      - auth-api
      - evenements-api
    networks: [composmart]

  map-api:
    build:
      context: .
      dockerfile: services/map-api/Dockerfile
    environment:
      DB_HOST: db-map
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # map-api n'a pas la table audit_log : il l'écrit via auth-api.
      AUDIT_REMOTE_URL: http://auth-api/api/auth/audit.php
      AUDIT_SECRET: ${AUDIT_SECRET}
      # SMTP (notification mail des signalements) — vide = envoi désactivé.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      db-map: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [composmart]

  games-api:
    build:
      context: .
      dockerfile: services/games-api/Dockerfile
    environment:
      DB_HOST: db-games
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Crédit d'XP des jeux vers db-core, via l'endpoint interne d'auth-api
      # (même secret que l'audit : domaine de confiance service→service).
      XP_REMOTE_URL: http://auth-api/api/auth/xp.php
      AUDIT_SECRET: ${AUDIT_SECRET}
    depends_on:
      db-games: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [composmart]

  courses-api:
    build:
      context: .
      dockerfile: services/courses-api/Dockerfile
    environment:
      DB_HOST: db-core
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Suppression d'un compte par un admin : mêmes purges que auth-api.
      GAMES_PURGE_URL: http://games-api/api/jeux/purge.php
      MAP_PURGE_URL: http://map-api/api/carte/purge.php
      AUDIT_SECRET: ${AUDIT_SECRET}
      # SMTP (notification mail du formulaire contact) — vide = envoi désactivé.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      db-core: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [composmart]

  auth-api:
    build:
      context: .
      dockerfile: services/auth-api/Dockerfile
    environment:
      DB_HOST: db-core
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Secret partagé pour recevoir les événements d'audit de map-api.
      AUDIT_SECRET: ${AUDIT_SECRET}
      # Suppression de compte : purge/anonymisation des scores et signalements.
      GAMES_PURGE_URL: http://games-api/api/jeux/purge.php
      MAP_PURGE_URL: http://map-api/api/carte/purge.php
      # « Télécharger mes données » : sections des autres bases.
      GAMES_EXPORT_URL: http://games-api/api/jeux/export.php
      MAP_EXPORT_URL: http://map-api/api/carte/export.php
      EVENEMENTS_EXPORT_URL: http://evenements-api/api/evenements/export.php
    depends_on:
      db-core: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [composmart]

  evenements-api:
    build:
      context: .
      dockerfile: services/evenements-api/Dockerfile
    environment:
      DB_HOST: db-evenements
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # evenements-api n'a pas la table audit_log : il l'écrit via auth-api.
      AUDIT_REMOTE_URL: http://auth-api/api/auth/audit.php
      # Vérification isAdmin des pages /evenements-admin (pas d'accès direct à
      # `users`, db-core) — même secret partagé que l'audit.
      AUTH_ADMIN_CHECK_URL: http://auth-api/api/auth/est_admin.php
      AUDIT_SECRET: ${AUDIT_SECRET}
    depends_on:
      db-evenements: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [composmart]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [composmart]

  # ── 3 bases séparées (variante B). Chaque base initialise son propre schéma. ──
  db-map:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_map_data:/var/lib/mysql
      - ./db/map.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [composmart]

  db-games:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_games_data:/var/lib/mysql
      - ./db/games.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [composmart]

  db-core:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_core_data:/var/lib/mysql
      - ./db/core.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [composmart]

  db-evenements:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_evenements_data:/var/lib/mysql
      - ./db/evenements.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [composmart]

  # ── Seeds découpés : composts → db-map, cours → db-core (deux conteneurs jetables). ──
  seed-map:
    build:
      context: .
      dockerfile: services/map-api/Dockerfile
    environment:
      DB_HOST: db-map
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    entrypoint: ["php", "/docker-seeds/seed_map.php"]
    volumes:
      - ./shared/seeds:/docker-seeds
    depends_on:
      db-map: { condition: service_healthy }
    networks: [composmart]
    restart: "no"

  seed-core:
    build:
      context: .
      dockerfile: services/courses-api/Dockerfile
    environment:
      DB_HOST: db-core
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    entrypoint: ["php", "/docker-seeds/seed_core.php"]
    volumes:
      - ./shared/seeds:/docker-seeds
      - ./content:/var/www/html/content
    depends_on:
      db-core: { condition: service_healthy }
    networks: [composmart]
    restart: "no"

  # Rafraîchissement OSM quotidien à 3h15 (équivalent du CronJob k8s).
  # Boucle : dort jusqu'au prochain 3h15, lance import_osm (retries+miroirs), recommence.
  osm-cron:
    build:
      context: .
      dockerfile: services/map-api/Dockerfile
    environment:
      DB_HOST: db-map
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          now=$$(date +%s)
          next=$$(date -d 'tomorrow 03:15' +%s 2>/dev/null || date -v+1d -v3H -v15M -v0S +%s)
          today=$$(date -d 'today 03:15' +%s 2>/dev/null || date -v3H -v15M -v0S +%s)
          [ "$$today" -gt "$$now" ] && next=$$today
          sleep $$(( next - now ))
          echo "[osm-cron] $$(date) — rafraîchissement OSM"
          php /docker-seeds/import_osm.php || echo "[osm-cron] import échoué, prochain essai demain"
        done
    volumes:
      - ./shared/seeds:/docker-seeds
    depends_on:
      db-map: { condition: service_healthy }
    networks: [composmart]
    restart: unless-stopped

  # Purges RGPD nocturnes (équivalent des CronJobs k8s purge-rgpd-*), 4h00 puis 4h10.
  purge-cron-core:
    build:
      context: .
      dockerfile: services/auth-api/Dockerfile
    environment:
      DB_HOST: db-core
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GAMES_PURGE_URL: http://games-api/api/jeux/purge.php
      MAP_PURGE_URL: http://map-api/api/carte/purge.php
      AUDIT_SECRET: ${AUDIT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          now=$$(date +%s)
          next=$$(date -d 'tomorrow 04:00' +%s)
          today=$$(date -d 'today 04:00' +%s)
          [ "$$today" -gt "$$now" ] && next=$$today
          sleep $$(( next - now ))
          php /var/www/cron/purge_rgpd.php || echo "[purge-rgpd] échec, prochain essai demain"
        done
    depends_on:
      db-core: { condition: service_healthy }
    networks: [composmart]
    restart: unless-stopped

  purge-cron-evenements:
    build:
      context: .
      dockerfile: services/evenements-api/Dockerfile
    environment:
      DB_HOST: db-evenements
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          now=$$(date +%s)
          next=$$(date -d 'tomorrow 04:10' +%s)
          today=$$(date -d 'today 04:10' +%s)
          [ "$$today" -gt "$$now" ] && next=$$today
          sleep $$(( next - now ))
          php /var/www/cron/purge_rgpd.php || echo "[purge-rgpd] échec, prochain essai demain"
        done
    depends_on:
      db-evenements: { condition: service_healthy }
    networks: [composmart]
    restart: unless-stopped

networks:
  composmart:
    driver: bridge

volumes:
  db_map_data:
  db_games_data:
  db_core_data:
  db_evenements_data:
