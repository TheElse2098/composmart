# ============================================================================
# Valeurs de PRODUCTION (VPS OVH, k3s). Surcharge helm/composmart/values.yaml.
# Utilisé par défaut par ./helm/deploy.sh. Aucun secret ici (cf. values.yaml).
# ============================================================================

# Bases déjà remplies : ne pas rejouer les seeds à l'adoption par Helm.
seeds:
  lancer: false

# Tâches ponctuelles : ajouter une entrée, lancer ./helm/deploy.sh, lire les
# journaux affichés à la fin, puis retirer l'entrée.
#
# 25/10/2026 — simulation des purges RGPD (--dry : compte, n'efface rien).
# À RETIRER après lecture des résultats (remettre `ponctuels: {}`).
ponctuels:
  purge-essai:
    service: auth-api
    command: ["php", "/var/www/cron/purge_rgpd.php", "--dry"]
  purge-essai-evenements:
    service: evenements-api
    command: ["php", "/var/www/cron/purge_rgpd.php", "--dry"]
