{{- range $nom, $s := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ $nom }} }
spec:
  replicas: {{ $s.replicas }}
  selector: { matchLabels: { app: {{ $nom }} } }
  template:
    metadata: { labels: { app: {{ $nom }} } }
    spec:
      {{- include "composmart.pullSecrets" $ | nindent 6 }}
      containers:
        - name: {{ $nom }}
          image: {{ include "composmart.image" (dict "root" $ "nom" $nom) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports: [{ containerPort: 80 }]
          {{- $env := include "composmart.env" (dict "root" $ "nom" $nom) }}
          {{- if trim $env }}
          env:
            {{- $env | nindent 12 }}
          {{- end }}
          resources: {{- toYaml $s.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: {{ $s.health }}, port: 80 }
            initialDelaySeconds: {{ $s.healthDelay | default 5 }}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: {{ $nom }} }
spec:
  selector: { app: {{ $nom }} }
  ports: [{ port: 80, targetPort: 80 }]
---
{{- with $s.hpa }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ $nom }} }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $nom }} }
  minReplicas: {{ .min }}
  maxReplicas: {{ .max }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .cpu }} } }
---
{{- end }}
{{- end }}
