# auth-api — api/auth/* — login, register, me, profile, leaderboard, launchpad.
# Source de vérité du profil et de l'XP (db-core). Appelé en interne par les autres
# services pour créditer l'XP (cf. MIGRATION-K8S.md §3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: composmart
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-api }
  template:
    metadata:
      labels: { app: auth-api }
    spec:
      containers:
        - name: auth-api
          image: ghcr.io/theelse2098/composmart/auth-api:latest  # ← tag SHA en prod
          ports: [{ containerPort: 80 }]
          envFrom:
            - secretRef: { name: db-core-credentials }
          env:
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /api/auth/health.php, port: 80 }  # ← endpoint health à ajouter
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: composmart
spec:
  selector: { app: auth-api }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-api
  namespace: composmart
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: auth-api }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
