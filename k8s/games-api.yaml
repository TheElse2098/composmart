# games-api — api/jeux/* — scores des mini-jeux.
# Lit/écrit db-games. Le top-5 affiche un username dénormalisé (cf. MIGRATION-K8S.md §3),
# donc pas de dépendance directe à db-core pour la lecture.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: games-api
  namespace: composmart
spec:
  replicas: 1
  selector:
    matchLabels: { app: games-api }
  template:
    metadata:
      labels: { app: games-api }
    spec:
      containers:
        - name: games-api
          image: ghcr.io/theelse2098/composmart/games-api:latest  # ← tag SHA en prod
          ports: [{ containerPort: 80 }]
          envFrom:
            - secretRef: { name: db-games-credentials }
          env:
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
            # URL interne d'auth-api si les jeux créditent un jour de l'XP (cf. §3)
            - { name: AUTH_API_URL, value: "http://auth-api" }
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /api/jeux/health.php, port: 80 }  # ← endpoint health à ajouter
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: games-api
  namespace: composmart
spec:
  selector: { app: games-api }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: games-api
  namespace: composmart
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: games-api }
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
