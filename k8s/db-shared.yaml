# VARIANTE A — 1 seule instance MariaDB hébergeant 3 bases logiques.
# Recommandée pour un petit VPS. La séparation reste appliquée au niveau du CODE :
# chaque service ne reçoit que les credentials/nom de SA base.
# Les 3 Services ClusterIP (db-map/db-games/db-core) pointent tous vers ce même pod,
# ce qui permet de passer à la VARIANTE B plus tard SANS toucher la config des apps.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: composmart
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: db-core-credentials, key: DB_ROOT_PASSWORD } }
            - name: MARIADB_USER
              valueFrom: { secretKeyRef: { name: db-core-credentials, key: DB_USER } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-core-credentials, key: DB_PASSWORD } }
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          readinessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        # Monte db/*.sql via ConfigMap pour créer les 3 bases logiques au 1er démarrage.
        # À générer : kubectl create configmap mariadb-init --from-file=db/ -n composmart
        # (les fichiers doivent créer composmart_map / composmart_games / composmart_core)
        - name: init
          configMap:
            name: mariadb-init
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Les 3 noms de service attendus par les apps pointent vers l'unique instance.
apiVersion: v1
kind: Service
metadata: { name: db-map, namespace: composmart }
spec:
  selector: { app: mariadb }
  ports: [{ port: 3306, targetPort: 3306 }]
---
apiVersion: v1
kind: Service
metadata: { name: db-games, namespace: composmart }
spec:
  selector: { app: mariadb }
  ports: [{ port: 3306, targetPort: 3306 }]
---
apiVersion: v1
kind: Service
metadata: { name: db-core, namespace: composmart }
spec:
  selector: { app: mariadb }
  ports: [{ port: 3306, targetPort: 3306 }]
