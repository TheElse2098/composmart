# map-api — api/carte/* — service le PLUS lourd (Haversine sur ~5800 composts).
# Cible n°1 de l'autoscaling : min 2 / max 8 pods. C'est ce service qui absorbe
# les pics de la carte sans impacter web / games / courses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: map-api
  namespace: composmart
spec:
  replicas: 2
  selector:
    matchLabels: { app: map-api }
  template:
    metadata:
      labels: { app: map-api }
    spec:
      containers:
        - name: map-api
          image: ghcr.io/theelse2098/composmart/map-api:latest  # ← tag SHA en prod
          ports: [{ containerPort: 80 }]
          envFrom:
            - secretRef: { name: db-map-credentials }
          env:
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /api/carte/health.php, port: 80 }  # ← endpoint health à ajouter
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: map-api
  namespace: composmart
spec:
  selector: { app: map-api }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: map-api
  namespace: composmart
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: map-api }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
