# VARIANTE B — 3 StatefulSets MariaDB indépendants (scaling/isolation DB réelle).
# À utiliser à la place de db-shared.yaml quand le VPS a assez de RAM.
# Chaque base a son propre PVC et son propre secret.
#
# Bloc répété 3× (db-map / db-games / db-core). Seuls changent : le nom,
# le secret référencé, et le ConfigMap d'init (map.sql / games.sql / core.sql).
---
# ───────────────────────── db-map ─────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: db-map, namespace: composmart }
spec:
  serviceName: db-map
  replicas: 1
  selector: { matchLabels: { app: db-map } }
  template:
    metadata: { labels: { app: db-map } }
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          envFrom:
            - secretRef: { name: db-map-credentials }
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: db-map-credentials, key: DB_ROOT_PASSWORD } }
            - name: MARIADB_DATABASE
              valueFrom: { secretKeyRef: { name: db-map-credentials, key: DB_NAME } }
            - name: MARIADB_USER
              valueFrom: { secretKeyRef: { name: db-map-credentials, key: DB_USER } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-map-credentials, key: DB_PASSWORD } }
          ports: [{ containerPort: 3306 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          readinessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: init
          configMap: { name: db-map-init, optional: true }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: db-map, namespace: composmart }
spec:
  selector: { app: db-map }
  ports: [{ port: 3306, targetPort: 3306 }]
---
