            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: composmart-secrets, key: DB_PASSWORD } } }
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /api/jeux/health.php, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
