# ════════════════════════ INGRESS (Traefik) ════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: composmart
  namespace: composmart
  annotations:
    # HTTPS via cert-manager. Vérifier que le nom correspond bien à l'issuer
    # du cluster : `kubectl get clusterissuer` (sinon adapter ici).
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [composmart.fr]
      secretName: composmart-tls
  rules:
    - http:
        paths:
          - { path: /api/carte, pathType: Prefix, backend: { service: { name: map-api,     port: { number: 80 } } } }
          - { path: /api/jeux,  pathType: Prefix, backend: { service: { name: games-api,   port: { number: 80 } } } }
          - { path: /api/cours, pathType: Prefix, backend: { service: { name: courses-api, port: { number: 80 } } } }
          - { path: /api/contact, pathType: Prefix, backend: { service: { name: courses-api, port: { number: 80 } } } }
          - { path: /api/admin, pathType: Prefix, backend: { service: { name: courses-api, port: { number: 80 } } } }
          # Pages d'administration : servies par courses-api et non par « web »,
          # car elles doivent être contrôlées côté serveur. Un .html statique
          # laisserait sa coquille téléchargeable par n'importe qui ; ici un
          # non-admin reçoit une 404 indiscernable d'une URL inexistante.
          - { path: /admin,     pathType: Prefix, backend: { service: { name: courses-api, port: { number: 80 } } } }
          - { path: /api/auth,  pathType: Prefix, backend: { service: { name: auth-api,    port: { number: 80 } } } }
          - { path: /,          pathType: Prefix, backend: { service: { name: web,         port: { number: 80 } } } }
