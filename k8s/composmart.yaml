            - { name: REDIS_PORT, value: "6379" }
            # Crédit d'XP des jeux vers db-core via l'endpoint interne d'auth-api.
            - { name: XP_REMOTE_URL, value: "http://auth-api/api/auth/xp.php" }
            - { name: AUDIT_SECRET, valueFrom: { secretKeyRef: { name: composmart-secrets, key: AUDIT_SECRET } } }
