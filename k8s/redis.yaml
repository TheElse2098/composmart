# Sessions PHP partagées + rate-limiting partagé (cf. MIGRATION-K8S.md §4).
# Pas de persistance : la perte du cache de sessions/rate-limit au redémarrage est acceptable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: composmart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "192Mi" }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: composmart
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
