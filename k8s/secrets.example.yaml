# Copier en secrets.yaml (gitignored), remplir les vraies valeurs, puis :
#   kubectl apply -f k8s/secrets.yaml
# Un secret par base : chaque service ne reçoit QUE les credentials de SA base.
apiVersion: v1
kind: Secret
metadata:
  name: db-map-credentials
  namespace: composmart
type: Opaque
stringData:
  DB_HOST: db-map
  DB_NAME: composmart_map
  DB_USER: composmart
  DB_PASSWORD: changeme
  DB_ROOT_PASSWORD: changeme_root
---
