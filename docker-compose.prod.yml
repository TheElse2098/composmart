services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/theelse2098/composmart/web:latest}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - composmart

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - composmart

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - composmart
    environment:
      ACME_AGREE: "true"

networks:
  composmart:
    driver: bridge

volumes:
  db_data:
  caddy_data:
  caddy_config:
